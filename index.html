ew Guinea","scale":"song phương","summary":"New Zealand và Papua New Guinea ký Tuyên bố Ý định về Hợp tác Quốc phòng giai đoạn 2026-2029, mở rộng đối thoại quốc phòng, huấn luyện, diễn tập chung và trao đổi nhân sự. Thỏa thuận nối tiếp Tuyên bố Đối tác NZ-PNG 2025-2029, nằm trong nỗ lực của Australia, New Zealand và Mỹ nhằm củng cố quan hệ an ninh với các đảo quốc Thái Bình Dương trước ảnh hưởng ngày càng lớn của Trung Quốc.","items":[{"date":"2026-07-22","title":"New Zealand, Papua New Guinea ký Tuyên bố Ý định về Hợp tác Quốc phòng 2026-2029","summary":"Bộ trưởng Quốc phòng New Zealand Chris Penk và Bộ trưởng Quốc phòng Papua New Guinea Elias Kapavore ký thỏa thuận mở rộng đối thoại, huấn luyện, diễn tập và trao đổi nhân sự quốc phòng, giữa lúc phương Tây đẩy mạnh gắn kết an ninh Thái Bình Dương.","sourceName":"Beehive.govt.nz","sourceUrl":"https://www.beehive.govt.nz/release/nz-and-png-strengthen-defence-ties"}]},{"name":"Mỹ - Saudi Arabia ký Thỏa thuận 123 hợp tác hạt nhân dân sự","status":"recent","dates":"22/7/2026","location":"Washington D.C., Mỹ","scale":"song phương — Bộ trưởng Năng lượng Mỹ Chris Wright và Bộ trưởng Năng lượng Saudi Arabia Hoàng tử Abdulaziz bin Salman","summary":"Mỹ và Saudi Arabia ký Thỏa thuận 123 (theo Đạo luật Năng lượng Nguyên tử 1954) cùng một thỏa thuận an toàn hạt nhân song phương kèm theo, mở đường cho hợp tác hạt nhân dân sự kéo dài 30 năm trị giá hàng tỷ USD, ưu tiên doanh nghiệp Mỹ phát triển hạ tầng hạt nhân Saudi Arabia. Thỏa thuận cho phép nghiên cứu chung 2 năm về khả năng làm giàu uranium trong nước; Tổng thống Trump gắn thỏa thuận với điều kiện Saudi Arabia gia nhập Hiệp định Abraham, trong khi một số nghị sĩ Quốc hội Mỹ lo ngại nguy cơ chạy đua vũ khí hạt nhân ở Trung Đông.","items":[{"date":"2026-07-23","title":"Mỹ, Saudi Arabia ký thỏa thuận hạt nhân dân sự, Trump gắn điều kiện gia nhập Hiệp định Abraham","summary":"Bộ trưởng Năng lượng Mỹ Chris Wright và Bộ trưởng Năng lượng Saudi Arabia Hoàng tử Abdulaziz bin Salman ký Thỏa thuận 123 và thỏa thuận an toàn hạt nhân kèm theo ngày 22/7, cho phép doanh nghiệp Mỹ tham gia sâu vào chương trình hạt nhân dân sự của Saudi Arabia và mở nghiên cứu chung 2 năm về làm giàu uranium. Tổng thống Trump tuyên bố thỏa thuận có điều kiện Saudi Arabia phải gia nhập Hiệp định Abraham, trong khi nghị sĩ Mỹ yêu cầu kèm ràng buộc chống phổ biến vũ khí hạt nhân.","sourceName":"Time","sourceUrl":"https://time.com/article/2026/07/23/us-saudi-arabia-nuclear-deal-explainer/"}]},{"name":"Canada - Ecuador ký Hiệp định Thương mại Tự do (FTA)","status":"recent","dates":"24/7/2026","location":"Ottawa, Canada","scale":"song phương","summary":"Ngày 24/7/2026, Bộ trưởng Thương mại Quốc tế Canada Maninder Sidhu và Bộ trưởng Sản xuất, Ngoại thương và Đầu tư Ecuador Luis Jaramillo ký Hiệp định Thương mại Tự do Canada - Ecuador tại Ottawa sau 10 tháng đàm phán. Hiệp định gồm 29 chương, mở cửa miễn thuế cho 99,6% hàng xuất khẩu của Ecuador sang Canada, đưa Ecuador vào vị thế ngang bằng với Colombia và Peru trong quan hệ thương mại với Canada; hai bên sẽ tiến hành phê chuẩn trong nước trước khi hiệp định có hiệu lực.","items":[{"date":"2026-07-24","title":"Canada, Ecuador ký hiệp định thương mại tự do tại Ottawa","summary":"Canada và Ecuador chính thức ký FTA song phương, miễn thuế cho hơn 600 mặt hàng Ecuador (chuối, ca cao, tôm, trái cây nhiệt đới...) trong khi giữ bảo hộ cho 227 mặt hàng nông sản nhạy cảm của Canada như gạo, ngô, sữa, thịt, đường; hiệp định còn bao gồm dịch vụ, đầu tư, thương mại điện tử, lao động và môi trường.","sourceName":"Xinhua","sourceUrl":"https://english.news.cn/20260725/f28abebaa13645db98b72e77d88ee564/c.html"}]}],"terms":[{"term":"SLBM","explain":"Tên lửa đạn đạo phóng từ tàu ngầm — vũ khí hạt nhân chiến lược khó bị phát hiện, là trụ cột \"răn đe trên biển\" trong bộ ba hạt nhân."},{"term":"JL-3","explain":"Tên lửa đạn đạo phóng từ tàu ngầm thế hệ ba của Trung Quốc, tầm bắn ước tính trên 10.000 km, đủ vươn tới lục địa Mỹ từ vùng biển gần Trung Quốc."},{"term":"DF-17","explain":"Tên lửa của Trung Quốc mang đầu đạn lượn siêu vượt âm, tầm ~1.800–2.500 km, cơ động cao nhằm xuyên thủng các lá chắn phòng thủ tên lửa."},{"term":"MQ-9 Reaper","explain":"Máy bay không người lái vũ trang tầm xa của Mỹ, dùng cho trinh sát và tấn công; đơn giá cao khiến tổn thất lớn gây tốn kém."},{"term":"Patriot","explain":"Hệ thống tên lửa phòng không của Mỹ (biến thể PAC-3 chuyên đánh chặn tên lửa đạn đạo), được nhiều đồng minh sử dụng."},{"term":"Tomahawk","explain":"Tên lửa hành trình tấn công mặt đất tầm xa (~1.600 km) của Mỹ, phóng từ tàu chiến, tàu ngầm hoặc bệ mặt đất."},{"term":"Eo biển Hormuz","explain":"Điểm nghẽn hàng hải chiến lược giữa Vịnh Ba Tư và Vịnh Oman, nơi trung chuyển khoảng 1/5 lượng dầu tiêu thụ toàn cầu."},{"term":"CENTCOM","explain":"Bộ Tư lệnh Trung tâm Mỹ, phụ trách các hoạt động quân sự ở Trung Đông, Bắc Phi và Trung Á."},{"term":"IRGC","explain":"Vệ binh Cách mạng Hồi giáo Iran — lực lượng quân sự - chính trị tinh nhuệ, kiểm soát chương trình tên lửa và các lực lượng ủy nhiệm của Iran."},{"term":"Hạm đội 5","explain":"Hạm đội 5 Hải quân Mỹ, đặt bộ chỉ huy tại Bahrain, phụ trách vùng Vịnh, Biển Đỏ và Ấn Độ Dương."},{"term":"RIMPAC","explain":"Rim of the Pacific — cuộc tập trận hải quân đa quốc gia lớn nhất thế giới do Mỹ chủ trì hai năm một lần tại Hawaii."},{"term":"Joint Sea","explain":"Chuỗi tập trận hải quân chung thường niên giữa Trung Quốc và Nga, biểu tượng cho hợp tác quân sự ngày càng sâu giữa hai nước."},{"term":"NATO","explain":"Tổ chức Hiệp ước Bắc Đại Tây Dương — liên minh quân sự phòng thủ tập thể gồm Mỹ và các nước châu Âu, Canada, Thổ Nhĩ Kỳ."},{"term":"AUKUS","explain":"Hiệp ước an ninh ba bên Úc - Anh - Mỹ (2021), trọng tâm là trang bị tàu ngầm chạy bằng năng lượng hạt nhân cho Úc."},{"term":"ASBM","explain":"Tên lửa đạn đạo diệt hạm — tên lửa đạn đạo có khả năng đánh trúng tàu chiến di động trên biển, thay đổi cán cân tác chiến hải quân."},{"term":"CASD","explain":"Continuous At-Sea Deterrence — răn đe trên biển liên tục, tức luôn có ít nhất một tàu ngầm mang tên lửa hạt nhân tuần tra sẵn sàng."},{"term":"AWACS","explain":"Máy bay chỉ huy - cảnh báo sớm trên không (như E-3 Sentry), làm \"mắt thần\" quản lý không phận và điều phối tác chiến."},{"term":"ADB","explain":"Ngân hàng Phát triển châu Á — định chế tài chính đa phương hỗ trợ phát triển kinh tế - xã hội khu vực châu Á - Thái Bình Dương."},{"term":"IMF","explain":"Quỹ Tiền tệ Quốc tế — định chế giám sát ổn định tài chính toàn cầu, cho vay và tư vấn chính sách cho các nước thành viên."},{"term":"Vùng phi hạt nhân Nam Thái Bình Dương","explain":"Khu vực được Hiệp ước Rarotonga (1985) tuyên bố cấm thử, bố trí và tàng trữ vũ khí hạt nhân ở Nam Thái Bình Dương."},{"term":"Lợi suất trái phiếu","explain":"Mức sinh lời của trái phiếu; lợi suất tăng phản ánh nhà đầu tư đòi bù đắp rủi ro cao hơn hoặc lo ngại tài khóa/lạm phát."},{"term":"Phi đô la hóa","explain":"Xu hướng các nước giảm phụ thuộc vào đồng USD trong dự trữ, thanh toán và thương mại quốc tế."},{"term":"Đất hiếm","explain":"Nhóm 17 nguyên tố thiết yếu cho điện tử, xe điện và vũ khí công nghệ cao; Trung Quốc hiện thống trị khâu chế biến toàn cầu."},{"term":"Greenland","explain":"Hòn đảo tự trị thuộc Đan Mạch, vị trí chiến lược ở Bắc Cực và giàu khoáng sản; là mục tiêu tham vọng lãnh thổ của Trump."},{"term":"Su-35","explain":"Tiêm kích đa năng hạng nặng thế hệ 4++ của Nga, một trong những chiến đấu cơ chủ lực của không quân Nga."},{"term":"Vốn hóa thị trường","explain":"Tổng giá trị thị trường của toàn bộ cổ phiếu một công ty, bằng giá cổ phiếu nhân số cổ phiếu lưu hành."},{"term":"Lớp Slava","explain":"Lớp tuần dương hạm mang tên lửa dẫn đường thời Liên Xô (Project 1164) của Nga; soái hạm Varyag thuộc Hạm đội Thái Bình Dương."}],"rejectedNews":[{"date":"2026-07-25","category":"Công nghệ quân sự","title":"Lý do Tổng thống Mỹ Trump đột ngột quay ngoắt với thỏa thuận hạt nhân Ả-rập Xê-út","summary":"","sourceName":"Báo Tiền Phong","so date":"2026-07-24","category":"Ngoại giao","title":"Liên hợp quốc lên tiếng khi tình hình Biển Đỏ leo thang, cảnh báo Yemen có thể rơi vào khủng hoảng mới","summary":"","sourceName":"Báo Thế Giới & Việt Nam","sourceUrl":"https://baomoi.com/lien-hop-quoc-len-tieng-khi-tinh-hinh-bien-do-leo-thang-canh-bao-yemen-co-the-roi-vao-khung-hoang-moi-c55682923.epi","region":"Trung Đông","reason":"Ứng viên Báo Mới không được chọn — 👍 để đưa vào bản tin","addedAt":"2026-07-24"},{"date":"2026-07-24","category":"Kinh tế","title":"Mỹ cảnh báo bất ổn thương mại khi EU phạt Google","summary":"","sourceName":"Báo Tin Tức TTXVN","sourceUrl":"https://baomoi.com/my-canh-bao-bat-on-thuong-mai-khi-eu-phat-google-c55683396.epi","region":"Châu Âu/NATO","reason":"Ứng viên Báo Mới không được chọn — 👍 để đưa vào bản tin","addedAt":"2026-07-24"},{"date":"2026-07-24","category":"Chính trị","title":"EU nhắm đòn trừng phạt hàng loạt công ty khai thác vàng Nga","summary":"","sourceName":"Báo Tin Tức TTXVN","sourceUrl":"https://baomoi.com/eu-nham-don-trung-phat-hang-loat-cong-ty-khai-thac-vang-nga-c55683695.epi","region":"Châu Âu/NATO","reason":"Ứng viên Báo Mới không được chọn — 👍 để đưa vào bản tin","addedAt":"2026-07-24"},{"date":"2026-07-24","category":"Công nghệ quân sự","title":"Hàn Quốc thay đổi lập trường chính sách với Triều Tiên, phi hạt nhân hóa không còn là 'điều kiện tiên quyết'","summary":"","sourceName":"Báo Thế Giới & Việt Nam","sourceUrl":"https://baomoi.com/han-quoc-thay-doi-lap-truong-chinh-sach-voi-trieu-tien-phi-hat-nhan-hoa-khong-con-la-dieu-kien-tien-quyet-c55683052.epi","region":"Đông Á","reason":"Ứng viên Báo Mới không được chọn — 👍 để đưa vào bản tin","addedAt":"2026-07-24"},{"date":"2026-07-24","category":"Ngoại giao","title":"Ông Trump tiết lộ thời điểm Chủ tịch Trung Quốc công du Mỹ","summary":"","sourceName":"Báo VietnamNet","sourceUrl":"https://baomoi.com/ong-trump-tiet-lo-thoi-diem-chu-tich-trung-quoc-cong-du-my-c55682954.epi","region":"Đông Á","reason":"Ứng viên Báo Mới không được chọn — 👍 để đưa vào bản tin","addedAt":"2026-07-24"}],"weeklyReport":{"weekStart":"2026-07-18","weekEnd":"2026-07-24","countries":[{"key":"us","flag":"🇺🇸","name":"Mỹ","lede":"Tuần này nước Mỹ bị cuốn theo hai trục lực song song: một cuộc chiến dịch quân sự kéo dài nhằm vào Iran đang đẩy [giá năng lượng](https://www.pressdemocrat.com/2026/07/23/wall-street-brent-crude-iran-war/) và chi phí quốc phòng lên cao, và một cỗ máy chính sách đối nội – thương mại vận hành hết công suất trước thềm bầu cử giữa kỳ. Washington vừa dồn hỏa lực vào Trung Đông, vừa mở đợt công kích ngoại giao dày đặc ở Ấn Độ Dương – Thái Bình Dương, cho thấy chính quyền Trump chấp nhận dàn mỏng nguồn lực để giữ thế chủ động trên nhiều mặt trận cùng lúc.","points":[{"title":"Chiến dịch Iran kéo dài thổi bùng cú sốc năng lượng và hóa đơn quốc phòng","body":"Sang ngày không kích thứ chín nhằm vào Iran, xung đột đã lan ra biển: Houthi tuyên bố [phong tỏa tuyến Saudi Arabia tại Bab el-Mandeb](https://www.reuters.com/world/middle-east/us-launches-iran-strikes-ninth-day-another-american-confirmed-killed-2026-07-20/) trong khi rủi ro tại eo Hormuz vẫn treo lơ lửng, đẩy dầu Brent có lúc vượt 100 USD/thùng và giá xăng Mỹ trở lại trên 4 USD/gallon. Bộ trưởng Quốc phòng Hegseth khai báo chiến dịch đã ngốn [37,5 tỷ USD](https://www.airandspaceforces.com/hegseth-iran-war-cost-37-5b/) và Nhà Trắng xin bổ sung 87,6 tỷ USD, biến chi phí chiến tranh thành điểm nóng tranh cãi ngân sách. Song song, Washington củng cố hậu phương chiến dịch bằng việc Bulgaria cho triển khai máy bay tiếp dầu KC-135 tại Bezmer và tái cấu trúc an ninh năng lượng Trung Đông qua [gói thỏa thuận 60 tỷ USD với Iraq](https://apnews.com/article/582b42f21cb62cfe8dc6c8e73d1dcafa) cùng hiệp định hạt nhân dân sự 30 năm kèm F-35 cho Saudi Arabia. Hàm ý chiến lược là năng lượng đắt đỏ có thể làm chậm đà giảm lạm phát, trói lãi suất ở mức cao và bào mòn dư địa chính trị của chính quyền ngay trước cuộc bỏ phiếu tháng 11.","sources":[{"name":"Associated Press","url":"https://www.pressdemocrat.com/2026/07/23/wall-street-brent-crude-iran-war/"},{"name":"Air & Space Forces Magazine","url":"https://www.airandspaceforces.com/hegseth-iran-war-cost-37-5b/"},{"name":"CNN","url":"https://www.cnn.com/2026/07/22/politics/us-saudi-nuclear-deal"}]},{"title":"Cỗ máy thuế quan tái lập sau thất bại pháp lý, định hình lại trật tự thương mại","body":"Sau khi Tòa Tối cao vô hiệu hóa thuế khẩn cấp theo IEEPA, chính quyền chuyển hướng dùng Section 301 và các điều khoản luật cũ để tái dựng một chế độ thuế quan toàn diện: USTR chuẩn bị [áp thuế 60 đối tác lớn với lý do lao động cưỡng bức](https://ustr.gov/about/policy-offices/congressional-affairs/congressional-hearings-and-testimony/2026/opening-statement-ambassador-greer-senate-finance-committee) (10% với EU, Canada, Mexico, Anh; 12,5% với Trung Quốc, Ấn Độ, Nhật, Hàn), đúng lúc phụ thu 10% toàn cầu hết hạn ngày 24/7. Các đòn đơn phương dựa trên cáo buộc phi thương mại được thử nghiệm rộng – [thuế 25% lên Brazil](https://www.washingtonpost.com/world/2026/07/22/trumps-new-tariffs-brazil-could-tip-election-lula-over-bolsonaro/), [50% lên hàng Canada theo Mục 338](https://fortune.com/2026/07/22/carney-trump-tariffs-canadian-canada-goods-negotiations/), và lộ trình thuế 100–200% lên thuốc gốc. Khối USMCA 32 năm tuổi đang bị chia tách khi Mexico đàm phán tiến xa còn Canada giậm chân, làm dấy lên rủi ro phân mảnh chuỗi cung ứng Bắc Mỹ. Đây là phép thử cho mô hình gây sức ép song phương thay đa phương, và tạo bất định kéo dài cho doanh nghiệp toàn cầu.","sources":[{"name":"U.S. Trade Representative","url":"https://ustr.gov/about/policy-offices/congressional-affairs/congressional-hearings-and-testimony/2026/opening-statement-ambassador-greer-senate-finance-committee"},{"name":"Reuters","url":"https://www.bnnbloomberg.ca/tariffs/2026/07/22/separate-us-talks-with-canada-mexico-test-north-americas-trilateral-trade-pact/"},{"name":"Fortune","url":"https://fortune.com/2026/07/22/carney-trump-tariffs-canadian-canada-goods-negotiations/"}]},{"title":"Ngân sách quốc phòng kỷ lục và cuộc tái vũ trang nền công nghiệp","body":"Hạ viện thông qua [NDAA tài khóa 2027](https://www.militarytimes.com/news/pentagon-congress/2026/07/22/house-passes-115-trillion-defense-budget-in-near-party-line-vote/) nâng ngân sách quốc phòng từ 900 tỷ lên 1.150 tỷ USD và đổi tên Lầu Năm Góc thành 'Bộ Chiến tranh', dù chỉ với tỷ lệ sít sao 216-212 phản ánh chia rẽ lưỡng đảng. Dòng tiền đổ vào lấp các khoảng trống lộ liễu sau xung đột Iran và chiến sự Ukraine: Lockheed ra mắt ['Patriot con' PAC-3 ACE](https://www.defenseone.com/technology/2026/07/lockheed-martin-unveils-baby-patriot-missile-address-urgent-gap/414897/) giá rẻ khi kho đánh chặn cạn một nửa, Raytheon nhận 1,8 tỷ USD radar SPY-6, Lục quân lập chương trình TIGER gỡ nút thắt động cơ Abrams, còn Space Force được bơm thêm 11,4 tỷ USD để gần gấp ba số vụ phóng. Farnborough chứng kiến làn sóng drone phối hợp giá rẻ (BETA MV250, Bullfrog diệt drone 10 USD/phát) theo hướng vũ khí 'tiêu hao được'. Tuy nhiên báo cáo GAO cảnh báo [chương trình siêu vượt âm CPS](https://www.gao.gov/products/gao-26-107974) trị giá hơn 50 tỷ USD thiếu chiến lược thống nhất và chậm 24 tháng, cho thấy tiền nhiều chưa đồng nghĩa với năng lực kịp thời.","sources":[{"name":"Military Times","url":"https://www.militarytimes.com/news/pentagon-congress/2026/07/22/house-passes-115-trillion-defense-budget-in-near-party-line-vote/"},{"name":"Defense One","url":"https://www.defenseone.com/technology/2026/07/lockheed-martin-unveils-baby-patriot-missile-address-urgent-gap/414897/"},{"name":"U.S. Government Accountability Office","url":"https://www.gao.gov/products/gao-26-107974"}]},{"title":"Đợt công kích ngoại giao Ấn Độ Dương – Thái Bình Dương tại Manila","body":"Giữa lúc bị hút vào khủng hoảng Iran, Washington vẫn dồn lực trấn an châu Á tại chuỗi hội nghị ASEAN ở Manila: Ngoại trưởng Rubio công bố [gói 2,5 tỷ USD đầu tư chiến lược](https://www.miragenews.com/boosting-us-security-and-growth-in-southeast-1714577/) cùng 130 triệu USD rà phá bom mìn, tái khẳng định ['liên minh sắt đá' với Philippines](https://www.upi.com/Top_News/US/2026/07/22/rubio-meets-Marcos-Manila/8191784759348/) kèm 100 triệu USD viện trợ quân sự ngay sau vụ đụng độ mới ở Bãi Cỏ Mây. Mỹ đồng thời siết mạng lưới đối tác qua họp ba bên Mỹ-Nhật-Hàn, thúc thỏa thuận thương mại – quốc phòng với Ấn Độ, và tái can dự Nam Thái Bình Dương bằng việc đưa [Peace Corps trở lại Solomon](https://www.state.gov/releases/office-of-the-spokesperson/2026/07/deputy-secretary-landaus-meeting-with-solomon-islands-prime-minister-wale) nhằm đối trọng Trung Quốc. Bên lề, Rubio gặp Lavrov 30 phút để dò lại kênh Ukraine. Thông điệp là Mỹ muốn chứng minh có thể vừa xử lý Trung Đông vừa không nhường sân chơi chiến lược ở châu Á cho Bắc Kinh.","sources":[{"name":"Mirage News","url":"https://www.miragenews.com/boosting-us-security-and-growth-in-southeast-1714577/"},{"name":"UPI","url":"https://www.upi.com/Top_News/US/2026/07/22/rubio-meets-Marcos-Manila/8191784759348/"},{"name":"U.S. Department of State","url":"https://www.state.gov/releases/office-of-the-spokesperson/2026/07/deputy-secretary-landaus-meeting-with-solomon-islands-prime-minister-wale"}]},{"title":"Nội bộ lập pháp tăng tốc dưới bóng bầu cử giữa kỳ","body":"Quốc hội chạy đua với lịch chính trị: Hạ viện vừa thông qua ngân sách tạm thời tới 4/12 để tránh lặp lại đợt đóng cửa 43 ngày, vừa chốt [khung ngân sách tài khóa 2027 với biên độ mong manh 216-214](https://rollcall.com/2026/07/22/gop-budget-blueprint-adopted-in-house-as-senate-resists/), khởi động gói reconciliation của Cộng hòa. Nỗ lực lưỡng đảng hiếm hoi cấm [nghị sĩ giao dịch cổ phiếu](https://www.cbsnews.com/news/congress-stock-trading-limits-house-vote/) lại bị gộp chung điều khoản ID cử tri, biến thành công cụ tranh cãi đảng phái. Bức tranh chính trị nền là [tín nhiệm Trump còn 36%](https://baomoi.com/bau-cu-giua-ky-my-nam-2026-va-nhung-khoang-trong-tin-nhiem-c55665288.epi) và khoảng cách ủng hộ – phản đối giãn ra khoảng 20 điểm, dù Dân chủ chưa chuyển hóa được bất mãn thành lợi thế bầu cử rõ rệt. Song song, Chủ tịch Fed Warsh cải tổ triệt để cách truyền thông, cắt bỏ định hướng chính sách khiến thị trường phải dùng AI để 'giải mã' – dấu hiệu thay đổi thể chế đáng chú ý. Kết quả tháng 11 sẽ định đoạt khả năng Nhà Trắng duy trì đường lối cứng rắn về thuế quan và Iran trong hai năm cuối nhiệm kỳ.","sources":[{"name":"Roll Call","url":"https://rollcall.com/2026/07/22/gop-budget-blueprint-adopted-in-house-as-senate-resists/"},{"name":"CBS News","url":"https://www.cbsnews.com/news/congress-stock-trading-limits-house-vote/"},{"name":"Thế giới & Việt Nam","url":"https://baomoi.com/bau-cu-giua-ky-my-nam-2026-va-nhung-khoang-trong-tin-nhiem-c55665288.epi"}]}]},{"key":"cn","flag":"🇨🇳","name":"Trung Quốc","lede":"Trung Quốc bước vào tuần này với thế giằng co giữa hai gọng: một mặt bị vòng vây ngoại giao – quân sự của Mỹ và đồng minh siết lại quanh Biển Đông và Đài Loan, mặt khác chủ động phô diễn năng lực răn đe mới và tung đòn kinh tế để giữ thế cân bằng. Bắc Kinh vừa đẩy mạnh ngoại giao láng giềng mềm mỏng với ASEAN, vừa để lộ những bước tiến cứng rắn về răn đe biển và không gian khiến cả khu vực cảnh giác.","points":[{"title":"Biển Đông dậy sóng và ngoại giao ASEAN hai mặt","body":"Va chạm mới tại Bãi Cỏ Mây khiến một quân nhân Philippines bị thương dẫn tới [cuộc gặp ngoại trưởng đầu tiên sau hai năm](https://thediplomat.com/2026/07/philippine-chinese-foreign-ministers-exchange-protests-over-south-china-sea-clash/) giữa Bắc Kinh và Manila, nơi hai bên trao đổi phản đối gay gắt nhưng vẫn nhất trí giữ kênh liên lạc để quản lý căng thẳng. Cùng lúc, Vương Nghị đẩy mạnh ngoại giao láng giềng – [gặp Tổng Thư ký ASEAN](https://english.news.cn/20260721/be7497c385f741dca01c5a0e58b6037d/c.html), viện dẫn mốc 50 năm Hiệp ước TAC và ủng hộ 'vai trò trung tâm' của khối – trong khi ARF thông qua [Kế hoạch Hành động Manila 2026-2036](https://baotintuc.vn/the-gioi/dien-dan-khu-vuc-asean-thong-qua-ke-hoach-hanh-dong-manila-giai-doan-20262036-20260723181606946.htm) chuyển hướng sang 'quản lý rủi ro chủ động'. Nhưng thế trận diễn ra ngay giữa vòng hiện diện dày đặc của Mỹ, Nhật, Ấn, Úc tại Manila và cam kết viện trợ quân sự Mỹ dành cho Philippines. Bắc Kinh đang chơi nước đôi: xoa dịu tập thể ASEAN để tránh bị dồn vào thế cô lập, đồng thời không lùi bước trên thực địa với từng nước tranh chấp.","sources":[{"name":"The Diplomat","url":"https://thediplomat.com/2026/07/philippine-chinese-foreign-ministers-exchange-protests-over-south-china-sea-clash/"},{"name":"Xinhua","url":"https://english.news.cn/20260721/be7497c385f741dca01c5a0e58b6037d/c.html"},{"name":"Báo Tin Tức (TTXVN)","url":"https://baotintuc.vn/the-gioi/dien-dan-khu-vuc-asean-thong-qua-ke-hoach-hanh-dong-manila-giai-doan-20262036-20260723181606946.htm"}]},{"title":"Phô diễn răn đe biển và không gian, kích hoạt phản ứng dây chuyền","body":"Vụ thử [tên lửa đạn đạo phóng từ tàu ngầm (SLBM)](https://www.yahoo.com/news/world/articles/australia-protests-chinas-destabilising-missile-053643489.html) bay sâu vào Thái Bình Dương và rơi gần Solomon, Nauru, Tuvalu đã khiến khoảng 12 quốc đảo và Úc đồng loạt phản đối, vì đây là vùng tự tuyên bố phi hạt nhân và Bắc Kinh không thông báo trước đầy đủ. Trên quỹ đạo, vệ tinh [Thực Tiễn-31](https://spacenews.com/chinas-shijian-31-satellite-is-sweeping-geo-using-a-unique-orbit/) bay theo quỹ đạo Molniya cải biến 'chưa từng thấy' để quét toàn bộ vành đai địa tĩnh, hé lộ năng lực giám sát và theo dõi vệ tinh đối phương ngày càng tinh vi. Đáp lại, Mỹ đưa [tên lửa siêu vượt âm Dark Eagle tới Guam](https://www.stripes.com/branches/army/2026-07-21/dark-eagle-guam-us-army-paparo-hypersonic-22323812.html) – đặt một phần lãnh thổ Trung Quốc vào tầm bắn – giữa lúc giới chức Mỹ cảnh báo Bắc Kinh được lệnh sẵn sàng cho kịch bản Đài Loan 2027 và diễn tập CSIS cho thấy khoảng cách năng lực AI quân sự chỉ còn tính bằng tháng. Vòng xoáy phô trương – đáp trả này đang thu hẹp không gian răn đe và đẩy khu vực vào thế chạy đua khí tài.","sources":[{"name":"Associated Press","url":"https://www.yahoo.com/news/world/articles/australia-protests-chinas-destabilising-missile-053643489.html"},{"name":"SpaceNews","url":"https://spacenews.com/chinas-shijian-31-satellite-is-sweeping-geo-using-a-unique-orbit/"},{"name":"Stars and Stripes","url":"https://www.stripes.com/branches/army/2026-07-21/dark-eagle-guam-us-army-paparo-hypersonic-22323812.html"}]},{"title":"Vũ khí hóa đất hiếm và sức ép chuỗi cung ứng","body":"Trung Quốc siết bán thiết bị chế biến đất hiếm cho nhà sản xuất nước ngoài, khiến hãng [Lynas của Úc phải đội chi phí mở rộng nhà máy Malaysia](https://asia.nikkei.com/business/markets/commodities/lynas-says-china-s-export-curbs-pushing-up-costs-of-malaysia-expansion) từ 180 lên gần 294 triệu AUD do buộc tìm nguồn thiết bị đắt hơn ngoài Trung Quốc. Đây là đòn tinh vi hơn cấm xuất khẩu nguyên liệu thô: khống chế chính công cụ sản xuất, kéo dài lợi thế độc quyền trong khâu chế biến vốn khó thay thế. Diễn biến này chạm thẳng vào đầu vào chiến lược cho quốc phòng, xe điện và chip, đúng lúc phương Tây đang chật vật đa dạng hóa nguồn cung khoáng sản quan trọng. Kết hợp với áp lực thuế 12,5% và [án phạt 550 triệu euro của EU với AliExpress](https://digital-strategy.ec.europa.eu/en/news/commission-fines-aliexpress-eu550-million-breaching-digital-services-act), Bắc Kinh đang chứng minh sẵn sàng dùng đòn bẩy chuỗi cung ứng như quân bài mặc cả trong cạnh tranh nước lớn.","sources":[{"name":"Nikkei Asia","url":"https://asia.nikkei.com/business/markets/commodities/lynas-says-china-s-export-curbs-pushing-up-costs-of-malaysia-expansion"},{"name":"European Commission","url":"https://digital-strategy.ec.europa.eu/en/news/commission-fines-aliexpress-eu550-million-breaching-digital-services-act"}]},{"title":"Quản trị cạnh tranh với Mỹ: kênh AI và thượng đỉnh giữa lằn ranh thuế quan","body":"Bất chấp căng thẳng, hai siêu cường vẫn giữ được đường dây quản trị xung đột: Mỹ và Trung Quốc sẽ tổ chức [đối thoại chính thức đầu tiên về AI vào tháng 9](https://www.cnbc.com/2026/07/21/us-china-ai-talks-bessent.html), do Bộ trưởng Tài chính Bessent dẫn đầu, nhiều khả năng dọn đường cho chuyến thăm Mỹ dự kiến ngày 24/9 của Chủ tịch Tập Cận Bình – kết quả cụ thể từ thượng đỉnh hồi tháng 5. Chủ đề AI đặc biệt nhạy cảm vì liên quan trực tiếp tới năng lực quân sự và tấn công hạ tầng trọng yếu. Nhưng khung đối thoại này song hành với sức ép kinh tế không giảm: thuế 12,5% theo điều tra lao động cưỡng bức và [lộ trình thuế thuốc gốc 100–200%](https://finance.yahoo.com/economy/policy/articles/trump-plans-100-tariff-generic-230559381.html) nhắm thẳng vào chuỗi sản xuất phụ thuộc Trung Quốc. Bắc Kinh chấp nhận vừa đàm vừa chịu đòn, giữ kênh ngoại giao mở để kiểm soát rủi ro leo thang trong khi bảo vệ lợi ích thương mại.","sources":[{"name":"CNBC","url":"https://www.cnbc.com/2026/07/21/us-china-ai-talks-bessent.html"},{"name":"Bloomberg","url":"https://finance.yahoo.com/economy/policy/articles/trump-plans-100-tariff-generic-230559381.html"}]}]},{"key":"ru","flag":"🇷🇺","name":"Nga","lede":"Nga bước vào tuần với thế công quân sự rõ rệt ở Ukraine nhưng chịu vòng vây kinh tế – ngoại giao ngày càng siết. Moscow tung [đợt tập kích tên lửa đạn đạo lớn nhất kể từ đầu chiến tranh](https://apnews.com/article/ddea9c0a10367fc84b3cb563896102e3) và mở rộng đánh phá ở Biển Đen, trong khi EU lần đầu dùng [hải quân chặn 'hạm đội bóng tối'](https://www.pravda.com.ua/eng/news/2026/07/22/8045390/) và kênh hòa đàm với Mỹ vẫn giậm chân tại chỗ. Ở trong nước, điện Kremlin thể chế hóa thêm công cụ trấn áp giới bất đồng chính kiến lưu vong, cho thấy quyết tâm cố thủ cho một cuộc chiến dài hơi.","points":[{"title":"Leo thang tập kích và cuộc đua tiêu hao phòng không","body":"Nga phóng 41 tên lửa và 125 UAV trong đợt tập kích tên lửa đạn đạo lớn nhất kể từ đầu chiến tranh nhằm vào Kyiv, phơi bày khoảng trống hệ thống của Ukraine khi thiếu Patriot để chống mục tiêu đạn đạo. Diễn biến này biến tốc độ bổ sung phòng không thành yếu tố sống còn: Lockheed ra mắt ['Patriot con' PAC-3 ACE](https://www.defenseone.com/technology/2026/07/lockheed-martin-unveils-baby-patriot-missile-address-urgent-gap/414897/) giá rẻ đúng lúc kho đánh chặn cạn kiệt, còn Lockheed và RTX bắt đầu [đàm phán sản xuất Patriot ngay trên lãnh thổ Ukraine](https://breakingdefense.com/2026/07/lockheed-rtx-in-early-talks-for-ukraine-patriot-production-execs-say/) để rút ngắn chuỗi cung ứng giữa chiến sự. Ở đầu chi phí thấp, Ukraine tung [drone đánh chặn phản lực Jetkiller tốc độ 370km/h](https://breakingdefense.com/2026/07/ukraines-skyfall-unveils-new-drone-interceptor-to-strike-russian-shaheds-faster/) nhắm mục tiêu sản xuất 50.000 chiếc/tháng để hạ Shahed rẻ hơn. Cuộc chiến ngày càng định hình quanh bài toán bất cân xứng chi phí và năng lực công nghiệp quốc phòng của cả hai phe.","sources":[{"name":"Associated Press","url":"https://apnews.com/article/ddea9c0a10367fc84b3cb563896102e3"},{"name":"Breaking Defense","url":"https://breakingdefense.com/2026/07/lockheed-rtx-in-early-talks-for-ukraine-patriot-production-execs-say/"},{"name":"Breaking Defense","url":"https://breakingdefense.com/2026/07/ukraines-skyfall-unveils-new-drone-interceptor-to-strike-russian-shaheds-faster/"}]},{"title":"Biển Đen thành điểm nóng đánh tàu thương mại","body":"Tàu chở ngô [Golden Leo](https://maritime-executive.com/article/multiple-crewmembers-killed-in-russian-strike-on-turkish-bulker) (chủ Thổ Nhĩ Kỳ, treo cờ Guinea-Bissau) bị tên lửa Nga đánh trúng khi rời Odesa khiến 10 người thiệt mạng, trong đó bốn công dân Ấn Độ, kéo New Delhi vào cuộc phản đối. Đây là vụ đánh tàu thương mại gây chết người nghiêm trọng nhất trong đợt leo thang gần đây, đẩy phí bảo hiểm và rủi ro thiếu tàu tăng vọt, đe dọa trực tiếp năng lực xuất khẩu ngũ cốc của Ukraine. Việc Moscow nhắm vào hành lang hàng hải cho thấy chiến lược bóp nghẹt kinh tế Ukraine bằng cách siết nguồn thu xuất khẩu, đồng thời chấp nhận rủi ro kéo Thổ Nhĩ Kỳ, Ấn Độ và giới hàng hải quốc tế sâu hơn vào tranh cãi. Ukraine đáp trả bằng các đòn vào hạ tầng dầu khí và hậu cần Nga, mở rộng vòng xoáy tấn công vào mục tiêu kinh tế.","sources":[{"name":"The Maritime Executive","url":"https://maritime-executive.com/article/multiple-crewmembers-killed-in-russian-strike-on-turkish-bulker"}]},{"title":"EU siết vòng vây trừng phạt nhưng lộ rạn nứt nội bộ","body":"Lần đầu tiên EU dùng lực lượng hải quân trực tiếp chặn kiểm tra [tàu chở dầu MV South Star](https://www.pravda.com.ua/eng/news/2026/07/22/8045390/) nghi treo cờ giả và thuộc 'hạm đội bóng tối' giúp Nga né trừng phạt, qua Chiến dịch EUNAVFOR MED IRINI – bước leo thang từ trừng phạt hành chính sang hành động cưỡng chế trên biển. Tuy nhiên, ngay tại Brussels, [gói trừng phạt thứ 21](https://www.euronews.com/my-europe/2026/07/22/brussels-double-deadlock) nhắm khoảng 215 cá nhân và gần 90 ngân hàng Nga bị bế tắc vì Hy Lạp phản đối điều khoản cấm vận LNG để bảo vệ đội tàu LNG lớn nhất châu Âu của mình. Sự tương phản này phơi bày mâu thuẫn cốt lõi của phương Tây: quyết tâm siết nguồn thu năng lượng của Nga vấp phải chính lợi ích kinh tế phân tán trong nội bộ khối, làm chậm dòng gây sức ép ngay giữa lúc chiến sự leo thang.","sources":[{"name":"Ukrainska Pravda","url":"https://www.pravda.com.ua/eng/news/2026/07/22/8045390/"},{"name":"Euronews","url":"https://www.euronews.com/my-europe/2026/07/22/brussels-double-deadlock"}]},{"title":"Ngoại giao Ukraine bế tắc khi Mỹ dồn trọng tâm sang Iran","body":"Ngoại trưởng [Rubio và Lavrov gặp nhau hơn 30 phút](https://www.koreatimes.co.kr/world/20260723/rubio-meets-russias-lavrov-in-manila-to-try-to-revive-prospect-of-us-helping-end-war-in-ukraine) bên lề hội nghị ASEAN tại Manila để bàn về Ukraine, nhưng cuộc trao đổi chỉ được mô tả là 'thẳng thắn' mà không có đột phá. Rubio thừa nhận cần đề xuất mới sau khi các ý tưởng hòa bình trước đó thất bại, còn Lavrov tái khẳng định Nga sẵn sàng cho giải pháp chính trị – ngoại giao nhưng phản đối tiếp tục viện trợ vũ khí cho Kiev. Cuộc gặp diễn ra đúng lúc nỗ lực trung gian của Washington chững lại vì bị hút vào khủng hoảng Iran, cho thấy Moscow có thể hưởng lợi từ sự phân tán chú ý của Mỹ để duy trì thế công trên chiến trường. Kênh đối thoại Mỹ – Nga vẫn mở nhưng thiếu động lực thực chất để tiến tới đình chiến.","sources":[{"name":"Korea Times","url":"https://www.koreatimes.co.kr/world/20260723/rubio-meets-russias-lavrov-in-manila-to-try-to-revive-prospect-of-us-helping-end-war-in-ukraine"}]},{"title":"Siết trong, đua ngoài: trấn áp lưu vong và cạnh tranh ngoại vi","body":"Duma thông qua gói [luật 'tử hình dân sự'](https://www.themoscowtimes.com/2026/07/22/state-duma-passes-civic-death-bills-cutting-off-exiled-critics-from-banking-and-consular-services-a93308) cho phép đóng băng tài sản, chặn giao dịch ngân hàng và tước dịch vụ lãnh sự với công dân Nga bị kết án vắng mặt vì chỉ trích quân đội hay bị gắn mác 'đặc vụ nước ngoài' – thể chế hóa công cụ kiểm soát giới bất đồng chính kiến lưu vong cho một cuộc chiến kéo dài. Ở vành ngoài, ảnh hưởng của Nga đối mặt sức ép mới: Washington cân nhắc [không kích drone nhằm nhóm JNIM ở Mali](https://www.washingtonpost.com/national-security/2026/07/22/trump-administration-weighs-military-options-mali-officials-say/) – nơi lực lượng Africa Corps của Nga hiện diện – đẩy Moscow vào thế cạnh tranh trực tiếp tại Sahel. Cùng lúc, [Azerbaijan và Đức ký tuyên bố đối tác chiến lược](https://president.az/en/articles/view/73037) củng cố tuyến Hành lang Giữa nhằm giảm phụ thuộc năng lượng Nga cho châu Âu. Bức tranh tổng thể là điện Kremlin vừa cố thủ đối nội, vừa phải bảo vệ các bàn cờ ảnh hưởng ngoại vi đang bị đối thủ dòm ngó.","sources":[{"name":"The Moscow Times","url":"https://www.themoscowtimes.com/2026/07/22/state-duma-passes-civic-death-bills-cutting-off-exiled-critics-from-banking-and-consular-services-a93308"},{"name":"The Washington Post","url":"https://www.washingt /* Dấu "Cập nhật": ngày + GIỜ quét (HH:MM giờ VN). Giờ đi kèm đúng mốc ngày đang hiển thị —
   worldGeneratedAt thì lấy worldGeneratedTime, ngược lại lấy generatedTime. Bản dữ liệu cũ
   chưa có *Time thì chỉ hiện ngày như trước. */
function stampVN(){
  var wd=DATA.worldGeneratedAt,d=wd||DATA.generatedAt;
  var t=(wd?DATA.worldGeneratedTime:DATA.generatedTime)||'';
  /* Phiên chỉ nạp tin Mỹ không bump worldGeneratedTime — cùng ngày thì mượn generatedTime. */
  if(!t&&d&&d===DATA.generatedAt)t=DATA.generatedTime||'';
  var s=fmtVN(d);
  return s&&t?s+' '+t:s;
}

function glossary(){return (DATA.terms&&DATA.terms.length)?DATA.terms:TERMS;}
function explainTerm(t){var n=norm(t);if(!n)return null;var g=glossary();var hit=g.find(function(e){var tn=norm(e.term);return tn&&(tn===n||n.indexOf(tn)>=0||(tn.length>=5&&tn.indexOf(n)>=0));});return hit?hit.explain:null;}
function conceptList(){return jget('dt.concepts');}
function conceptDefs(){var o;try{o=JSON.parse(localStorage.getItem('dt.conceptDefs')||'{}');}catch(e){o={};}return (o&&typeof o==='object')?o:{};}

function defOf(t){var d=conceptDefs()[norm(t)];return (d&&d.def)?d:null;}
function addConcept(t){t=(t||'').trim().replace(/\s+/g,' ');if(t.length<2)return;if(t.length>90)t=t.slice(0,90);var a=conceptList();var n=norm(t);if(a.some(function(x){return norm(x)===n;})){toast('Khái niệm đã có trong sổ tay');return;}a.unshift(t);if(a.length>200)a=a.slice(0,200);jset('dt.concepts',a);jset('dt.conceptHidden',jget('dt.conceptHidden').filter(function(x){return x!==n;}));touchConcept(t);sbSaveConcept(t);toast('Đã lưu khái niệm: '+t);}
function removeConcept(t){jset('dt.concepts',conceptList().filter(function(x){return x!==t;}));var n=norm(t),hid=jget('dt.conceptHidden');if(hid.indexOf(n)<0){hid.push(n);jset('dt.conceptHidden',hid);}sbRemoveConcept(t);}
/* Tự nạp khái niệm từ mục Tập trận (ex.concepts do phiên quét sáng sinh) vào sổ tay.
   Khái niệm user đã xoá nằm trong dt.conceptHidden nên không bị nạp lại. */
function importDrillConcepts(){
  var exs=(DATA.exercises&&DATA.exercises.length)?DATA.exercises:[];
  var a=conceptList(),defs=conceptDefs(),hid=jget('dt.conceptHidden'),have={},ch=false,dch=false;
  a.forEach(function(x){have[norm(x)]=1;});
  exs.forEach(function(ex){(ex.concepts||[]).forEach(function(k){
    if(!k||!k.term)return;var t=(''+k.term).trim().replace(/\s+/g,' ');if(t.length<2)return;if(t.length>90)t=t.slice(0,90);
    var n=norm(t);
    if(k.def&&(!defs[n]||defs[n].def!==k.def)){defs[n]={def:k.def,src:ex.name||''};dch=true;}
    if(!have[n]&&hid.indexOf(n)<0){a.push(t);have[n]=1;ch=true;}
  });});
  if(ch)jset('dt.concepts',a);
  if(dch)setConceptDefs(defs);
  /* KHÔNG upsert ở đây: hàm này chạy lúc khởi động trên MỌI máy, đẩy hàng loạt lên sẽ ghi đè
     dữ liệu máy khác. pullCloud() đã so với cloud rồi mới đẩy phần thật sự thiếu. */
}

function addDaysISO(iso,n){var p=iso.split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function dueConcepts(){var srs=conceptSrs(),t=todayISO();return conceptList().filter(function(x){var r=srs[norm(x)];return !r||!r.due||r.due<=t;});}

/* Trạng thái sự kiện/tập trận suy ĐỘNG từ dải ngày `dates` so với hôm nay (giờ VN) — vì `status`
   lưu trong DATA là tĩnh, gán lúc quét, không tự đổi khi ngày trôi (19-24/7 vẫn "sắp diễn ra"
   vào đúng 24/7). Parse được ngày thì lấy ngày làm chuẩn; không parse được (vd "Tháng 9/2026")
   thì fallback về status lưu sẵn. */
function evRange(ev){
  var s=(ev.dates||'').replace(/[–—]/g,'-'),m;
  // "20/7 - 7/8/2026" (ngày/tháng ở cả hai đầu) — thử TRƯỚC để không bị "day-day" bắt nhầm
  m=s.match(/(\d{1,2})\/(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return {a:{d:+m[1],mo:+m[2],y:+m[5]},b:{d:+m[3],mo:+m[4],y:+m[5]}};
  // "19-24/07/2026" (chung tháng/năm)
  m=s.match(/(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return {a:{d:+m[1],mo:+m[3],y:+m[4]},b:{d:+m[2],mo:+m[3],y:+m[4]}};
  // một ngày "24/7/2026"
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return {a:{d:+m[1],mo:+m[2],y:+m[3]},b:{d:+m[1],mo:+m[2],y:+m[3]}};
  return null;
}
function effStatus(ev){
  var r=evRange(ev);if(!r)return ev.status||'recent';
  var p=todayISO().split('-'),t=(+p[0])*10000+(+p[1])*100+(+p[2]);
  var a=r.a.y*10000+r.a.mo*100+r.a.d,b=r.b.y*10000+r.b.mo*100+r.b.d;
  return t<a?'upcoming':(t>b?'recent':'ongoing');
}
function drillHeader(ex){

  return '<div class="drill-h"><div class="drill-top">'+pill+(ex.dates?'<span class="drill-dates">'+esc(ex.dates)+'</span>':'')+'</div><div class="drill-name">'+esc(ex.name)+'</div>'+(ex.location?'<div class="drill-meta">📍 '+esc(ex.location)+'</div>':'')+(ex.scale?'<div class="drill-meta">🎖️ '+esc(ex.scale)+'</div>':'')+(ex.summary?'<div class="drill-sum">'+esc(ex.summary)+'</div>':'')+'</div>';

/* Thẻ Bối cảnh + Khái niệm dưới mỗi cuộc tập trận — nội dung từ "file thông tin nền" (background
   briefing) do phiên quét sáng sinh ra: ex.background (đoạn bối cảnh), ex.concepts ([{term,def}]). */
function drillBriefing(ex){
  var h='';
  if(ex.background)h+='<div class="drill-brief"><div class="db-h">📔 Bối cảnh</div><div class="db-body">'+esc(ex.background).replace(/\n+/g,'</div><div class="db-body">')+'</div></div>';

  if(cc.length){
    h+='<div class="drill-concepts"><div class="db-h">📚 Khái niệm</div>';
    cc.forEach(function(k){if(k&&(k.term||k.def))h+='<div class="dc-item"><b>'+esc(k.term||'')+'</b>'+(k.def?' — '+esc(k.def):'')+'</div>';});
    h+='</div>';

  return h;
}
function renderExercises(){

  var ord={ongoing:0,upcoming:1,recent:2};   // Đang diễn ra → Sắp diễn ra → Đã kết thúc
  exs.sort(function(a,b){return (ord[effStatus(a)]==null?9:ord[effStatus(a)])-(ord[effStatus(b)]==null?9:ord[effStatus(b)]);});
  var live=exs.filter(function(e){return effStatus(e)==='ongoing';}).length;
  var up=exs.filter(function(e){return effStatus(e)==='upcoming';}).length;

  chips+='</div>';
  var shown=exs.filter(function(e){return state.drill==='Tất cả'||e.name===state.drill;});
  function sec(ex){

    return '<section class="drill">'+drillHeader(ex)+drillBriefing(ex)+'<div class="list">'+cards+'</div></section>';
  }
  var GROUPS=[['ongoing','🔴 Đang diễn ra'],['upcoming','🔵 Sắp diễn ra'],['recent','✓ Đã kết thúc']];
  var body='';
  GROUPS.forEach(function(g){

  return '<div class="note">Các cuộc tập trận quân sự — phân theo <b>Đang diễn ra · Sắp diễn ra · Đã kết thúc</b>; mỗi mục gom tin liên quan kèm <b>nhận xét</b>. <b>'+live+'</b> đang diễn ra · <b>'+up+'</b> sắp diễn ra.</div>'+chips+body;

var BAOMOI_MERGED=false;
function loadBaomoi(){
  if(BAOMOI_MERGED)return;
  fetch('baomoi-saved.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(sv){
    BAOMOI_MERGED=true;
    if(!sv||!sv.items||!sv.items.length)return;
    /* Dedupe theo CẢ url LẪN tiêu đề. Chỉ so tiêu đề là không đủ: phiên quét viết lại tiêu đề
       khi nạp bài vào DATA (vd thêm "PAC-3 ACE" vào cuối), nên bản client không nhận ra bài đã
       có và trộn thêm lần nữa -> tin hiện 2 lần trên web. url thì không bị viết lại. */
    var seen={},seenU={};
    (DATA.worldNews||[]).concat(DATA.usNews||[]).forEach(function(a){
      if(!a)return; if(a.title)seen[norm(a.title)]=1; if(a.sourceUrl)seenU[a.sourceUrl]=1;
      /* _baomoiUrl = bookmark gốc của bài đã được thay sang nguồn nước ngoài (xem
         scripts/replace_source.py). Thiếu dòng này thì bài đó bị trộn lại thành tin thứ hai. */
      if(a._baomoiUrl)seenU[a._baomoiUrl]=1;});
    var add=[];
    sv.items.forEach(function(it){
      var u=it.sourceUrl||it.url||'';if(u&&seenU[u])return;
      var k=norm(it.title||'');if(!k||seen[k])return;seen[k]=1;if(u)seenU[u]=1;
      add.push({date:it.date,category:it.category,title:it.title,summary:it.summary||'',
        sourceName:it.sourceName||it.source||'Báo Mới',sourceUrl:it.sourceUrl||it.url||'',
        region:it.region||'',_baomoi:true});
    });
    if(!add.length)return;
    DATA.worldNews=(DATA.worldNews||[]).concat(add);
    render();
  }).catch(function(){BAOMOI_MERGED=true;});
}

  if(t.getAttribute('data-crevno')!=null){var R2=state.conceptRev;if(R2){var ct=R2.q[R2.i];gradeConcept(ct,false);R2.no++;R2.q.push(ct);R2.i++;R2.f=0;}reContent();return;}
  if(t.getAttribute('data-crevexit')!=null){state.conceptRev=null;reContent();return;}
  if(t.getAttribute('data-crm')!=null){removeConcept(t.getAttribute('data-crm'));reContent();return;}
  if(t.getAttribute('data-savedseg')!=null){state.savedSeg=t.getAttribute('data-savedseg');render();return;}
  /* Chuyển mục con trong tab Điểm Tin — reset bộ lọc của mục để không mang chip cũ sang mục mới. */
  if(t.getAttribute('data-newsseg')!=null){state.newsSeg=t.getAttribute('data-newsseg');state.fresh='Tất cả';state.freshDate='';state.wcat='Tất cả';state.wdate='Tất cả';state.wregion='Tất cả';state.xhandle='Tất cả';state.xdate='Tất cả';render();return;}
  if(t.getAttribute('data-anaseg')!=null){state.anaSeg=t.getAttribute('data-anaseg');render();return;}
  if(t.getAttribute('data-cafesort')!=null){state.cafeSort=t.getAttribute('data-cafesort');render();return;}
  if(t.getAttribute('data-cafef')!=null){var cf=t.getAttribute('data-cafef');state.cafeF[cf]=!state.cafeF[cf];render();return;}
  if(t.getAttribute('data-cafebusy')!=null){state.cafeHideBusy=!state.cafeHideBusy;render();return;}
  if(t.getAttribute('data-cafegeo')!=null){cfUseGeo();return;}
  if(t.getAttribute('data-cafeaddloc')!=null){cfAddLocation();return;}
  if(t.getAttribute('data-cafefav')!=null){cfToggleFav(t.getAttribute('data-cafefav'));reContent();return;}
  if(t.getAttribute('data-cafedel')!=null){if(window.confirm('Xoá vĩnh viễn “'+(t.getAttribute('data-cafenm')||'quán này')+'” khỏi danh sách? Quán đã xoá sẽ KHÔNG hiện lại.')){cfDelete(t.getAttribute('data-cafedel'));render();}return;}
  if(t.getAttribute('data-cafeunhide')!=null){cfUnhideAll();render();toast&&toast('Đã hiện lại các quán đã ẩn');return;}
  if(t.getAttribute('data-cafeaddcafe')!=null){state.cafeAdding=!state.cafeAdding;window._cfCoord=null;render();return;}
  if(t.getAttribute('data-cafeformgps')!=null){cfFormGeo();return;}
  if(t.getAttribute('data-cafesave')!=null){cfSaveCustom2();return;}
  if(t.getAttribute('data-cafecancel')!=null){state.cafeAdding=false;window._cfCoord=null;render();return;}
  if(t.getAttribute('data-pick')!=null){togglePick(t.getAttribute('data-pick'));reContent();return;}
  if(t.getAttribute('data-export-home')!=null){exportHomeDocx();return;}
  /* Chọn hết / bỏ chọn CHỈ trong phạm vi tin đang hiện ở trang chủ — không đụng tin đã tick ở tab khác. */
  if(t.getAttribute('data-pick-home')!=null){var _all=t.getAttribute('data-pick-home')==='all';
    homePickIds().forEach(function(id){if(_all)PICK.add(id);else PICK['delete'](id);});
    savePick();reContent();return;}
  if(t.getAttribute('data-export-picked')!=null){exportPickedDocx();return;}
  if(t.getAttribute('data-clear-pick')!=null){PICK.clear();savePick();reContent();return;}
  if(t.getAttribute('data-share')!=null){doShare(t.getAttribute('data-url'),t.getAttribute('data-title'));return;}
  if(t.getAttribute('data-copy')!=null){doCopy(t.getAttribute('data-url'));return;}
  if(t.getAttribute('data-mark')!=null){markRead(t.getAttribute('data-mark'));setTimeout(reContent,250);return;}
  if(t.getAttribute('data-sx')!=null){state.q='';render();return;}
  if(t.getAttribute('data-fav')!=null){toggleFav(t.getAttribute('data-fav'));render();return;}
  if(t.getAttribute('data-vote')!=null){var _vid=t.getAttribute('data-vid');castVote(_vid,t.getAttribute('data-vote')==='up'?1:-1);reContent();return;}
  if(t.getAttribute('data-topicseg')!=null){state.topicSeg=t.getAttribute('data-topicseg');state.drill='Tất cả';state.dip='Tất cả';state.dossier='Tất cả';render();return;}
  if(t.getAttribute('data-tab')){state.tab=t.getAttribute('data-tab');state.newsSeg='fresh';state.fresh='Tất cả';state.freshDate='';state.wcat='Tất cả';state.wdate='Tất cả';state.wregion='Tất cả';state.xhandle='Tất cả';state.xdate='Tất cả';state.drill='Tất cả';state.dip='Tất cả';state.dossier='Tất cả';}
  else if(t.getAttribute('data-fresh')!=null){state.fresh=t.getAttribute('data-fresh');state.freshDate='';}
  else if(t.getAttribute('data-wcat'))state.wcat=t.getAttribute('data-wcat');
  else if(t.getAttribute('data-areg'))state.areg=t.getAttribute('data-areg');
  else if(t.getAttribute('data-xhandle'))state.xhandle=t.getAttribute('data-xhandle');
  else if(t.getAttribute('data-drill')!=null)state.drill=t.getAttribute('data-drill');
  else if(t.getAttribute('data-dip')!=null)state.dip=t.getAttribute('data-dip');
  else if(t.getAttribute('data-dossier')!=null)state.dossier=t.getAttribute('data-dossier');
  render();
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='q'){var had=!!state.q;state.q=e.target.value;if((!had)!==(!state.q)){render();var el=document.getElementById('q');if(el){el.focus();var v=el.value;el.value='';el.value=v;}}else{reContent();}}
});
document.addEventListener('change',function(e){
  var s=e.target;if(!s||!s.getAttribute)return;
  if(s.getAttribute('data-wdate')!=null){state.wdate=s.value;render();}
  else if(s.getAttribute('data-wregion')!=null){state.wregion=s.value;render();}
  else if(s.getAttribute('data-adate')!=null){state.adate=s.value;render();}
  else if(s.getAttribute('data-xdate')!=null){state.xdate=s.value;render();}
  else if(s.getAttribute('data-freshdate')!=null){state.freshDate=s.value;render();}
  else if(s.getAttribute('data-cafelm')!=null){state.cafeLm=s.value;if(s.value===''){state.cafeStart=null;}else{var m=cfAllLm()[+s.value];if(m)state.cafeStart={lat:m.lat,lng:m.lng,label:m.label,src:'landmark'};}render();}
  else if(s.getAttribute('data-cafedistrict')!=null){state.cafeDistrict=s.value;render();}
});
refreshRead();
var _firstRun=false;try{_firstRun=localStorage.getItem('dt.seen')==null;}catch(e){}
initSeen();commitSeen();if(_firstRun)initSeen();
initSupabase();
applyTheme(curTheme());
ensureReaderUI();
importDrillConcepts();
render();
loadBaomoi();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
/* ==== Bôi đen chữ trong tin → nút "Lưu khái niệm" ==== */
function cFab(){var f=document.getElementById('concept-fab');if(!f){f=document.createElement('button');f.id='concept-fab';f.type='button';f.textContent='★ Lưu khái niệm';document.body.appendChild(f);
  f.addEventListener('mousedown',function(e){e.preventDefault();});
  f.addEventListener('click',function(e){e.stopPropagation();addConcept(f._t||'');f.style.display='none';var s=window.getSelection&&window.getSelection();if(s)s.removeAllRanges();if(state.tab==='concepts')reContent();});}
  return f;}
function onSel(){
  var f=document.getElementById('concept-fab');
  var s=window.getSelection?window.getSelection():null;
  var txt=s&&s.rangeCount?(''+s).trim():'';
  var node=s&&s.anchorNode; node=node&&node.nodeType===3?node.parentNode:node;
  var host=node&&node.closest?node.closest('.sum,.take,.title,.relate,.drill-sum,.cexp'):null;
  if(host&&host.closest('.cexp'))host=null; // đừng lưu từ chính phần giải thích
  if(txt&&txt.length>=2&&txt.length<=90&&host){
    f=cFab();f._t=txt;
    var r=s.getRangeAt(0).getBoundingClientRect();
    var x=Math.max(8,Math.min(r.left,window.innerWidth-150)),y=r.top-42;
    if(y<6)y=r.bottom+8;
    f.style.left=x+'px';f.style.top=y+'px';f.style.display='block';
  }else if(f){f.style.display='none';}
}
document.addEventListener('mouseup',function(){setTimeout(onSel,10);});
document.addEventListener('touchend',function(){setTimeout(onSel,10);});
window.addEventListener('scroll',function(){var f=document.getElementById('concept-fab');if(f&&f.style.display==='block')f.style.display='none';});
</script>
