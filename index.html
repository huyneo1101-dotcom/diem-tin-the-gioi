www.c4isrnet.com/news/your-military/2026/07/21/us-marine-corps-turns-to-ai-powered-bullfrog-as-drone-threats-expand/","significance":"Chi phí mỗi lần diệt mục tiêu chỉ khoảng 10 USD, Bullfrog nhắm thẳng vào bài toán bất cân xứng chi phí khi phải dùng tên lửa đánh chặn hàng triệu USD để hạ drone giá rẻ như tại Ukraine và Trung Đông."},{"date":"2026-07-21","category":"Công nghệ quân sự","title":"X-Bow giới thiệu tên lửa đánh chặn drone Buckler giá dưới 100.000 USD","summary":"Công ty X-Bow ra mắt tên lửa đánh chặn siêu thanh Buckler tại triển lãm Farnborough 2026, thiết kế để tiêu diệt drone nhóm 3 (nặng tới khoảng 600 kg, bay dưới 18.000 feet) với giá dưới 100.000 USD mỗi quả. X-Bow tự sản xuất toàn bộ khung và động cơ đẩy, vừa hoàn tất thử nghiệm bay thành công.","sourceName":"C4ISRNet","sourceUrl":"https://www.c4isrnet.com/industry/techwatch/2026/07/21/x-bow-out-to-tackle-cost-quandary-with-sub-100000-drone-interceptor/","significance":"Lãnh đạo X-Bow nhấn mạnh không thể thắng cuộc chiến tiêu hao khi dùng tên lửa PAC-3 giá 4 triệu USD để đánh chặn drone Shahed-136 giá 35.000 USD - tỷ lệ chi phí 114:1 mà Buckler nhắm thu hẹp."},{"date":"2026-07-22","category":"Ngoại giao","title":"Trump phê duyệt thỏa thuận hạt nhân dân sự 30 năm với Saudi Arabia, kèm thương vụ F-35","summary":"Tổng thống Trump đã phê duyệt Hiệp định 123 về hợp tác hạt nhân dân sự kéo dài 30 năm với Saudi Arabia, cho phép doanh nghiệp Mỹ phát triển ngành hạt nhân dân sự tại vương quốc này và khả năng xây cơ sở làm giàu uranium sau một nghiên cứu chung. Cùng lúc hai bên ký thỏa thuận bán tiêm kích F-35; thỏa thuận hạt nhân sẽ được Quốc hội Mỹ xem xét trong 90 ngày.","sourceName":"CNN","sourceUrl":"https://www.cnn.com/2026/07/22/politics/us-saudi-nuclear-deal","significance":"Thỏa thuận thiếu 'chuẩn vàng' cấm làm giàu uranium và không kèm Nghị định thư Bổ sung của IAEA, làm dấy lo ngại phổ biến hạt nhân ở Trung Đông - đúng lý do Mỹ từng viện dẫn khi tấn công chương trình hạt nhân Iran."},{"date":"2026-07-21","category":"Ngoại giao","title":"Mỹ ký thư bày tỏ ý định đưa Peace Corps trở lại Quần đảo Solomon sau hơn 25 năm","summary":"Thứ trưởng Ngoại giao Mỹ Christopher Landau gặp Thủ tướng Quần đảo Solomon Matthew Wale tại Washington ngày 21/7 và ký Thư Bày tỏ Ý định đưa Peace Corps quay lại nước này sau hơn 25 năm vắng bóng. Hai bên cũng nêu Thỏa thuận Sáng kiến Đầu tư mới với Development Finance Corporation và khoản tài trợ 6 triệu USD mở rộng chương trình rà phá bom mìn chưa nổ.","sourceName":"U.S. Department of State","sourceUrl":"https://www.state.gov/releases/office-of-the-spokesperson/2026/07/deputy-secretary-landaus-meeting-with-solomon-islands-prime-minister-wale","significance":"Động thái nằm trong nỗ lực của Mỹ tái can dự sâu hơn vào Nam Thái Bình Dương nhằm cân bằng ảnh hưởng ngày càng tăng của Trung Quốc tại Quần đảo Solomon kể từ hiệp ước an ninh Solomon - Trung Quốc năm 2022."},{"date":"2026-07-20","category":"Kinh tế","title":"Giá xăng Mỹ trở lại trên 4 USD/gallon khi Brent có lúc vượt 90 USD vì chiến sự Trung Đông","summary":"Giá Brent có lúc đạt 91,42 USD/thùng — cao nhất hơn một tháng — trước khi lùi về khoảng 88 USD khi Iran xác nhận đã nhận các đề xuất trung gian. Tại Mỹ, giá xăng bán lẻ bình quân tăng lên 4,003 USD/gallon, cao hơn hơn 30% so với lúc chiến sự leo thang cuối tháng 2. Nguyên nhân gồm dòng tàu qua Hormuz giảm mạnh, công suất lọc dầu toàn cầu bị thu hẹp và tồn kho nhiên liệu Mỹ dưới trung bình năm năm; các đòn đánh cơ sở dầu Nga của Ukraine tiếp tục bổ sung rủi ro nguồn cung.","significance":"Năng lượng đắt hơn có thể làm chậm quá trình giảm lạm phát, kéo dài lãi suất cao và gây sức ép lên thu nhập hộ gia đình. Với Mỹ, mốc 4 USD/gallon mang ý nghĩa chính trị lớn trước bầu cử giữa nhiệm kỳ và có thể ảnh hưởng trực tiếp tới lựa chọn quân sự, giải phóng dự trữ hoặc thúc đẩy đàm phán.","sourceName":"Reuters","sourceUrl":"https://www.reuters.com/business/energy/us-pump-prices-cross-4-again-renewed-fighting-middle-east-2026-07-20/"},{"date":"2026-07-20","category":"Kinh tế","title":"Triển vọng tăng trưởng Mexico giảm vì bất định thương mại với Mỹ và rà soát USMCA hằng năm","summary":"Khảo sát kinh tế mới hạ dự báo tăng trưởng Mexico xuống 1,1% năm 2026 và 1,8% năm 2027, phản ánh đầu tư suy yếu trước bất định trong quan hệ thương mại với Mỹ. Washington không gia hạn USMCA theo chu kỳ dài mà chuyển sang đánh giá thường niên, khiến doanh nghiệp khó lập kế hoạch vốn, đặc biệt trong ngành ô tô. Xuất khẩu vẫn tương đối mạnh nhưng sản xuất công nghiệp và đầu tư tư nhân chậm; lạm phát quanh 4%, khiến ngân hàng trung ương có thể phải giữ lãi suất 6,5% lâu hơn.","significance":"Mexico là mắt xích trung tâm của chiến lược nearshoring Bắc Mỹ. Nếu cơ chế rà soát hằng năm làm giảm đầu tư dài hạn, chuỗi cung ứng ô tô, điện tử và công nghiệp Mỹ sẽ chịu tác động, đồng thời lợi thế của Mexico trước Trung Quốc và các nước châu Á có thể bị thu hẹp.","sourceName":"Reuters","sourceUrl":"https://www.reuters.com/world/americas/mexico-economy-grow-less-than-previously-expected-trade-concerns-2026-07-20/"},{"date":"2026-07-17","category":"Ngoại giao","title":"Rubio tới Manila dự chuỗi hội nghị ASEAN, mở kênh chuẩn bị đối thoại Mỹ–Trung cấp cao","summary":"Ngoại trưởng Mỹ Marco Rubio tới Manila từ ngày 19 đến 23/7 để dự Hội nghị sau Bộ trưởng ASEAN, Hội nghị Bộ trưởng Cấp cao Đông Á và Diễn đàn Khu vực ASEAN. Ông dự kiến gặp các quan chức Ấn Độ Dương–Thái Bình Dương; cuộc tiếp xúc với Ngoại trưởng Trung Quốc Vương Nghị được trông đợi dù chưa bên nào xác nhận. Các chủ đề chính gồm chiến tranh Iran, Biển Đông, Myanmar, trung tâm lừa đảo xuyên quốc gia và khả năng chuẩn bị cho cuộc gặp Trump–Tập vào tháng 9. Ngoại trưởng Nga Sergei Lavrov cũng dự kiến có mặt.","significance":"Manila tạo một kênh quản trị cạnh tranh Mỹ–Trung trong lúc khủng hoảng Iran gây áp lực lên châu Á. Tiến triển về Bộ quy tắc ứng xử Biển Đông hoặc cuộc gặp Rubio–Vương có thể ảnh hưởng trực tiếp cân bằng khu vực.","sourceName":"U.S. Department of State","sourceUrl":"https://www.state.gov/releases/office-of-the-spokesperson/2026/07/secretary-rubios-travel-to-manila-for-asean-foreign-ministerial-meetings/"},{"date":"2026-07-17","category":"Công nghệ quân sự","title":"AeroVironment nhận nhiệm vụ 80,5 triệu USD cho phòng thủ căn cứ trước drone nhỏ","summary":"AeroVironment được trao nhiệm vụ đầu tiên trị giá 80,5 triệu USD trong một hợp đồng khung 500 triệu USD để phát triển hệ thống phòng thủ nhiều lớp cho các căn cứ Không quân Mỹ trước drone nhỏ. Gói đầu tư tập trung vào giải pháp Titan, tích hợp khả năng phát hiện và đánh bại UAS, có thể triển khai tại địa điểm cố định hoặc cơ động. Quân đội Mỹ nhấn mạnh yêu cầu tương tác giữa các thành phần để tạo kiến trúc phòng thủ thống nhất. Thông tin công khai chưa nêu số lượng hệ thống, địa điểm triển khai hay tiến độ đạt năng lực tác chiến ban đầu.","significance":"Các cuộc chiến gần đây cho thấy drone giá rẻ có thể gây thiệt hại lớn cho căn cứ và hạ tầng. Hợp đồng phản ánh chuyển dịch ngân sách từ giải pháp đơn lẻ sang phòng thủ nhiều lớp có AI và khả năng tích hợp.","sourceName":"Association of Defense Communities","sourceUrl":"https://defensecommunities.org/2026/07/pentagon-awards-80m-drone-defense-contract/"},{"date":"2026-07-18","category":"Kinh tế","title":"Fed cải tổ triệt để cách truyền thông chính sách, Wall Street phải dùng AI để 'giải mã' Chủ tịch Warsh","summary":"Chủ tịch Fed Kevin Warsh đã rút ngắn tuyên bố sau cuộc họp FOMC tháng 6 xuống còn khoảng 130 từ (so với hơn 300 từ trước đây), chủ động bỏ định hướng chính sách tương lai (forward guidance) như một phần cải tổ truyền thông của một nhóm công tác Fed do ông lập ra. Trước thay đổi này, quỹ đầu tư F/m Investments phải xây dựng chatbot AI 'WarshGPT' (dùng mô hình Claude, chi phí dưới 1.000 USD) để phân tích gần 1.800 tài liệu/phát biểu của Warsh nhằm dự đoán cách ông tư duy về chính sách.","sourceName":"CNBC","sourceUrl":"https://www.cnbc.com/2026/07/18/warshgpt-federal-reserve-communications-task-force-warsh.html","significance":"Thay đổi phong cách truyền thông của Fed làm giảm khả năng dự đoán chính sách tiền tệ theo cách truyền thống, buộc thị trường phải thích ứng bằng công cụ mới — phản ánh bước ngoặt về minh bạch/thể chế dưới nhiệm kỳ Warsh."},{"date":"2026-07-18","category":"Công nghệ quân sự","title":"GAO cảnh báo Mỹ thiếu chiến lược thống nhất cho tên lửa siêu vượt âm CPS trị giá hơn 50 tỷ USD","summary":"GAO công bố báo cáo cho biết Hải quân Mỹ chậm khoảng 24 tháng trong việc cải hoán ba khu trục hạm Zumwalt để triển khai tên lửa Conventional Prompt Strike. Dây chuyền của Lockheed Martin hiện chỉ sản xuất khoảng sáu đến bảy đạn mỗi năm, xấp xỉ một nửa mục tiêu 12 quả của Hải quân, trong khi Lục quân dùng chung thiết kế và chuỗi cung ứng. Hai quân chủng dự kiến đầu tư tổng cộng hơn 50 tỷ USD nhưng chưa có chiến lược toàn diện để phối hợp mua sắm, thử nghiệm, cơ sở công nghiệp và lịch triển khai, làm tăng nguy cơ lãng phí và trùng lặp.","sourceName":"U.S. Government Accountability Office","sourceUrl":"https://www.gao.gov/products/gao-26-107974","significance":"CPS là năng lực tấn công tầm xa then chốt trước các đối thủ ngang hàng; chậm tiến độ và thiếu phối hợp có thể tạo khoảng trống răn đe ở Ấn Độ Dương–Thái Bình Dương."},{"date":"2026-07-17","category":"Công nghệ quân sự","title":"Không quân Mỹ tăng mạnh sản xuất tên lửa hành trình tàng hình JASSM và diệt hạm LRASM","summary":"Không quân Mỹ mở rộng hợp đồng mua tên lửa AGM-158 JASSM và AGM-158C LRASM của Lockheed Martin (lô 22-33 JASSM, lô 9-19 LRASM), nâng tổng số dự kiến từ 16.710 lên 23.095 quả - mức tăng lớn nhất từ trước tới nay cho dòng tên lửa tầm xa tàng hình này.","sourceName":"USNI News","sourceUrl":"https://news.usni.org/2026/07/17/u-s-air-force-increases-stealthy-cruise-anti-ship-missile-production","significance":"Dồn sức tăng kho JASSM/LRASM phản ánh ưu tiên của Lầu Năm Góc nhằm bảo đảm năng lực tấn công tầm xa xuyên thủng lưới phòng không dày đặc của Trung Quốc, phục vụ răn đe Ấn Độ Dương - Thái Bình Dương."},{"date":"2026-07-17","category":"Công nghệ quân sự","title":"Hải quân Mỹ chậm 2 năm lắp tên lửa siêu vượt âm lên khu trục hạm lớp Zumwalt","summary":"Theo báo cáo cơ quan giám sát chính phủ Mỹ, chương trình lắp hệ thống tên lửa siêu vượt âm Conventional Prompt Strike (CPS) lên 3 khu trục hạm lớp Zumwalt chậm khoảng 2 năm; đợt thử bay dự kiến 2025 nay lùi sang 2027.","sourceName":"Defense News","sourceUrl":"https://www.defensenews.com/industry/techwatch/2026/07/17/us-navy-2-years-behind-on-hypersonic-missile-installation-on-zumwalt-destroyers/","significance":"Sự chậm trễ lùi thời điểm hải quân Mỹ có năng lực tấn công siêu vượt âm tầm xa trên tàu mặt nước đầu tiên, ảnh hưởng lộ trình răn đe/chống tiếp cận ở Ấn Độ Dương - Thái Bình Dương."},{"date":"2026-07-17","category":"Kinh tế","title":"Số nhà khởi công tại Mỹ tăng vọt 19% nhờ phục hồi phân khúc chung cư","summary":"Số liệu ngày 17/7: số nhà mới khởi công tại Mỹ tháng 6 tăng 19% so với tháng trước, đạt tốc độ 1,43 triệu căn/năm - cao nhất kể từ tháng 3, vượt mọi dự báo. Mức tăng chủ yếu từ phân khúc chung cư (tăng 76,3%), trong khi nhà đơn lập giảm nhẹ tháng thứ ba do lãi vay và giá nhà còn cao.","sourceName":"Bloomberg","sourceUrl":"https://www.bloomberg.com/news/articles/2026-07-17/us-housing-starts-rebound-on-multifamily-construction","significance":"Chỉ báo Fed theo dõi khi cân nhắc lãi suất; cho thấy phân khúc nhà nhiều hộ hồi phục dù nhà đơn lập vẫn chịu áp lực chi phí vay cao."},{"date":"2026-07-16","category":"Kinh tế","title":"Bán lẻ Mỹ tăng nhẹ, đơn xin trợ cấp thất nghiệp xuống mức thấp mười tuần","summary":"Cục Điều tra Dân số Mỹ ước tính doanh số bán lẻ và dịch vụ ăn uống tháng 6 đạt 768,6 tỷ USD, tăng 0,2% so với tháng trước và 6,7% so với cùng kỳ. Bộ Lao động báo cáo 208.000 đơn xin trợ cấp thất nghiệp lần đầu, mức thấp nhất trong mười tuần. Hai chỉ báo cho thấy tiêu dùng và thị trường lao động vẫn có sức chống chịu dù lãi suất cao và bất ổn địa chính trị. Dữ liệu một tháng có thể biến động và còn được điều chỉnh, nhưng trước mắt làm yếu lập luận cần cắt giảm lãi suất khẩn cấp.","sourceName":"U.S. Census Bureau","sourceUrl":"https://www.census.gov/retail/sales.html","significance":"Sức cầu và việc làm bền hơn dự kiến có thể giữ lợi suất trái phiếu và USD ở mức cao, ảnh hưởng dòng vốn, tỷ giá và chi phí vay của các thị trường mới nổi."},{"date":"2026-07-16","category":"Công nghệ quân sự","title":"Cơ quan Phát triển Không gian Mỹ nối lại phóng vệ tinh Tranche 1 Transport Layer sau 9 tháng tạm dừng","summary":"SDA phóng 21 vệ tinh truyền dữ liệu Tranche 1 Transport Layer E (York Space Systems) bằng Falcon 9 từ Vandenberg, nối lại chương trình sau 9 tháng 'tạm dừng chiến lược' để khắc phục lỗi mô hình nhiệt và kết nối mặt đất phát hiện ở 42 vệ tinh đợt đầu. Đây là một phần kiến trúc Proliferated Warfighter Space Architecture (PWSA), cung cấp kết nối dữ liệu quân sự độ trễ thấp toàn cầu qua liên kết laser liên vệ tinh.","sourceName":"Breaking Defense","sourceUrl":"https://breakingdefense.com/2026/07/sda-resumes-data-relay-satellite-launch-following-tech-fixes/","significance":"Việc nối lại phóng cho thấy SDA vượt giai đoạn khủng hoảng kỹ thuật đe doạ mô hình 'proliferated LEO' của Lầu Năm Góc - nền tảng kết nối cho cả hệ thống cảnh báo/đánh chặn Golden Dome."},{"date":"2026-07-16","category":"Kinh tế","title":"Mỹ áp thuế 25% lên hầu hết hàng hoá Brazil sau điều tra Section 301","summary":"Đại diện Thương mại Mỹ (USTR) Jamieson Greer ngày 16/7 công bố áp thuế 25% lên phần lớn hàng nhập từ Brazil, sau điều tra Section 301 kết luận Brazil có chính sách thương mại bất hợp lý về thương mại số/thanh toán điện tử, ưu đãi thuế, tiếp cận thị trường ethanol và phá rừng. Thuế hiệu lực từ 22/7, miễn trừ cà phê, thịt bò, quả bơ, dầu thô và phụ tùng máy bay.","sourceName":"USTR","sourceUrl":"https://ustr.gov/about/policy-offices/press-office/press-releases/2026/july/ustr-section-301-action-brazils-unreasonable-acts-policies-and-practices","significance":"Leo thang căng thẳng thương mại Mỹ - Brazil giữa quan hệ Trump-Lula xấu, tạo tiền lệ dùng Section 301 nhắm chính sách số/môi trường của đối tác thay vì chỉ tranh chấp thuế truyền thống."},{"date":"2026-07-15","category":"Công nghệ quân sự","title":"Không quân Mỹ lần đầu bắn tên lửa AMRAAM thật từ drone đồng đội CCA","summary":"Drone chiến đấu tự hành YFQ-44A Fury của Anduril, thuộc chương trình Collaborative Combat Aircraft (CCA), lần đầu bắn thành công tên lửa không đối không AIM-120 AMRAAM trúng mục tiêu số hóa trên sa mạc Mojave, cất cánh từ căn cứ Edwards.","sourceName":"Breaking Defense","sourceUrl":"https://breakingdefense.com/2026/07/in-first-air-force-fires-live-shot-off-cca-wingman-drone/","significance":"Cột mốc chứng minh drone 'wingman' có thể tự chủ tác chiến không đối không thực sự chứ không chỉ mang vũ khí giả lập, thúc đẩy Không quân Mỹ tiến tới biên chế CCA quy mô lớn."},{"date":"2026-07-15","category":"Công nghệ quân sự","title":"Không quân Mỹ ký khung hợp đồng dài hạn mua hàng nghìn tên lửa hành trình giá rẻ FAMM","summary":"Bộ Quốc phòng Mỹ công bố thỏa thuận khung nhiều năm với Anduril (Barracuda), CoAspire (RAACM) và Zone 5 Technologies (AGM-188 Rusty Dagger) sản xuất dòng tên lửa hành trình phóng từ máy bay giá rẻ FAMM, tầm 250-500 dặm, dự kiến 8.000 quả/năm.","sourceName":"Defense News","sourceUrl":"https://www.defensenews.com/industry/techwatch/2026/07/15/us-air-force-turns-to-cheaper-cruise-missiles-it-can-buy-by-the-thousand/","significance":"Chiến lược 'vũ khí giá rẻ số lượng lớn' bù đắp kho tên lửa dẫn đường chính xác cạn kiệt sau các chiến dịch cường độ cao, tăng răn đe bằng số lượng."},{"date":"2026-07-15","category":"Công nghệ quân sự","title":"Raytheon hoàn thành cột mốc thử nghiệm tên lửa phòng không tầm ngắn thế hệ mới NGSRI","summary":"Raytheon (RTX) hoàn tất loạt bắn thử tên lửa Next Generation Short Range Interceptor (NGSRI) - dự kiến thay thế Stinger cho Lục quân Mỹ - từ bệ phóng vác vai, đánh chặn trúng nhiều mục tiêu trên không mô phỏng nhờ quang học chính xác và động cơ nhiên liệu rắn cải tiến.","sourceName":"RTX (Raytheon)","sourceUrl":"https://www.rtx.com/news/news-center/2026/07/15/rtxs-raytheon-completes-key-milestone-for-u-s-armys-next-generation-short-rang","significance":"NGSRI mở rộng tầm bắn so với Stinger hiện tại, đáp ứng nhu cầu cấp bách nâng cấp phòng không tầm ngắn của Lục quân Mỹ trước mối đe dọa drone và máy bay tầm thấp."},{"date":"2026-07-15","category":"Kinh tế","title":"Chủ tịch Fed Warsh: Fed 'độc lập' dù thường xuyên gặp chính quyền Trump","summary":"Trong phiên điều trần bán niên trước Ủy ban Ngân hàng Thượng viện ngày 15/7, tân Chủ tịch Fed Kevin Warsh khẳng định Fed là 'ngân hàng trung ương độc lập', gặp 'thường xuyên' với chính quyền Trump nhưng cam kết chỉ theo luật và dữ liệu; nhắc lại Fed 'không khoan nhượng' với lạm phát kéo dài dù đầu tư trung tâm dữ liệu/AI đang là điểm sáng nhất của kinh tế Mỹ.","sourceName":"CNBC","sourceUrl":"https://www.cnbc.com/2026/07/15/feds-warsh-says-he-meets-often-with-trump-administration.html","significance":"Tính độc lập của Fed trước áp lực chính trị từ Nhà Trắng là tâm điểm theo dõi của thị trường trước cuộc họp FOMC cuối tháng 7."},{"date":"2026-07-15","category":"Kinh tế","title":"Cố vấn thương mại Trump nhận định Trung Quốc vi phạm thỏa thuận nhưng Mỹ chọn không trả đũa","summary":"Theo Bloomberg, cố vấn thương mại của Trump kết luận nội bộ rằng Trung Quốc vi phạm thỏa thuận thương mại ký với Tập Cận Bình năm ngoái - đặc biệt về cam kết mở lại tiếp cận đất hiếm/khoáng sản chiến lược - nhưng Washington không có động thái trả đũa đáng kể. Trung Quốc trước đó đưa MP Materials và USA Rare Earth vào danh sách kiểm soát xuất khẩu đáp trả Lầu Năm Góc.","sourceName":"Bloomberg","sourceUrl":"https://www.bloomberg.com/news/articles/2026-07-15/trump-s-aides-see-china-cheating-on-trade-but-shun-retaliation","significance":"Cho thấy khoảng cách giữa tuyên bố cứng rắn và thực thi thực tế trong chính sách thương mại Mỹ - Trung, ảnh hưởng độ tin cậy thỏa thuận song phương và an ninh chuỗi cung ứng khoáng sản chiến lược."},{"date":"2026-07-15","category":"Chính trị","title":"Hạ viện Cộng hòa công bố gói ngân sách đối chiếu 'Reconciliation 3.0' với 60 tỷ USD cho quốc phòng","summary":"Ngày 15/7, lãnh đạo Hạ viện Mỹ cùng Ủy ban Ngân sách công bố khung dự luật đối chiếu ngân sách mới, phân bổ 60 tỷ USD cho Ủy ban Quân vụ Hạ viện - thấp hơn 67 tỷ USD Nhà Trắng đề nghị cho chi phí liên quan chiến tranh Iran và kém xa mức 350 tỷ USD ban đầu; Ủy ban Ngân sách dự kiến markup ngày 16/7.","sourceName":"Breaking Defense","sourceUrl":"https://breakingdefense.com/2026/07/house-gop-releases-reconciliation-3-0-with-60b-for-defense/","significance":"Dùng cơ chế reconciliation để né filibuster cho thấy Đảng Cộng hòa chấp nhận mức tài trợ quốc phòng thấp hơn nhiều đề xuất Nhà Trắng, phản ánh giới hạn chính trị nội bộ dù nêu cao 'hoà bình qua sức mạnh'."},{"date":"2026-07-15","category":"Chính trị","title":"Dân chủ phản đối trao quyền thuế quan đơn phương cho Trump trong dự luật trừng phạt Nga","summary":"Ngày 15/7, các nghị sĩ Dân chủ cấp cao (Gregory Meeks, Richard Neal, Ron Wyden) công khai phản đối 'Sanctioning Russia Act of 2026', cho rằng điều khoản trao quyền áp thuế đơn phương tới 100% lên các nước mua dầu Nga (gồm TQ, Ấn Độ) là 'con ngựa thành Troy' mở rộng quyền thuế quan của Tổng thống mà Quốc hội không thể ngăn - đe dọa làm chậm thông qua dự luật vốn có hơn 26 nghị sĩ lưỡng đảng bảo trợ.","sourceName":"The Hill","sourceUrl":"https://thehill.com/homenews/senate/5970400-democrats-oppose-russia-sanctions-act/","significance":"Phơi bày căng thẳng thể chế giữa quyền thuế quan hành pháp mở rộng và vai trò giám sát của Quốc hội, ngay trong một dự luật trừng phạt Nga vốn có đồng thuận lưỡng đảng hiếm hoi."},{"date":"2026-07-14","category":"Ngoại giao","title":"Trump tiếp Thủ tướng Iraq tại Nhà Trắng, xác nhận Mỹ rút hết quân khỏi Iraq trước 30/9","summary":"Tổng thống Trump đón tân Thủ tướng Iraq Ali al-Zaidi tại Nhà Trắng; hai bên xác nhận quân đội Mỹ (dưới 2.000 quân còn lại) rút hoàn toàn khỏi Iraq trước 30/9/2026, kết thúc sứ mệnh quân sự 23 năm. Lầu Năm Góc ra tuyên bố tái khẳng định thỏa thuận song phương 2024 về chấm dứt chiến dịch chống IS.","sourceName":"U.S. Department of War","sourceUrl":"https://www.war.gov/News/Releases/Release/Article/4319286/iraq-transition/","significance":"Kết thúc chính thức hiện diện quân sự Mỹ tại Iraq sau 23 năm, chuyển trọng tâm quan hệ song phương sang kinh tế - năng lượng, giữa lúc Mỹ tái cơ cấu ưu tiên nguồn lực quân sự khỏi Trung Đông."},{"date":"2026-07-14","category":"Kinh tế","title":"Lạm phát Mỹ hạ nhiệt bất ngờ xuống 3,5% trong tháng 6, giảm mạnh nhất 6 năm","summary":"Báo cáo CPI của BLS ngày 14/7 cho thấy chỉ số giá tiêu dùng tháng 6 giảm 0,4% so với tháng trước - mức giảm hàng tháng lớn nhất kể từ tháng 4/2020 - đưa lạm phát năm về 3,5%, thấp hơn nhiều dự báo 3,8% và giảm từ 4,2% tháng 5. Giá năng lượng giảm 5,7% là động lực chính; lạm phát lõi đi ngang còn 2,6%.","sourceName":"CNBC","sourceUrl":"https://www.cnbc.com/2026/07/14/consumer-price-index-inflation-report-june-2026.html","significance":"Số liệu tốt hơn dự kiến giảm áp lực buộc Fed nâng lãi suất ngay, nhưng Chủ tịch Fed Warsh cùng ngày điều trần nhấn mạnh chưa phải 'mission accomplished' do rủi ro thuế quan và chiến sự Iran - thị trường vẫn nghiêng về khả năng Fed nâng lãi tháng 9."},{"date":"2026-07-14","category":"Chính trị","title":"Thượng viện Mỹ chặn dự luật ngân sách quốc phòng 1,15 nghìn tỷ USD vì chiến sự Iran","summary":"Với tỷ lệ 50-46 (thiếu 10 phiếu so với ngưỡng 60), Thượng viện không thông qua thủ tục cloture để đưa S.4784 - Đạo luật Ủy quyền Quốc phòng (NDAA) tài khóa 2027 - ra biểu quyết. Phe Dân chủ viện dẫn việc chính quyền Trump nối lại xung đột quân sự với Iran mà không xin phép Quốc hội làm lý do phản đối.","sourceName":"The Hill","sourceUrl":"https://thehill.com/policy/defense/5967878-senate-democrats-block-ndaa/","significance":"Phơi bày căng thẳng thể chế giữa quyền chiến tranh của Tổng thống và quyền giám sát ngân sách quốc phòng của Quốc hội theo War Powers Act, đặt NDAA FY2027 vào thế bế tắc lưỡng đảng giữa lúc xung đột Mỹ - Iran leo thang."},{"date":"2026-07-14","category":"Công nghệ quân sự","title":"Hải quân Mỹ ra yêu cầu thông tin cho dòng UAV thế hệ mới trên tàu sân bay, đảm nhận 8 nhiệm vụ","summary":"Hải quân Mỹ phát hành RFI ngày 14/7 tìm dòng máy bay không người lái cất/hạ cánh trên tàu sân bay thế hệ mới thuộc 'Không đoàn Tương lai', yêu cầu đảm nhận 8 nhiệm vụ: tấn công mặt biển, tấn công mặt đất, chống ngầm, không chiến, tác chiến điện tử, ISR, tiếp dầu và tiếp tế. Tầm tối thiểu 1.000 hải lý cho nhiệm vụ tấn công; hạn nộp 13/8.","sourceName":"Defense News","sourceUrl":"https://www.defensenews.com/news/your-navy/2026/07/14/the-us-navy-is-eyeing-next-gen-carrier-based-drones-heres-what-they-might-do/","significance":"Hải quân Mỹ định hình lại không đoàn tàu sân bay quanh máy bay không người lái đa nhiệm thay vì chỉ bổ trợ (như MQ-25), phản ánh áp lực cắt chi phí vận hành và mở rộng tầm trước năng lực chống tiếp cận (A2/AD) của Trung Quốc."},{"date":"2026-07-14","category":"Công nghệ quân sự","title":"Lầu Năm Góc công bố hơn 500 triệu USD mua sắm mới qua chương trình APFIT, ưu tiên hệ thống tự hành và tác chiến điện tử","summary":"Bộ Chiến tranh Mỹ công bố ngày 14/7 vòng trao thầu mới của chương trình APFIT trị giá hơn 500 triệu USD (hơn 70 triệu cho phần mềm), tập trung hệ thống tự hành, tác chiến điện tử, chống UAS, thông tin liên lạc chống nhiễu, hậu cần môi trường tranh chấp. Tổng giá trị APFIT vượt 2 tỷ USD.","sourceName":"DefenseScoop","sourceUrl":"https://defensescoop.com/2026/07/14/pentagon-announces-new-apfit-procurements-software/","significance":"Nỗ lực đẩy nhanh đưa công nghệ mới (tự hành/AI, chống drone) ra chiến trường của Lầu Năm Góc sau bài học chiến dịch chống Iran, rút ngắn chu kỳ mua sắm truyền thống."},{"date":"2026-07-13","category":"Công nghệ quân sự","title":"SDA trao 1,75 tỷ USD cho L3Harris và Sierra Space chế tạo 36 vệ tinh theo dõi tên lửa cho Golden Dome","summary":"Cơ quan Phát triển Không gian Mỹ (SDA) trao tổng cộng 1,75 tỷ USD cho L3Harris (955 triệu USD, 18 vệ tinh) và Sierra Space chế tạo 36 vệ tinh theo dõi mối đe doạ tên lửa thuộc chương trình Accelerated Missile Defense Tranche 3, mang cảm biến trường nhìn trung bình cung cấp dữ liệu kiểm soát hoả lực; sản xuất tại Indiana và Florida, phóng trước cuối 2028 phục vụ tầng cảm biến lá chắn Golden Dome.","sourceName":"Space Development Agency","sourceUrl":"https://www.sda.mil/space-development-agency-issues-awards-to-build-36-accelerated-missile-defense-tracking-layer-satellites-for-tranche-3-in-support-of-golden-dome-for-america/","significance":"Bước cụ thể đầu tiên hiện thực hoá tầng cảm biến không gian của Golden Dome, sau nhiều tháng bị CSIS đánh giá là chậm tiến độ triển khai thực tế."},{"date":"2026-07-13","category":"Công nghệ quân sự","title":"Lầu Năm Góc dừng khẩn cấp yêu cầu chứng nhận an ninh mạng CMMC Giai đoạn 2","summary":"Giám đốc Thông tin Lầu Năm Góc Kirsten Davies dừng ngay yêu cầu đánh giá an ninh mạng bên thứ ba theo Mô hình Chứng nhận Trưởng thành An ninh mạng (CMMC) Giai đoạn 2 — dự kiến áp dụng từ 10/11/2026 — sau khi phân tích cho thấy chi phí lên tới 593.800 USD/nhà thầu quốc phòng nhỏ; lập tổ công tác rà soát báo cáo trong 60 ngày, trong khi yêu cầu tự đánh giá Giai đoạn 1 vẫn giữ hiệu lực.","sourceName":"Breaking Defense","sourceUrl":"https://breakingdefense.com/2026/07/pentagon-announces-immediate-suspension-of-cmmc-mandates/","significance":"Cho thấy áp lực buộc Lầu Năm Góc cân bằng giữa siết an ninh mạng chuỗi cung ứng quốc phòng và nguy cơ đẩy nhà thầu nhỏ ra khỏi thị trường — chủ đề CISA/CSET theo dõi sát."},{"date":"2026-07-13","category":"Kinh tế","title":"Thống đốc Fed Waller: có thể phải tăng lãi suất nếu lạm phát lõi tiếp tục nóng","summary":"Phát biểu tại New York Association for Business Economics, Thống đốc Fed Christopher Waller cho biết lạm phát lõi PCE đã tăng từ 3% (12/2025) lên 3,4% (5/2026), một phần do xung đột Trung Đông làm gián đoạn dầu mỏ. Ông cảnh báo nếu CPI/PPI tuần này tiếp tục nóng, FOMC sẽ phải cân nhắc thắt chặt trong ngắn hạn, dù cần thêm dữ liệu trước khi hành động.","sourceName":"Federal Reserve","sourceUrl":"https://www.federalreserve.gov/newsevents/speech/waller20260713a.htm","significance":"Đánh dấu khả năng Fed đảo chiều từ kỳ vọng cắt giảm sang cân nhắc tăng lãi suất khi lạm phát do thuế quan và cú sốc năng lượng Trung Đông cộng hưởng — đúng cảnh báo của BIS về điểm nghẽn áp lực kinh tế toàn cầu."},{"date":"2026-07-13","category":"Chính trị","title":"Bộ Tài chính Mỹ trừng phạt mạng lưới hạ tầng hỗ trợ ransomware, phối hợp với Anh","summary":"OFAC (Bộ Tài chính Mỹ) trừng phạt dịch vụ VPN FirstVPN (1VPNS) cùng quản trị viên Dmytro Rashevskyi và cá nhân Yevgeniy Silayev — người bán công cụ 'cryptor' giúp ransomware né phần mềm diệt virus. Hành động phối hợp cùng Bộ Ngoại giao Anh (FCDO), nhắm triệt hạ hạ tầng dịch vụ hỗ trợ các nhóm ransomware từng gây thiệt hại hạ tầng trọng yếu của Mỹ.","sourceName":"U.S. Department of the Treasury","sourceUrl":"https://home.treasury.gov/news/press-releases/sb0559","significance":"Bước chuyển chiến lược trừng phạt của Mỹ từ nhắm trực tiếp nhóm ransomware sang triệt hạ mạng lưới hạ tầng/dịch vụ hỗ trợ (VPN, cryptor) phía sau — mô hình phối hợp xuyên Đại Tây Dương ngày càng được thể chế hoá."},{"date":"2026-07-13","category":"Công nghệ quân sự","title":"Thượng viện Mỹ rót 40 triệu USD tích hợp tên lửa Bullseye cho Thủy quân lục chiến đối phó Trung Quốc","summary":"Bản dự thảo NDAA FY2027 của Ủy ban Quân vụ Thượng viện bổ sung 40 triệu USD để tích hợp và trình diễn tên lửa hành trình Bullseye (General Atomics, tầm bắn 300km, phát triển từ Ice Breaker của Rafael) cho các Trung đoàn Duyên hải Thủy quân lục chiến, phục vụ răn đe ở Tây Thái Bình Dương.","sourceName":"Naval News","sourceUrl":"https://www.navalnews.com/naval-news/2026/07/usmc-general-atomics-bullseye-missile-china","significance":"Thể hiện ưu tiên ngân sách quốc phòng Mỹ dồn vào năng lực tấn công tầm xa chi phí thấp hơn tên lửa truyền thống, phù hợp chiến lược Marine Littoral Regiment đối phó Trung Quốc mà CSIS/CNAS đã phân tích."},{"date":"2026-07-11","category":"Kinh tế","title":"Sa thải tại Amazon phơi bày thị trường lao động Mỹ bị AI làm bão hòa","summary":"Hơn 8 tháng sau đợt cắt giảm nhân sự lớn nhất lịch sử, nhân viên bị Amazon sa thải đang vật lộn trong thị trường việc làm ngày càng bão hòa; ngành công nghệ Mỹ đã cắt khoảng 140.000 việc làm từ đầu 2026. AI được nêu là lý do chính trong 4 tháng liên tiếp, chiếm khoảng 23% tổng số thông báo sa thải năm 2026.","sourceName":"CNBC","sourceUrl":"https://www.cnbc.com/2026/07/11/burnout-frustration-and-heartbreak-amazon-layoffs-take-their-toll.html","significance":"Làn sóng sa thải do AI đang làm suy yếu thị trường lao động Mỹ ngay cả khi chứng khoán tăng mạnh nhờ kỳ vọng AI."},{"date":"2026-07-10","category":"Kinh tế","title":"Chứng khoán Mỹ lập đỉnh trong khi tăng trưởng thực chỉ quanh 1,9%, giới kinh tế chỉ ra AI","summary":"Chứng khoán Mỹ bùng nổ nửa đầu 2026 trong khi tăng trưởng GDP thực giảm từ ~3,3% (2023) xuống ~1,9%; tỷ lệ tham gia lực lượng lao động gần mức thấp nhất 50 năm. Các nhà kinh tế cho rằng đầu tư và lợi nhuận AI là động lực khiến thị trường tách rời khỏi nền kinh tế thực.","sourceName":"CNBC","sourceUrl":"https://www.cnbc.com/2026/07/10/stock-market-and-economy-out-of-sync.html","significance":"Sự phân kỳ giữa thị trường do AI dẫn dắt và nền kinh tế thực yếu hơn làm dấy lên lo ngại về tính bền vững của đà tăng."},{"date":"2026-07-10","category":"Chính trị","title":"Trump sa thải toàn bộ ủy viên còn lại của Ủy ban Hỗ trợ Bầu cử Mỹ","summary":"Nhà Trắng ngày 10/7 xác nhận Tổng thống Trump đã cách chức 3 ủy viên cuối cùng của Ủy ban Hỗ trợ Bầu cử (EAC) - cơ quan lưỡng đảng độc lập hỗ trợ vận hành bầu cử liên bang - khiến cơ quan này không còn ủy viên nào chỉ vài tháng trước bầu cử giữa kỳ.","sourceName":"Al Jazeera","sourceUrl":"https://www.aljazeera.com/news/2026/7/10/donald-trump-removes-final-members-of-independent-us-election-commission","significance":"Làm dấy lên lo ngại Nhà Trắng can thiệp sâu hơn vào tiến trình bầu cử giữa kỳ, sau khi Tòa Tối cao mở rộng quyền sa thải lãnh đạo cơ quan độc lập của tổng thống."},{"date":"2026-07-10","category":"Công nghệ quân sự","title":"Thủy quân lục chiến Mỹ thử nghiệm thành công hệ thống phòng không tầm trung MRIC tại Guam","summary":"Trong diễn tập Valiant Shield, Thủy quân lục chiến Mỹ tại Guam bắn thử thành công hệ thống Đánh chặn tầm trung (MRIC) dựa trên công nghệ Iron Dome của Israel — lần đầu binh chủng này có phòng không tầm trung kể từ khi loại biên HAWK thập niên 1990. MRIC dùng tên lửa SkyHunter của Raytheon, tầm bắn 4-70km.","sourceName":"Defense News","sourceUrl":"https://www.defensenews.com/news/your-military/2026/07/10/us-marines-successfully-test-fire-new-medium-range-air-defense-system/","significance":"Lấp khoảng trống phòng không giữa Stinger vác vai và Patriot tầm xa, tăng bảo vệ các căn cứ tiền tiêu ở Thái Bình Dương như Guam."},{"date":"2026-07-11","category":"Công nghệ quân sự","title":"Space Force hậu thuẫn thử nghiệm động cơ đẩy lai DOTS của Parabilis cho vệ tinh CubeSat cơ động","summary":"Phối hợp cùng Space Delta 89, công ty Parabilis Space Technologies hoàn tất thử nghiệm bắn nóng hệ thống đẩy lai DOTS (module 2U) kết hợp nhiên liệu rắn với chất oxy hóa lỏng để đạt lực đẩy cao hơn động cơ lai truyền thống. Phần cứng sẵn sàng bay thử trên quỹ đạo sớm nhất năm 2027.","sourceName":"SpaceNews","sourceUrl":"https://spacenews.com/parabilis-tests-propulsion-system-for-maneuverable-cubesats/","significance":"Giúp vệ tinh nhỏ cơ động nhanh hơn để né mảnh vỡ hoặc ghép nối trên quỹ đạo, phục vụ tác chiến không gian linh hoạt của Mỹ."},{"date":"2026-07-11","category":"Công nghệ quân sự","title":"Space Force đưa vào biên chế hệ thống gây nhiễu vệ tinh đối phương Meadowlands","summary":"Bộ Tư lệnh Tác chiến Không gian tiếp nhận hệ thống gây nhiễu mặt đất Meadowlands do L3Harris phát triển, có khả năng phát bức xạ điện từ vô hiệu hóa vệ tinh đối phương — vũ khí giúp 'phát hiện, từ chối, gây rối và làm suy giảm' năng lực đối phương trong không gian.","sourceName":"Task & Purpose","sourceUrl":"https://taskandpurpose.com/news/space-force-meadowlands-jamming-system/","significance":"Bước leo thang trong năng lực tác chiến phản vệ tinh công khai của Mỹ, phản ánh xu hướng quân sự hóa không gian."},{"date":"2026-07-10","category":"Kinh tế","title":"Fed công bố Báo cáo Chính sách Tiền tệ bán niên, tân Chủ tịch Warsh cam kết ổn định giá","summary":"Báo cáo trình Quốc hội đầu tiên dưới thời tân Chủ tịch Fed Kevin Warsh mô tả tăng trưởng kinh tế Mỹ vững chắc, năng suất mạnh, hệ thống ngân hàng ít rủi ro. Báo cáo ghi nhận lạm phát tăng do chiến tranh Iran, thuế quan và chi phí công nghệ, dù một số thước đo lạm phát khác đã giảm.","sourceName":"Federal Reserve","sourceUrl":"https://www.federalreserve.gov/monetarypolicy/files/20260710_mprfullreport.pdf","significance":"Báo cáo chính sách tiền tệ đầu tiên dưới thời tân Chủ tịch Kevin Warsh, định hình kỳ vọng thị trường về lãi suất nửa cuối năm."},{"date":"2026-07-10","category":"Ngoại giao","title":"Ngoại trưởng Mỹ điện đàm với Ngoại trưởng Saudi Arabia về an ninh khu vực","summary":"Ngoại trưởng Mỹ Marco Rubio điện đàm với Ngoại trưởng Saudi Arabia Hoàng tử Faisal bin Farhan Al Saud ngày 10/7, thảo luận các diễn biến khu vực và nhấn mạnh tầm quan trọng của việc phối hợp thúc đẩy an ninh, ổn định Trung Đông.","sourceName":"Bộ Ngoại giao Mỹ","sourceUrl":"https://www.state.gov/releases/office-of-the-spokesperson/2026/07/secretary-rubios-call-with-saudi-foreign-minister-prince-faisal-bin-farhan-al-saud-13","significance":"Duy trì kênh đối thoại Mỹ - Saudi Arabia về an ninh khu vực giữa lúc căng thẳng Trung Đông tiếp diễn."},{"date":"2026-07-10","category":"Ngoại giao","title":"Mỹ và các nước \"Shield of the Americas\" ra tuyên bố chung về tiến trình bầu cử ở Colombia","summary":"Ngày 10/7, Mỹ cùng 12 nước thành viên sáng kiến \"Shield of the Americas\" ra tuyên bố chung bày tỏ quan ngại về những phát ngôn nghi ngờ tính toàn vẹn của tiến trình bầu cử tại Colombia mà không có căn cứ. Tuyên bố khẳng định ý chí cử tri, được cơ quan bầu cử có thẩm quyền xác nhận, là nền tảng duy nhất của tính chính danh quyền lực công.","sourceName":"Bộ Ngoại giao Mỹ","sourceUrl":"https://www.state.gov/releases/office-of-the-spokesperson/2026/07/joint-statement-by-members-of-the-shield-of-the-americas-3","significance":"Thể hiện áp lực ngoại giao tập thể của Mỹ và các đối tác khu vực với tiến trình chính trị nội bộ Colombia."},{"date":"2026-07-09","category":"Công nghệ quân sự","title":"Lầu Năm Góc trao hợp đồng vũ khí laser cho Lockheed Martin và nLIGHT","summary":"Bộ Quốc phòng Mỹ trao hợp đồng cho Lockheed Martin Aculight và nLIGHT Defense phát triển Hệ thống Vũ khí Laser Liên quân (JLWS), giá trị khởi điểm 86 triệu USD, có thể tăng lên tối đa 847 triệu USD. Nguyên mẫu ban đầu công suất 150 kW, sau nâng lên 300-500 kW để đánh chặn tên lửa hành trình.","sourceName":"Breaking Defense","sourceUrl":"https://breakingdefense.com/2026/07/pentagon-picks-lockheed-nlight-for-laser-defense-project/","significance":"Bước tiến quan trọng trong nỗ lực triển khai vũ khí laser chống drone và tên lửa hành trình quy mô lớn của quân đội Mỹ."},{"date":"2026-07-10","category":"Công nghệ quân sự","title":"Không quân Mỹ tìm giải pháp máy bay tiếp dầu cỡ nhỏ cho kịch bản chiến tranh Thái Bình Dương","summary":"Các cuộc diễn tập ở Thái Bình Dương liên tục cho thấy giải pháp phân tán máy bay tiếp dầu cỡ nhỏ như KC-390 của Embraer để duy trì nhiên liệu, thay vì phụ thuộc máy bay tiếp dầu lớn dễ tổn thương. Embraer đang hợp tác Northrop Grumman phát triển tiếp dầu bằng cần tự động theo yêu cầu của Không quân Mỹ.","sourceName":"Breaking Defense","sourceUrl":"https://breakingdefense.com/2026/07/the-solution-to-the-tanker-problem-the-us-military-keeps-finding-in-pacific-wargames/","significance":"Phản ánh thay đổi tư duy hậu cần của Không quân Mỹ nhằm tăng khả năng sống sót trong xung đột ở Ấn Độ Dương-Thái Bình Dương."},{"date":"2026-07-10","category":"Chính trị","title":"Đạo luật nhà ở lớn nhất nhiều thập niên thành luật mà không cần chữ ký của Trump","summary":"Dự luật nhà ở lưỡng đảng '21st Century Road to Housing Act' chính thức thành luật rạng sáng 11/7 sau khi Tổng thống Trump từ chối cả ký lẫn phủ quyết trong thời hạn 10 ngày theo hiến pháp. Ông Trump nói không ký để 'phản đối' việc Thượng viện chưa thông qua dự luật xác minh cử tri SAVE Act mà ông ủng hộ.","sourceName":"Axios","sourceUrl":"https://www.axios.com/2026/07/10/trump-housing-bill-affordability","significance":"Cho thấy giới hạn quyền phủ quyết của Tổng thống khi Quốc hội đồng thuận lưỡng đảng đủ mạnh."},{"date":"2026-07-10","category":"Chính trị","title":"Nghị sĩ Cộng hòa lo ngại nguy cơ chính phủ đóng cửa ngay trước bầu cử giữa kỳ","summary":"Các Thượng nghị sĩ Cộng hòa lo ngại khả năng chính phủ Mỹ đóng cửa khi hạn chót ngân sách 30/9 đến gần, chỉ một tháng trước bầu cử giữa kỳ tháng 11. Đàm phán ngân sách giữa bà Susan Collins và bà Patty Murray đã đình trệ, trong khi Thượng viện từng trải qua 3 lần đóng cửa trong năm qua.","sourceName":"Axios","sourceUrl":"https://www.axios.com/2026/07/10/government-shutdown-congress-republicans-midterm-elections","significance":"Rủi ro đóng cửa chính phủ ngay trước bầu cử giữa kỳ có thể ảnh hưởng lớn tới triển vọng của đảng Cộng hòa."},{"date":"2026-07-08","category":"Công nghệ quân sự","title":"Lực lượng Không gian Mỹ trao loạt hợp đồng công nghệ nhanh cho ngành công nghiệp thương mại","summary":"Lực lượng Không gian Mỹ công bố đã trao 7 thỏa thuận Other Transaction Authority (OTA) trong tháng 5-6/2026 và dự kiến trao thêm 6 thỏa thuận trong tháng 7, tổng cộng 13 hợp đồng trị giá hơn 500 triệu USD cho các nhà cung cấp thương mại để phát triển năng lực chiến đấu không gian. Chương trình phối hợp với Phòng thí nghiệm Nghiên cứu Không quân, Cơ quan Phòng thủ Tên lửa và NASA.","sourceName":"Lực lượng Không gian Mỹ","sourceUrl":"https://www.spaceforce.mil/News/Article-Display/Article/4537826/space-force-delivers-rapid-tech-awards-for-commercial-industry/","significance":"Cho thấy Mỹ đẩy nhanh chiến lược 'tech pull' để rút ngắn thời gian đưa công nghệ vũ trụ thương mại vào phục vụ quân sự."},{"date":"2026-07-09","category":"Kinh tế","title":"Ông Trump ký sắc lệnh yêu cầu đàm phán thương mại về máy bay, động cơ phản lực nhập khẩu","summary":"Ngày 9/7, Tổng thống Donald Trump ký tuyên bố theo Mục 232 Đạo luật Mở rộng Thương mại 1962, chỉ đạo Bộ Thương mại và Văn phòng Đại diện Thương mại Mỹ đàm phán với các đối tác về máy bay thương mại, động cơ phản lực và phụ tùng nhập khẩu vì lo ngại an ninh quốc gia. Sắc lệnh chưa áp thuế ngay nhưng cảnh báo có thể áp thuế nếu không đạt thỏa thuận trong 180 ngày.","sourceName":"Nhà Trắng","sourceUrl":"https://www.whitehouse.gov/fact-sheets/2026/07/fact-sheet-president-donald-j-trump-adjusts-imports-of-commercial-aircraft-jet-engines-and-aircraft-and-engine-parts-into-the-united-states/","significance":"Đặt ngành hàng không thương mại toàn cầu, gồm cả chuỗi cung ứng liên quan tới Boeing/Airbus, trước nguy cơ thuế quan mới nếu đàm phán thất bại."},{"date":"2026-07-08","category":"Ngoại giao","title":"Mỹ, Nhật Bản, Hàn Quốc ra tuyên bố chung tái khẳng định cam kết hòa bình eo biển Đài Loan","summary":"Bên lề Thượng đỉnh NATO tại Ankara, Ngoại trưởng Mỹ Marco Rubio cùng ngoại trưởng Nhật Bản và Hàn Quốc nhấn mạnh tầm quan trọng của hòa bình, ổn định tại eo biển Đài Loan, phản đối mọi hành động đơn phương thay đổi hiện trạng bằng vũ lực. Ba bên cũng ký biên bản ghi nhớ hợp tác năng lượng hạt nhân dân sự và tái khẳng định cam kết phi hạt nhân hóa Triều Tiên.","sourceName":"Bộ Ngoại giao Mỹ","sourceUrl":"https://www.state.gov/releases/office-of-the-spokesperson/2026/07/united-states-japan-republic-of-korea-rok-trilateral-foreign-ministers-meeting","significance":"Củng cố liên kết ba bên Mỹ-Nhật-Hàn về an ninh Ấn Độ Dương-Thái Bình Dương trong bối cảnh Trung Quốc gia tăng hoạt động quanh Đài Loan."},{"date":"2026-07-08","category":"Kinh tế","title":"Biên bản họp Fed hé lộ bất đồng sâu sắc về hướng đi lãi suất","summary":"Biên bản cuộc họp tháng 6 của Fed cho thấy các quan chức chia rẽ rõ rệt: một nhóm nghiêng về khả năng hạ lãi suất cuối năm nay, trong khi nhóm khác cho rằng mức lãi suất phù hợp phải cao hơn biên độ hiện tại 3,5%-3,75%. Ủy ban vẫn nhất trí giữ nguyên lãi suất tại cuộc họp đầu tiên do tân Chủ tịch Kevin Warsh điều hành.","sourceName":"CNBC","sourceUrl":"https://www.cnbc.com/2026/07/08/fed-minutes-june-2026-.html","significance":"Sự bất đồng trong nội bộ Fed làm gia tăng bất định về lộ trình lãi suất Mỹ nửa cuối năm, ảnh hưởng tới thị trường tài chính toàn cầu."},{"date":"2026-07-09","category":"Công nghệ quân sự","title":"Giới chuyên gia: chương trình tên lửa đánh chặn giá rẻ của Lục quân Mỹ có triển vọng nhưng nhiều rủi ro","summary":"Hai tuần sau khi Lục quân Mỹ chính thức khởi động chương trình Low-Cost Interceptor (LCI) nhằm giảm phụ thuộc vào các hệ thống đánh chặn đắt đỏ như PAC-3 MSE, SM-3, SM-6 trước drone giá rẻ kiểu Shahed, chuyên gia Stacie Pettyjohn (CNAS) đánh giá hướng đi hợp lý nhưng cảnh báo nguy cơ nghẽn sản xuất linh kiện như đầu dò tên lửa và đất hiếm.","sourceName":"Breaking Defense","sourceUrl":"https://breakingdefense.com/2026/07/theres-promise-and-pitfalls-in-the-armys-low-cost-interceptor-plan-experts-say/","significance":"Phản ánh áp lực tiêu hao đạn đánh chặn đắt tiền của Mỹ sau các đợt tiêu hao lớn, thúc đẩy tìm giải pháp đánh chặn rẻ hơn."},{"date":"2026-07-09","category":"Công nghệ quân sự","title":"Hải quân Mỹ tiết lộ bước tiếp theo của chương trình tàu mặt nước không người lái MUSV","summary":"Theo thông báo ngày 7/7, Hải quân Mỹ chuẩn bị phát hành yêu cầu đề xuất nguyên mẫu (dự kiến tháng 8) cho dòng tàu mặt nước không người lái cỡ trung (MUSV) sức chứa lớn, phục vụ hậu cần và vận chuyển hàng hóa container hóa, theo mô hình 'marketplace' cạnh tranh mới Hải quân áp dụng từ đầu năm.","sourceName":"Defense One","sourceUrl":"https://www.defenseone.com/defense-systems/2026/07/navy-teases-next-step-key-drone-boat-program/414683/","significance":"Đánh dấu bước tiến cụ thể tiếp theo trong nỗ lực mở rộng hạm đội tàu không người lái của Hải quân Mỹ, sau khi chương trình mua sắm cấp tốc trước đó bị hủy và tái khởi động."},{"date":"2026-07-08","category":"Công nghệ quân sự","title":"Lực lượng Không gian Mỹ bổ sung Relativity Space và Impulse Space vào chương trình phóng an ninh quốc gia","summary":"Lực lượng Không gian Mỹ đưa 2 công ty khởi nghiệp California là Impulse Space và Relativity Federal vào hợp đồng phóng NSSL Phase 3 Lane 1 trị giá 5,6 tỷ USD, mỗi công ty nhận đơn hàng ban đầu 5 triệu USD để đánh giá năng lực. Impulse Space dùng tàu vũ trụ Helios chuyển tải từ quỹ đạo thấp lên quỹ đạo cao trong chưa đầy 1 ngày; Relativity Federal dự kiến phóng tên lửa tái sử dụng Terran R từ Cape Canaveral cuối năm nay.","sourceName":"SpaceNews","sourceUrl":"https://spacenews.com/space-force-adds-relativity-impulse-space-to-national-security-launch-program/","significance":"Mở rộng cạnh tranh trong nhóm nhà cung cấp phóng vệ tinh an ninh quốc gia Mỹ, vốn đang bị đặt câu hỏi vì tập trung quá nhiều vào SpaceX."},{"date":"2026-07-08","category":"Ngoại giao","title":"Trump thông báo Quốc hội ý định đưa Syria ra khỏi danh sách quốc gia bảo trợ khủng bố","summary":"Tổng thống Trump thông báo cho Quốc hội Mỹ về quyết định đưa Syria ra khỏi danh sách quốc gia bảo trợ khủng bố mà nước này bị liệt vào từ năm 1979, sau cuộc gặp với Tổng thống Syria Ahmed al-Sharaa. Ngoại trưởng Marco Rubio dẫn các thay đổi tích cực và cam kết chống khủng bố của chính quyền al-Sharaa làm căn cứ; quyết định sẽ có hiệu lực sau 45 ngày nếu Quốc hội không ngăn cản.","sourceName":"Al Arabiya","sourceUrl":"https://english.alarabiya.net/News/middle-east/2026/07/08/trump-informs-congress-of-intent-to-remove-syria-from-state-sponsor-of-terror-list","significance":"Đánh dấu bước ngoại giao lớn nhất của Mỹ với chính quyền hậu Assad, chấm dứt 47 năm cô lập ngoại giao với Syria."},{"date":"2026-07-09","category":"Kinh tế","title":"Đơn xin trợ cấp thất nghiệp Mỹ giảm xuống 215.000 vào tuần kết thúc ngày 4/7","summary":"Số đơn xin trợ cấp thất nghiệp mới của Mỹ giảm 4.000 xuống 215.000 vào tuần kết thúc ngày 4 tháng 7, thấp hơn dự báo của các nhà kinh tế kỳ vọng 218.000-220.000. Dữ liệu cho thấy thị trường lao động Mỹ vẫn ổn định tuy đã chứng tỏ dấu hiệu nguội lạnh.","sourceName":"CNBC","sourceUrl":"https://www.cnbc.com/video/2026/07/09/jobless-claims-moved-lower-during-holiday-week.html","significance":"Mức yêu cầu trợ cấp thấp hơn dự báo cho thấy sức khỏe tương đối của thị trường lao động Mỹ."},{"date":"2026-07-09","category":"Kinh tế","title":"Doanh số bán nhà cũ Mỹ giảm 2,4% tháng 6, giá đạt kỷ lục","summary":"Doanh số bán nhà cũ tại Mỹ giảm 2,4% từ tháng 5 xuống 4,09 triệu unit, vượt quá dự báo của các nhà phân tích. Tuy nhiên, giá trung vị của căn nhà đã bán đạt mức kỷ lục 440.600 USD, tăng 1,8% so với năm trước.","sourceName":"CNBC","sourceUrl":"https://www.cnbc.com/2026/07/09/june-home-sales-prices.html","significance":"Doanh số nhà cũ giảm dù giá cao kỷ lục phản ánh sự cạnh tranh dữ dội và căng thẳng của người mua nhà."},{"date":"2026-07-07","category":"Công nghệ quân sự","title":"Quân đội Mỹ thử nghiệm hệ thống đặt mìn tự động Autonomous Volcano","summary":"Quân đội Mỹ thử nghiệm thành công phiên bản tự động của bộ phân tán mìn M139 lắp trên xe Palletized Load System. Hệ thống có thể đặt tới 960 mìn trên diện tích 32 mẫu Anh mà không cần điều khiển từ xa, tự động ghi vị trí lên bản đồ chiến trường chung.","sourceName":"Defense News","sourceUrl":"https://www.defensenews.com/news/your-military/2026/07/07/us-army-tests-autonomous-mass-mine-laying/","significance":"Nâng cao khả năng công binh chiến đấu thông qua tự động hoá, giảm rủi ro cho binh sĩ."},{"date":"2026-07-09","category":"Công nghệ quân sự","title":"Lầu Năm Góc tiếp tục gặp khó trong phát triển vũ khí, báo cáo GAO","summary":"Báo cáo của Cơ quan Kiểm toán Chính phủ Mỹ (GAO) cho thấy thời gian phát triển vũ khí trung bình đã vượt 12 năm. Nhiều chương trình theo lộ trình rút gọn MTA dù công nghệ chưa chín muồi, gây đội chi phí và trễ tiến độ.","sourceName":"Breaking Defense","sourceUrl":"https://breakingdefense.com/2026/07/pentagon-continues-to-struggle-with-key-weapons-development-timelines-gao/","significance":"Phản ánh thách thức dài hạn trong quá trình phát triển vũ khí hiệu quả của Lầu Năm Góc."},{"date":"2026-07-08","category":"Ngoại giao","title":"Trump tín hiệu sẵn sàng nâng cấp quan hệ với Thổ Nhĩ Kỳ, xem xét bán máy bay F-35","summary":"Trong cuộc gặp song phương ở Ankara, Tổng thống Trump thông báo sẽ nâng cấp quan hệ với Thổ Nhĩ Kỳ bằng cách dỡ bỏ lệnh trừng phạt và xem xét bán máy bay chiến đấu F-35. Trump khẳng định sẽ ra quyết định sớm về việc cho phép Thổ Nhĩ Kỳ quay trở lại chương trình F-35.","sourceName":"Al Jazeera","sourceUrl":"https://www.aljazeera.com/news/2026/7/7/trump-says-will-lift-sanctions-on-turkiye-consider-selling-f-35s","significance":"Động thái này đánh dấu sự thay đổi đáng kể trong chính sách Mỹ đối với Thổ Nhĩ Kỳ và có thể tác động đến cân bằng quân sự ở Trung Đông."},{"date":"2026-07-09","category":"Ngoại giao","title":"Mỹ cam kết tiếp tục đàm phán với Iran bất chấp các cuộc tấn công gần đây","summary":"Phát ngôn viên Mỹ xác nhận rằng Mỹ sẽ tiếp tục các cuộc đàm phán kỹ thuật với Iran mặc dù hai bên vừa trao đổi các cuộc tấn công. Các quan chức Mỹ nhấn mạnh cam kết của họ đối với quá trình đàm phán để tìm kiếm giải pháp lâu dài cho xung đột.","sourceName":"Axios","sourceUrl":"https://www.axios.com/2026/07/09/trump-iran-strait-hormuz-battle","significance":"Cam kết tiếp tục đàm phán của Mỹ cho thấy kỳ vọng rằng hòa bình vẫn có thể đạt được bất chấp những thách thức quân sự gần đây."},{"date":"2026-07-09","category":"Công nghệ quân sự","title":"Lực lượng Không gian Mỹ hoàn tất tái cơ cấu mua sắm, lập 9 danh mục đầu tư","summary":"US Space Force hoàn tất tái tổ chức hệ thống mua sắm, chia thành 9 danh mục đầu tư (acquisition portfolios) nhằm tăng tốc phát triển và triển khai năng lực không gian.","sourceName":"SpaceNews","sourceUrl":"https://spacenews.com/space-force-completes-procurement-reorganization-creating-nine-acquisition-portfolios/","significance":"Cho thấy nỗ lực cải tổ quy trình mua sắm quốc phòng Mỹ để bắt kịp tốc độ cạnh tranh không gian với Trung Quốc và Nga."},{"date":"2026-07-09","category":"Công nghệ quân sự","title":"Lực lượng Không gian Mỹ trao 40 triệu USD cho Pulse Space phát triển truyền năng lượng bằng laser","summary":"Lực lượng Không gian Mỹ (US Space Force) cấp 40 triệu USD cho công ty Pulse Space để phát triển công nghệ truyền tải năng lượng bằng laser trên quỹ đạo.","sourceName":"SpaceNews","sourceUrl":"https://spacenews.com/space-force-awards-pulse-space-40-million-to-advance-laser-power-technology/","significance":"Phản ánh Mỹ đầu tư vào hạ tầng năng lượng không gian — nền tảng cho các hệ thống quân sự trên quỹ đạo thế hệ mới."},{"date":"2026-07-09","category":"Chính trị","title":"Dự luật lưỡng đảng có thể cho phép quân nhân Mỹ kiện quân đội vì bị tấn công tình dục","summary":"Một dự luật do các nghị sĩ Dân chủ và Cộng hòa giới thiệu có thể tháo gỡ 'học thuyết Feres' năm 1950 vốn cấm quân nhân tại ngũ kiện chính phủ, mở đường cho các vụ kiện liên quan tấn công tình dục trong quân đội.","sourceName":"Task & Purpose","sourceUrl":"https://taskandpurpose.com/news/military-law-assault-feres-lawsuit/","significance":"Nếu thông qua, sẽ đảo ngược tiền lệ pháp lý kéo dài 75 năm và thay đổi căn bản trách nhiệm giải trình của quân đội Mỹ."},{"date":"2026-07-09","category":"Chính trị","title":"Mỹ không kích 90 mục tiêu Iran, tuyên bố chấm dứt ngừng bắn","summary":"Bộ Tư lệnh Trung tâm Mỹ (CENTCOM) thông báo hoàn tất đợt không kích bổ sung nhằm vào khoảng 90 mục tiêu quân sự Iran ngày 8/7 — gồm hệ thống phòng không, kho tên lửa/UAV và hạ tầng hậu cần — nhằm làm suy yếu khả năng đe dọa hàng hải của Tehran ở eo biển Hormuz. Cả Mỹ và Iran đều tuyên bố ngừng bắn đã chấm dứt.","sourceName":"Dân Trí","sourceUrl":"https://dantri.com.vn/the-gioi/my-trut-hoa-luc-tan-cong-90-muc-tieu-cua-iran-20260709142425458.htm","significance":"Việc Mỹ tấn công cả hạ tầng bên trong Iran — lần đầu kể từ thỏa thuận ngừng bắn 8/4 — cho thấy lệnh ngừng bắn đã sụp đổ và nguy cơ quay lại chiến tranh toàn diện đang hiện hữu, kéo theo rủi ro cho giá dầu và an ninh hàng hải toàn cầu."},{"date":"2026-07-09","category":"Chính trị","title":"Lý do Tổng thống Trump phát lệnh không kích liên tiếp vào Iran","summary":"Một quan chức Mỹ nêu hai lý do chính khiến Tổng thống Trump quyết định tiến hành các đợt không kích mới nhằm vào Iran trong hai ngày, chủ yếu là để đáp trả các vụ tấn công tàu chở dầu ở eo biển Hormuz và răn đe Tehran đóng eo biển.","sourceName":"Thanh Niên","sourceUrl":"https://thanhnien.vn/vi-sao-tong-thong-trump-quyet-dinh-khoi-phuc-tan-cong-iran-tren-quy-mo-lon-185260709071823944.htm","significance":"Quyết định leo thang phản ánh Nhà Trắng ưu tiên bảo vệ tự do hàng hải và nguồn cung dầu hơn là giữ nguyên trạng ngừng bắn, đặt Trump vào thế phải chọn giữa xung đột kéo dài và áp lực cạn kho dự trữ dầu trong nước."},{"date":"2026-07-09","category":"Ngoại giao","title":"Trump dọa cấm vận thương mại Tây Ban Nha, đòi Greenland tại thượng đỉnh NATO","summary":"Tổng thống Trump chỉ trích gay gắt Tây Ban Nha vì đóng góp quốc phòng không đủ và muốn các nước NATO cắt toàn bộ giao thương với Madrid, đồng thời tái khẳng định yêu sách với Greenland, phơi bày rạn nứt trong liên minh.","sourceName":"VnEconomy","sourceUrl":"https://vneconomy.vn/tong-thong-trump-muon-cac-nuoc-nato-cat-toan-bo-giao-thuong-voi-tay-ban-nha.htm","significance":"Việc công khai gây sức ép với một đồng minh NATO cho thấy Trump sẵn sàng dùng công cụ kinh tế để ép chi tiêu quốc phòng, làm dấy lên lo ngại về sự gắn kết của liên minh ngay tại hội nghị được cho là biểu tượng đoàn kết."},{"date":"2026-07-09","category":"Ngoại giao","title":"Trump ngỏ ý rút bớt quân Mỹ khỏi châu Âu, gắn với vấn đề Greenland","summary":"Tổng thống Trump cho biết quyết định về quy mô hiện diện quân sự của Mỹ tại châu Âu sẽ phụ thuộc vào việc giải quyết vấn đề Greenland, tạo thêm sức ép lên các đồng minh sau thượng đỉnh NATO Ankara.","sourceName":"Dân Trí","sourceUrl":"https://dantri.com.vn/the-gioi/tong-thong-trump-noi-ve-kha-nang-rut-bot-quan-doi-my-khoi-chau-au-20260709143820283.htm","significance":"Gắn cam kết an ninh với một đòi hỏi lãnh thổ là bước đi chưa từng có, buộc châu Âu phải tính đến kịch bản tự chủ quốc phòng nếu chiếc ô an ninh Mỹ trở nên có điều kiện."},{"date":"2026-07-09","category":"Kinh tế","title":"Mỹ tái áp trừng phạt dầu mỏ Iran, giáng đòn nặng vào kinh tế Tehran","summary":"Việc Mỹ tái áp đặt các lệnh trừng phạt đối với dầu mỏ Iran được đánh giá là đòn giáng mạnh vào nền kinh tế Tehran vốn phụ thuộc lớn vào xuất khẩu dầu, giữa lúc xung đột quân sự tái bùng phát.","sourceName":"Tuổi Trẻ","sourceUrl":"https://tuoitre.vn/kinh-te-iran-hung-don-nang-sau-khi-my-tai-ap-lenh-trung-phat-100260709145610204.htm","significance":"Kết hợp đòn quân sự với trừng phạt kinh tế cho thấy Washington theo đuổi chiến lược gây sức ép tối đa; song siết dầu Iran cũng có thể phản tác dụng khi đẩy giá dầu toàn cầu lên cao."},{"date":"2026-07-09","category":"Kinh tế","title":"Dow Jones lao dốc khi giá dầu nhảy hơn 5% vì căng thẳng Vùng Vịnh","summary":"Chỉ số Dow Jones giảm mạnh khi giá dầu tăng hơn 5% do căng thẳng leo thang ở Trung Đông, khiến nhà đầu tư phải đánh giá lại rủi ro địa chính trị sau giai đoạn tự mãn.","sourceName":"VnEconomy","sourceUrl":"https://vneconomy.vn/dow-jones-lao-doc-khi-gia-dau-nhay-hon-5-do-cang-thang-o-vung-vinh.htm","significance":"Phản ứng của thị trường cho thấy rủi ro chiến tranh Mỹ - Iran đã được định giá lại, và giá năng lượng trở thành kênh chính truyền cú sốc địa chính trị vào kinh tế toàn cầu."},{"date":"2026-07-09","category":"Kinh tế","title":"Apple cam kết chi 30 tỷ USD mua chip sản xuất tại Mỹ","summary":"Apple cam kết chi 30 tỷ USD mua chip bán dẫn sản xuất ở Mỹ, một động thái nằm trong nỗ lực gây thiện cảm với chính quyền Trump và củng cố chuỗi cung ứng nội địa.","sourceName":"VnEconomy","sourceUrl":"https://vneconomy.vn/apple-cam-ket-chi-30-ty-usd-mua-con-chip-san-xuat-o-my.htm","significance":"Cam kết cho thấy sức ép chính trị đang định hình lại quyết định đầu tư của các đại gia công nghệ, đẩy nhanh xu hướng đưa sản xuất bán dẫn chiến lược trở lại nước Mỹ."},{"date":"2026-07-09","category":"Kinh tế","title":"\"Đất hiếm Mỹ đang được bán sang châu Á\" vì nhu cầu nội địa yếu","summary":"Đất hiếm do các công ty được chính phủ Mỹ hậu thuẫn sản xuất đang chảy sang châu Á do nhu cầu trong nước chưa phát triển, dù chính quyền Trump nỗ lực xây chuỗi cung ứng đất hiếm quốc gia.","sourceName":"VnEconomy","sourceUrl":"https://vneconomy.vn/dat-hiem-my-dang-duoc-ban-cho-cac-nuoc-chau-a.htm","significance":"Nghịch lý này phơi bày điểm yếu trong tham vọng tự chủ đất hiếm của Mỹ: có thể khai thác nhưng thiếu năng lực chế biến và thị trường tiêu thụ nội địa để cạnh tranh với Trung Quốc."},{"date":"2026-07-09","category":"Kinh tế","title":"Trump chuẩn bị xé bỏ 'bản ghi nhớ' với Iran nhưng Phố Wall gần như phớt lờ","summary":"Dù Tổng thống Trump tuyên bố sẵn sàng hủy MOU và tái chiến với Iran, thị trường Mỹ chỉ dao động nhẹ trong phiên 9-7, dầu hạ nhiệt sau khi có lúc vượt 80 USD/thùng.","sourceName":"Fortune","sourceUrl":"https://fortune.com/2026/07/09/trump-iran-memorandum-of-understanding-stocks/","significance":"Phản ứng dửng dưng cho thấy nhà đầu tư đang định giá xung đột vùng Vịnh là rủi ro 'có kiểm soát', miễn là eo biển Hormuz chưa bị phong tỏa hoàn toàn."},{"date":"2026-07-09","category":"Công nghệ quân sự","title":"CENTCOM hoàn tất đợt không kích thứ hai, đánh khoảng 90 mục tiêu quân sự Iran","summary":"Bộ Tư lệnh Trung tâm Mỹ cho biết đã tấn công khoảng 90 mục tiêu gồm hệ thống phòng không, trạm giám sát ven biển, kho tên lửa - UAV và năng lực hải quân dọc bờ biển Iran, sau đợt đánh 80 mục tiêu đêm trước.","sourceName":"Al Arabiya","sourceUrl":"https://english.alarabiya.net/News/middle-east/2026/07/09/latest-strikes-hit-90-military-targets-in-iran-us-military","significance":"Chiến dịch tập trung phá hủy năng lực đe dọa hàng hải của Iran ở eo Hormuz cho thấy Mỹ theo đuổi mục tiêu quân sự có giới hạn - né đánh Tehran và cơ sở hạt nhân - nhưng vẫn duy trì áp lực hỏa lực cường độ cao."},{"date":"2026-07-09","category":"Chính trị","title":"Ông Trump khẳng định Mỹ muốn ở lại NATO","summary":"Tổng thống Trump tuyên bố Mỹ muốn tiếp tục là thành viên NATO, trấn an các đồng minh sau loạt phát ngôn dọa rút quân khỏi châu Âu.","sourceName":"Báo Mới","sourceUrl":"https://baomoi.com/ong-trump-khang-dinh-my-muon-o-lai-nato-c55575411.epi","significance":"Trấn an sau loạt đe dọa rút quân; phản ánh chiến thuật \"gây sức ép rồi trấn an\" của Trump nhằm buộc đồng minh tăng chi, nhưng vẫn để lại hoài nghi về độ tin cậy của cam kết Mỹ."},{"date":"2026-07-09","category":"Chính trị","title":"Mỹ: Việc rút khỏi USMCA có thể buộc Quốc hội phải hành động","summary":"Khả năng Mỹ rút khỏi hiệp định thương mại USMCA với Canada và Mexico có thể buộc Quốc hội phải vào cuộc, đặt ra rủi ro cho chuỗi cung ứng Bắc Mỹ.","sourceName":"Báo Mới","sourceUrl":"https://baomoi.com/my-viec-rut-khoi-usmca-co-the-se-buoc-quoc-hoi-phai-hanh-dong-c55575158.epi","significance":"Cho thấy rủi ro lớn với chuỗi cung ứng Bắc Mỹ nếu Mỹ rút khỏi hiệp định; phản ánh xu hướng bảo hộ và bất định thương mại lan cả sang các đối tác láng giềng thân cận."},{"date":"2026-07-08","category":"Công nghệ quân sự","title":"Lầu Năm Góc tìm UAV giá rẻ thay MQ-9 Reaper sau khi mất gần 30 chiếc ở Iran","summary":"Sau khi khoảng 30 UAV MQ-9 Reaper bị bắn hạ trong xung đột với Iran, Lầu "category":"Công nghệ quân sự","title":"Lực lượng Không gian Mỹ bổ sung hai startup vào nhóm phóng tên lửa nhỏ và vừa","summary":"Space Force chọn thêm hai công ty khởi nghiệp tham gia cạnh tranh các nhiệm vụ phóng vệ tinh cỡ nhỏ và vừa, nhằm mở rộng nguồn cung phương tiện phóng và giảm phụ thuộc vào số ít nhà thầu lớn.","sourceName":"Breaking Defense","sourceUrl":"https://breakingdefense.com/2026/07/space-force-adds-two-startups-to-small-medium-launch-pool/","significance":"Đa dạng hóa nhà cung cấp phóng giúp Mỹ tăng khả năng phục hồi và tốc độ triển khai vệ tinh quân sự."}],"analyses":[{"date":"2026-07-09","region":"Ấn Độ Dương - Thái Bình Dương","topic":"Răn đe hạt nhân","outlet":"Naval News","author":"","title":"Phân tích: Vụ thử SLBM Thái Bình Dương của Trung Quốc báo hiệu chuyển sang răn đe trên biển liên tục","summary":"Naval News phân tích vụ thử SLBM ngày 6/7 của Trung Quốc, cho rằng nó phản ánh mức độ trưởng thành của lực lượng răn đe hạt nhân trên biển của PLAN và bước tiến tới tuần tra răn đe liên tục (CASD).","takeaway":"Nếu Trung Quốc đạt năng lực răn đe trên biển liên tục, cán cân hạt nhân ở Ấn Độ Dương - Thái Bình Dương sẽ thay đổi căn bản, gia tăng sức ép lên Mỹ và các đồng minh.","url":"https://www.navalnews.com/naval-news/2026/07/china-pacific-slbm-test-casd-nuclear-deterrence/"},{"date":"2026-07-09","region":"Châu Âu/NATO","topic":"Đoàn kết liên minh","outlet":"Al Jazeera","author":"","title":"Trump nhắm vào Tây Ban Nha, NATO hậu thuẫn Ukraine: Liên minh còn thống nhất?","summary":"Bài phân tích của Al Jazeera đánh giá dù các thành viên NATO nhất trí tăng chi tiêu quốc phòng, các đòn công kích của Trump nhằm vào Tây Ban Nha và Greenland đang đe dọa sự gắn kết của khối.","takeaway":"NATO đối mặt nghịch lý: cùng lúc tăng cường năng lực quân sự nhưng lại rạn nứt về chính trị nội bộ, làm suy yếu độ tin cậy của cam kết răn đe tập thể.","url":"https://www.aljazeera.com/news/2026/7/9/trump-targets-spain-nato-backs-ukraine-is-the-alliance-still-united"},{"date":"2026-07-08","region":"Trung Đông","topic":"Xung đột Mỹ - Iran","outlet":"CSIS","author":"","title":"Lệnh ngừng bắn Mỹ - Iran mong manh: những vấn đề cần theo dõi","summary":"CSIS phân tích tình trạng ngừng bắn Mỹ - Iran giữa bất định ở eo biển Hormuz và thị trường năng lượng, cho rằng đàm phán do Pakistan trung gian đang bế tắc dù đột phá bất ngờ vẫn có thể xảy ra.","takeaway":"Israel và Iran nhiều khả năng mắc kẹt trong xung đột cường độ thấp kéo dài thay vì đạt hòa bình bền vững; Mỹ khó áp đặt kết cục quân sự dứt điểm.","url":"https://www.csis.org/analysis/fragile-us-iran-ceasefire-issues-watch"},{"date":"2026-07-08","region":"Toàn cầu","topic":"Hệ quả quốc phòng","outlet":"CSIS","author":"","title":"Những hệ quả ngoài dự tính của xung đột Mỹ - Iran với quốc phòng và an ninh","summary":"CSIS đánh giá các hệ quả ngoài dự tính của cuộc xung đột Mỹ - Iran đối với quốc phòng và an ninh, từ tiêu hao khí tài (như MQ-9) đến bài học về phòng không, hậu cần và sức bền công nghiệp quốc phòng.","takeaway":"Xung đột phơi bày điểm yếu về kho đạn và khí tài đắt tiền của Mỹ, thúc đẩy xu hướng chuyển sang vũ khí giá rẻ, sản xuất hàng loạt và tự động hóa.","url":"https://www.csis.org/analysis/what-are-unintended-consequences-us-iran-conflict-defense-and-security"},{"date":"2026-07-08","region":"Toàn cầu","topic":"An ninh","outlet":"War on the Rocks","author":"Benoit Lefevre","title":"Hải tặc Somalia trở lại — nhưng liên minh từng đánh bại chúng thì không","summary":"Nạn hải tặc Somalia tái bùng phát với ba tàu hàng bị cướp gần Sừng châu Phi, sau gần một thập kỷ bị dẹp yên. Bối cảnh địa chính trị đã đổi khiến các liên minh hải quân đa quốc gia kiểu 2011 khó tái lập.","takeaway":"NATO đã dồn về phòng thủ lãnh thổ, Mỹ xoay trục sang Ấn Độ Dương - Thái Bình Dương và sa lầy hậu chiến Iran, châu Âu thiếu tàu; giải pháp phải là kiến trúc an ninh khu vực làm nòng cốt, có đối tác bên ngoài hỗ trợ và xử lý gốc rễ quản trị - kinh tế trên bờ.","url":"https://warontherocks.com/somali-pirates-are-back-but-the-coalition-that-beat-them-isnt-coming/"},{"date":"2026-07-08","region":"Trung Đông","topic":"An ninh","outlet":"War on the Rocks","author":"Allison Minor","title":"Nhìn lại mối đe dọa của Houthi với vận tải biển","summary":"Tác giả xem lại phân tích năm 2024 của chính mình về các cuộc tấn công của Houthi trên Biển Đỏ, khi sự chú ý toàn cầu chuyển sang eo biển Hormuz. Dù các đợt không kích Mỹ - Israel làm suy giảm năng lực Houthi, nhóm này vẫn là mối đe dọa dai dẳng.","takeaway":"Houthi hiện đang tái tổ chức lực lượng thay vì tấn công chủ động, nhưng vẫn nắm ảnh hưởng lên các tuyến hàng hải thương mại nhờ nguy cơ ngầm về việc nối lại chiến sự.","url":"https://warontherocks.com/a-fresh-look-at-the-houthi-threat-to-maritime-shipping/"},{"date":"2026-07-08","region":"Châu Mỹ","topic":"Xét lại hiệp định USMCA","outlet":"CSIS","author":"William Alan Reinsch","title":"Giai đoạn tiếp theo của USMCA","summary":"Chính quyền Trump đã kích hoạt cơ chế rà soát 10 năm của USMCA vào ngày 1/7, bác bỏ phương án gia hạn đơn thuần. Đàm phán nay xoay quanh lo ngại an ninh — nhất là chặn hàng Trung Quốc đi vòng qua 'cửa sau' Bắc Mỹ — cùng tranh cãi về quy tắc xuất xứ và các vấn đề ngành.","takeaway":"Bất định kéo dài sẽ ghìm đầu tư doanh nghiệp, dù cách tiếp cận chuyên nghiệp của USTR để ngỏ khả năng đạt thỏa thuận sửa đổi.","url":"https://www.csis.org/analysis/next-phase-usmca"},{"date":"2026-07-08","region":"Toàn cầu","topic":"Cướp biển Somalia trở lại","outlet":"War on the Rocks","author":"Benoit Lefevre","title":"Cướp biển Somalia đã trở lại — nhưng liên minh từng đánh bại chúng thì không","summary":"Cướp biển Somalia tái xuất với các vụ bắt tàu hàng gần đây, nhưng liên minh hải quân đa quốc gia từng dẹp yên hồi 2011 không thể tái lập vì ưu tiên địa chính trị đã đổi. Tác giả đề xuất cấu trúc lấy khu vực làm trung tâm, để lực lượng biển địa phương dẫn dắt với hỗ trợ tình báo và năng lực chuyên biệt từ bên ngoài.","takeaway":"Giải pháp bền vững đòi hỏi an ninh hàng hải do khu vực dẫn dắt, đồng thời xử lý gốc rễ là quản trị yếu kém ở Somalia.","url":"https://warontherocks.com/2026/07/somali-pirates-are-back-but-the-coalition-that-beat-them-isnt-coming/"},{"date":"2026-07-07","region":"Trung Đông","topic":"An ninh hàng hải","outlet":"CSIS","author":"","title":"Canh bạc eo biển Hormuz của Iran và giới hạn sức mạnh quân sự Mỹ","summary":"CSIS mổ xẻ chiến lược của Iran ở eo biển Hormuz và những giới hạn của sức mạnh quân sự Mỹ trong việc bảo đảm tự do hàng hải trước chiến thuật quấy rối bằng tàu nhỏ, thủy lôi và tên lửa bờ.","takeaway":"Mỹ có ưu thế hỏa lực áp đảo nhưng khó ngăn Iran gây gián đoạn ngắn hạn tuyến hàng hải huyết mạch, khiến rủi ro địa chính trị với giá dầu luôn thường trực.","url":"https://www.csis.org/analysis/irans-strait-hormuz-gambit-and-limits-us-military-power"},{"date":"2026-07-07","region":"Đông Á","topic":"An ninh","outlet":"CSIS","author":"Joseph Rodgers, Bonny Lin, Leon Li","title":"Vụ thử tên lửa đạn đạo phóng từ tàu ngầm của Trung Quốc cho thấy cần một thỏa thuận thông báo phóng","summary":"Ngày 6/7, Trung Quốc lần đầu bắn một tên lửa đạn đạo phóng từ tàu ngầm ra vùng biển quốc tế ở Thái Bình Dương, bay khoảng 7.300 km và có thể bay qua Philippines. Ba chuyên gia CSIS phân tích ý nghĩa chiến lược và rủi ro từ việc thiếu quy trình thông báo.","takeaway":"Vụ thử lần đầu phô diễn năng lực răn đe hạt nhân từ tàu ngầm của Bắc Kinh ngay tại Ấn Độ Dương - Thái Bình Dương; tác giả kêu gọi Trung Quốc tham gia Bộ Quy tắc Hague để tránh tính toán sai, giữa lúc kho đầu đạn tăng từ 200 lên hơn 600 trong sáu năm.","url":"https://www.csis.org/analysis/chinas-slbm-test-underscores-importance-ballistic-missile-launch-notification-agreement"},{"date":"2026-07-07","region":"Châu Âu/NATO","topic":"Dư luận Nga và chiến tranh Ukraine","outlet":"CSIS","author":"Maria Snegovaya & Jade McGlynn","title":"Thái độ người Nga đang đổi khi hệ quả chiến tranh về đến nhà","summary":"Các đợt tập kích bằng drone của Ukraine vào hạ tầng năng lượng Nga đang đưa hệ quả kinh tế của cuộc chiến đến tận người dân qua thiếu nhiên liệu và gián đoạn dịch vụ. Tác giả nhận định cú sốc kinh tế đời thường có sức bào mòn ủng hộ chiến tranh mạnh hơn các cú sốc quân sự đơn thuần.","takeaway":"Phương Tây nên phối hợp trừng phạt và truyền thông để gắn khó khăn trong nước Nga với lựa chọn gây chiến của Kremlin.","url":"https://www.csis.org/analysis/russian-attitudes-are-shifting-wars-effects-come-home"},{"date":"2026-07-06","region":"Châu Âu/NATO","topic":"Tự chủ quốc phòng châu Âu","outlet":"CSIS","author":"Max Bergmann & Otto Svendsen","title":"Hãy biến Thượng đỉnh Ankara thành chuyện tự chủ quốc phòng châu Âu","summary":"Các tác giả kêu gọi thành viên châu Âu của NATO dùng thượng đỉnh Ankara để chuẩn bị cho kịch bản Mỹ giảm hậu thuẫn, bằng kế hoạch cụ thể cho phòng thủ lục địa tự chủ. Việc Mỹ cạn nguồn lực, dồn sang Trung Quốc khiến tự lực của châu Âu là tất yếu.","takeaway":"Châu Âu cần lộ trình chuyển giao gánh nặng có thời hạn rõ, tăng tốc công nghiệp quốc phòng và cải tổ hợp tác NATO-EU.","url":"https://www.csis.org/analysis/make-ankara-summit-about-european-defense-autonomy"},{"date":"2026-07-06","region":"Châu Âu/NATO","topic":"Chiến tranh Nga - Ukraine","outlet":"Institute for the Study of War (ISW)","author":"Christina Harward, Jennie Olmsted, Tetiana Trach, Anna Thacker, Karolina Hird","title":"Đánh giá chiến dịch tấn công của Nga, ngày 6/7/2026","summary":"ISW ghi nhận Nga vừa thực hiện đợt tập kích tên lửa - drone quy mô lớn thứ tư kể từ 1/6, phóng tổng cộng 419 quả nhắm chủ yếu vào Kyiv, gây hàng chục thương vong dân thường. Nga khai thác việc Ukraine cạn kho đạn đánh chặn bằng cách dồn tên lửa đạn đạo trong mỗi gói tấn công. Đợt đánh diễn ra ngay trước thượng đỉnh NATO (7-8/7) nhằm phô trương sức ép. Đáp lại, Ukraine tập kích nhà máy lọc dầu lớn nhất của Nga ở Omsk, cách biên giới hơn 2.500 km.","takeaway":"Nga leo thang tập kích chiến lược và khiêu khích NATO để tạo áp lực trước thềm thượng đỉnh, trong khi Ukraine chứng minh năng lực đánh sâu chưa từng có.","url":"https://www.understandingwar.org/backgrounder/russian-offensive-campaign-assessment-july-6-2026"},{"date":"2026-07-06","region":"Trung Đông","topic":"Hành lang thương mại - năng lượng","outlet":"Atlantic Council","author":"Allison Minor","title":"Các hành lang mới ở Trung Đông không chỉ để né eo biển Hormuz","summary":"Minor phân tích làn sóng dự án hạ tầng đường sắt, đường ống và logistics trên bộ đang nổi lên khắp Trung Đông sau những gián đoạn ở eo biển Hormuz. Saudi Arabia, UAE và Oman mở rộng mạng lưới đường sắt và trung tâm trung chuyển, trong khi Hành lang Ấn Độ - Trung Đông - châu Âu (IMEC) cần tái cấu trúc theo cách tiếp cận 'mạng lưới' thay vì một tuyến đơn lẻ. Thành công đòi hỏi tích hợp hải quan số, hài hòa quy định và cam kết chính trị bền vững, thậm chí mở ra một 'hành lang điện toán'.","takeaway":"Các hành lang này vượt xa mục tiêu né chốt chặn hàng hải, mở ra cơ hội đa dạng hóa kinh tế và hội nhập khu vực nếu có quản trị đủ mạnh.","url":"https://www.atlanticcouncil.org/blogs/menasource/new-middle-east-corridors-are-about-more-than-just-bypassing-the-strait-of-hormuz/"},{"date":"2026-07-06","region":"Đông Á","topic":"Trật tự toàn cầu - Trung Quốc","outlet":"The Diplomat","author":"","title":"Thời cơ để Trung Quốc định hình trật tự toàn cầu mới","summary":"Bài phân tích cho rằng chuyến thăm Bắc Kinh giữa tháng 5 của Tổng thống Mỹ Donald Trump đã bộc lộ một động lực mới trong quan hệ Mỹ - Trung, khi Bắc Kinh thể hiện vai trò chủ động hơn trong việc định hình quan hệ song phương. Theo tác giả, chuỗi tiếp xúc ngoại giao gần đây đưa Trung Quốc vào trung tâm sân khấu thế giới và củng cố năng lực định hình trật tự quốc tế, thay vì chỉ tuyên bố tham vọng. Bắc Kinh đang chuyển từ thế phòng thủ sang chủ động dẫn dắt chương trình nghị sự khu vực và toàn cầu.","takeaway":"Trung Quốc đang tận dụng thế chủ động ngoại giao mới để chuyển từ tuyên bố tham vọng sang thực sự định hình trật tự quốc tế.","url":"https://thediplomat.com/2026/07/chinas-moment-to-shape-a-new-global-order/"},{"date":"2026-07-03","region":"Châu Âu/NATO","topic":"Chiến lược quân Mỹ ở châu Âu","outlet":"War on the Rocks","author":"Benjamin H. Friedman & Moritz S. Graefrath","title":"Sai lầm và bị hiểu lầm: Cách tiếp cận của Trump với quân Mỹ tại châu Âu","summary":"Hai tác giả cho rằng sai lầm của chính quyền Trump không nằm ở việc dọa rút quân, mà ở chỗ không thực sự rút — thay vào đó theo đuổi 'bá quyền phi tự do', đổi sự hiện diện quân sự lấy các cam kết tăng chi tiêu mơ hồ của châu Âu.","takeaway":"Mỹ nên rút quân khỏi châu Âu theo lộ trình có kiểm soát vì mối đe dọa Nga hạn chế, thay vì mặc cả nửa vời.","url":"https://warontherocks.com/2026/07/misguided-and-misunderstood-trumps-approach-to-u-s-troops-in-europe/"},{"date":"2026-07-03","region":"Toàn cầu","topic":"Bán dẫn & vai trò dẫn dắt AI","outlet":"War on the Rocks","author":"Sarah Kreps","title":"Vi mạch tích hợp và tương lai vị thế dẫn đầu về AI","summary":"Kreps đối chiếu cách Không quân Mỹ thời Chiến tranh Lạnh đầu tư vào mạch tích hợp (integrated circuit) để rồi nó trở thành nền tảng công nghệ dân dụng, với con đường tương tự của trí tuệ nhân tạo (AI) ngày nay do khối tư nhân dẫn dắt. Bà cảnh báo mô hình này vừa tạo sức bật đổi mới vừa sinh ra lỗ hổng chiến lược khi năng lực sản xuất dịch chuyển ra nước ngoài và nhà nước mất đòn bẩy.","takeaway":"Mỹ cần duy trì quan hệ đối tác công-tư linh hoạt, bền vững qua các chu kỳ chính trị và tiếp tục bảo lãnh rủi ro công nghệ để giữ vị thế dẫn đầu AI mà không rơi vào lệ thuộc.","url":"https://warontherocks.com/cogs-of-war/the-integrated-circuit-and-the-future-of-ai-leadership/"},{"date":"2026-07-02","region":"Châu Âu/NATO","topic":"An ninh","outlet":"Atlantic Council","author":"Ian Brzezinski, Philippe Dickinson","title":"Châu Âu nên đặt cược dài hạn vào Mỹ và quan hệ an ninh xuyên Đại Tây Dương","summary":"Bất chấp căng thẳng thời 'NATO 3.0' của Trump vốn đẩy trách nhiệm quốc phòng sang châu Âu, bài viết lập luận châu Âu nên duy trì cam kết dài hạn với quan hệ xuyên Đại Tây Dương. Lý do: sự ủng hộ của công chúng và Quốc hội Mỹ dành cho NATO vẫn vững.","takeaway":"Thái độ hoài nghi của chính quyền Trump không phản ánh tâm lý chung của người Mỹ (68% ủng hộ NATO, 76% ủng hộ đáp trả quân sự khi đồng minh bị tấn công); châu Âu nên chứng minh đóng góp quốc phòng tại Ankara và tránh những bước đi thúc đẩy Mỹ rút lui không thể đảo ngược.","url":"https://www.atlanticcouncil.org/dispatches/europe-should-take-the-long-bet-on-the-us-and-the-transatlantic-security-relationship/"}],"xNews":[{"date":"2026-07-22","handle":"@ZelenskyyUa","name":"Volodymyr Zelenskyy","title":"Zelensky điện đàm với đặc phái viên Trump, thúc đẩy nối lại đàm phán hòa bình","summary":"Tổng thống Ukraine Zelensky điện đàm với đặc phái viên Mỹ Steve Witkoff và Jared Kushner, gọi đây là cuộc trao đổi 'tốt và quan trọng' về cách tái khởi động ngoại giao. Ông nhấn mạnh Ukraine từ lâu đã sẵn sàng cho một nền hòa bình 'xứng đáng'.","significance":"Dấu hiệu đầu tiên về khả năng nối lại đàm phán ba bên Kyiv-Washington-Moscow sau nhiều tháng bế tắc.","url":"https://x.com/ZelenskyyUa/status/2079977905384202283"},{"date":"2026-07-23","handle":"@mercoglianos","name":"Sal Mercogliano","title":"Houthi tấn công hai tàu chở dầu Saudi, mở mặt trận mới ở Biển Đỏ","summary":"Chuyên gia hàng hải Sal Mercogliano cho biết Houthi đã tấn công hai tàu chở dầu treo cờ Saudi là Encelia và Layla bằng tên lửa và drone, khiến tàu Encelia bốc cháy ở Biển Đỏ. Đây là cuộc tấn công tàu thương mại đầu tiên kể từ khi Houthi tuyên bố phong tỏa hàng hải nhằm vào Saudi Arabia hôm 20/7.","significance":"Vụ tấn công đe dọa mở rộng chiến sự Mỹ-Iran sang một mặt trận hàng hải mới, có nguy cơ làm gián đoạn thêm tuyến vận tải qua eo Bab el-Mandeb bên cạnh khủng hoảng Hormuz.","url":"https://x.com/mercoglianos/status/2080175394389438653"},{"date":"2026-07-22","handle":"@ZelenskyyUa","name":"Volodymyr Zelenskyy","title":"Zelensky sa thải Tổng Tư lệnh Syrskyi, bổ nhiệm Drapatyi thay thế","summary":"Sau nhiều ngày biểu tình rầm rộ khắp Ukraine, Zelensky công bố trên X việc hoàn tất quyết định thay đổi lãnh đạo Các Lực lượng Vũ trang: cách chức Tổng Tư lệnh Oleksandr Syrskyi, bổ nhiệm Thiếu tướng Mykhailo Drapatyi (chỉ huy Lực lượng Liên hợp) làm người kế nhiệm.","significance":"Xáo trộn nhân sự quân sự cấp cao nhất của Ukraine kể từ vụ cách chức Zaluzhnyi năm 2024, diễn ra chỉ một tuần sau khi Bộ trưởng Quốc phòng Fedorov bị thay, cho thấy áp lực từ biểu tình trong nước đang định hình lại bộ máy chỉ huy chiến tranh.","url":"https://x.com/ZelenskyyUa/status/2079864149241139457"},{"date":"2026-07-21","handle":"@TheStudyofWar","name":"Institute for the Study of War","title":"ISW: Iran tìm cách mở rộng xung đột sang Biển Đỏ qua đòn phong tỏa của Houthi","summary":"Báo cáo đặc biệt ngày 21/7 của ISW nhận định Iran đang thúc đẩy Houthi phong tỏa Bab el-Mandeb nhằm mở rộng phạm vi địa lý xung đột với Mỹ và gây thêm xáo trộn thị trường quốc tế. ISW cũng ghi nhận một số quan chức Iran lo ngại chiến sự kéo dài sẽ làm trầm trọng thêm khủng hoảng kinh tế và an ninh nội bộ.","significance":"Cho thấy Iran đang cố quốc tế hóa xung đột để đẩy chi phí về phía Mỹ, đồng thời hé lộ rạn nứt trong nội bộ giới lãnh đạo Tehran về cách ứng phó chiến tranh.","url":"https://x.com/TheStudyofWar/status/2079712510932848686"},{"date":"2026-07-18","handle":"@CENTCOM","name":"U.S. Central Command","title":"CENTCOM: 2 quân nhân Mỹ thiệt mạng, 1 mất tích tại Jordan sau đòn tập kích của Iran","summary":"CENTCOM xác nhận ngày 17/7, hai quân nhân Mỹ thiệt mạng và một người mất tích khi lực lượng Mỹ cùng đối tác chống đỡ đợt tấn công bằng tên lửa đạn đạo và drone của Iran nhắm vào căn cứ ở Jordan (Al-Azraq). CENTCOM cho biết sẽ không công bố danh tính cho tới 24 giờ sau khi thân nhân được thông báo.","significance":"Đây là thương vong quân nhân Mỹ đầu tiên do hỏa lực Iran kể từ khi xung đột leo thang trở lại, kéo theo Mỹ mở đợt không kích trả đũa mới — đánh dấu bước leo thang đáng kể trong cuộc chiến Mỹ-Iran.","url":"https://x.com/CENTCOM/status/2078530691109974522"},{"date":"2026-07-19","handle":"@CENTCOM","name":"U.S. Central Command","title":"CENTCOM hoàn tất đêm không kích Iran thứ 8 liên tiếp, nhắm hạ tầng quân sự sâu trong nội địa","summary":"CENTCOM thông báo hoàn tất đêm không kích thứ 8 liên tiếp nhằm vào Iran, đánh trúng các cơ sở giám sát bờ biển, phòng không, năng lực hàng hải và kho tên lửa/drone, tiếp tục làm suy yếu năng lực quân sự Iran và trừng phạt lực lượng IRGC đứng sau vụ tấn công tại Jordan ngày 17/7.","significance":"Chuỗi 8 đêm không kích liên tục cho thấy chiến dịch quân sự Mỹ nhằm vào Iran đang mở rộng cả về quy mô lẫn thời gian, không có dấu hiệu hạ nhiệt hay quay lại đàm phán ngừng bắn.","url":"https://x.com/CENTCOM/status/2078685229418483982"},{"date":"2026-07-16","handle":"@CENTCOM","name":"U.S. Central Command","title":"CENTCOM vô hiệu hóa tàu chở dầu vi phạm phong tỏa hải quân nhắm vào Iran","summary":"CENTCOM thông báo máy bay Mỹ bắn tên lửa Hellfire vào ống khói tàu chở dầu treo cờ Curacao mang tên M/T Belma khi tàu hướng tới đảo Kharg - cảng xuất dầu chính của Iran - bất chấp nhiều cảnh báo, vô hiệu hóa tàu mà không đánh chìm. Đây là tàu đầu tiên bị xử lý kể từ khi Mỹ tái áp đặt phong tỏa hải quân với Iran từ 14/7.","significance":"Bước leo thang mới - Mỹ chuyển từ cảnh báo sang hành động vũ lực trực tiếp với tàu dân sự, làm tăng rủi ro cho vận tải biển và giá dầu qua eo Hormuz.","url":"https://x.com/CENTCOM/status/2077496765553811628"},{"date":"2026-07-16","handle":"@TheStudyofWar","name":"Institute for the Study of War","title":"ISW: Mỹ lần đầu không kích mục tiêu sâu trong nội địa Iran, cách bờ biển hơn 200km","summary":"ISW dẫn truyền thông nhà nước Iran cho biết lực lượng Mỹ tấn công doanh trại Lữ đoàn Cơ giới 388 thuộc Lục quân Artesh tại Iranshahr, tỉnh Sistan-Baluchistan - mục tiêu nằm sâu trong nội địa hơn hẳn các đợt không kích trước vốn tập trung ở vùng ven biển phía nam Iran.","significance":"Phạm vi chiến dịch không kích của Mỹ mở rộng ra ngoài khu vực ven biển/Hormuz sang mục tiêu quân sự sâu trong nội địa, phản ánh mức leo thang cao hơn.","url":"https://x.com/TheStudyofWar/status/2077544526793584900"},{"date":"2026-07-15","handle":"@CENTCOM","name":"U.S. Central Command","title":"CENTCOM mở đợt không kích mới nhằm vào phòng thủ bờ biển và kho tên lửa Iran","summary":"CENTCOM thông báo hoàn tất đợt không kích sáng 15/7 (90 phút) nhắm hệ thống phòng thủ bờ biển và kho/bệ phóng tên lửa hành trình Iran trên đảo Greater Tunb; buổi chiều mở thêm đợt thứ hai nhắm năng lực quân sự Iran đang đe dọa tàu thuyền qua eo Hormuz.","significance":"Mỹ tiếp tục leo thang tấn công có chủ đích (không chỉ phong tỏa) sang ngày thứ 4-5 liên tiếp, nhắm cụ thể năng lực chống hạm/tên lửa hành trình của Iran quanh Hormuz - phù hợp cảnh báo ngừng bắn đã sụp và Trump đe dọa mở rộng mục tiêu.","url":"https://x.com/CENTCOM/status/2077359847696212197"},{"date":"2026-07-15","handle":"@defense_news","name":"Defense News","title":"Zelensky cách chức Bộ trưởng Quốc phòng Fedorov sau 6 tháng tại nhiệm","summary":"Tổng thống Ukraine Zelensky cách chức Bộ trưởng Quốc phòng Mykhailo Fedorov sau 6 tháng, ngay sau cuộc họp với lãnh đạo quân đội. Lý do: bất đồng hệ thống giữa Fedorov và Tổng Tư lệnh Syrskyi cùng việc không phối hợp mua sắm quốc phòng với Bộ Tổng tham mưu. Bộ trưởng Nội vụ Ihor Klymenko được đề xuất thay thế.","significance":"Xáo trộn lớn trong bộ máy chỉ huy quốc phòng Ukraine giữa chiến sự - phản ánh căng thẳng giữa cải cách công nghệ-hoá quân sự và giới quân sự truyền thống, có thể ảnh hưởng nhịp độ cải cách mua sắm.","url":"https://x.com/defense_news/status/2077509272296972793"},{"date":"2026-07-15","handle":"@BarakRavid","name":"Barak Ravid (Axios)","title":"Trump họp Situation Room bàn tấn công quy mô lớn hơn vào Iran","summary":"Tổng thống Trump chủ trì cuộc họp tại Situation Room hôm 14/7 cùng Phó Tổng thống Vance, Ngoại tr
