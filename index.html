ưởng Rubio, Bộ trưởng Quốc phòng Hegseth, Chủ tịch Hội đồng Tham mưu trưởng Liên quân Caine và Giám đốc CIA Ratcliffe để bàn kế hoạch tấn công Iran quy mô rộng hơn nhiều so với các đợt không kích quanh eo Hormuz, nhắm cả nhà máy điện và cầu nếu Iran không quay lại đàm phán.","significance":"Dấu hiệu Washington cân nhắc leo thang vượt phong tỏa hải quân/không kích giới hạn sang tấn công hạ tầng chiến lược Iran - bước ngoặt tiềm tàng trong xung đột Mỹ - Iran.","url":"https://x.com/BarakRavid/status/2077224198699659318"},{"date":"2026-07-14","handle":"@USTreasury","name":"Bộ Tài chính Mỹ","title":"Mỹ mở rộng trừng phạt mạng lưới vận chuyển dầu lậu của Shamkhani","summary":"OFAC (Bộ Tài chính Mỹ) trừng phạt hơn 50 cá nhân, tổ chức và tàu thuyền thuộc mạng lưới vận chuyển và né tránh trừng phạt của Mohammad Hossein Shamkhani - mắt xích chính giúp Iran xuất khẩu dầu lậu, nay mở rộng sang vận tải container và giao dịch hàng hóa toàn cầu.","significance":"Phần trong chiến dịch gây sức ép kinh tế nhắm nguồn thu dầu mỏ Iran ngay sau khi ngừng bắn sụp đổ, nâng tổng số thực thể bị trừng phạt liên quan Shamkhani lên hơn 200 - Washington kết hợp đòn kinh tế song song chiến dịch quân sự.","url":"https://x.com/USTreasury/status/2077125017783943671"},{"date":"2026-07-13","handle":"@CENTCOM","name":"U.S. Central Command","title":"CENTCOM tái áp đặt phong tỏa hải quân với Iran, hiệu lực từ 14/7","summary":"CENTCOM thông báo theo chỉ đạo của Tổng thống, lực lượng Mỹ tái phong tỏa tàu thuyền ra vào cảng Iran từ chiều 14/7 (giờ Mỹ), sau khi lệnh ngừng bắn Mỹ-Iran (tháng 6) đổ vỡ và giao tranh tái diễn tại eo Hormuz. Phong tỏa áp dụng với mọi tàu ra/vào cảng, kho dầu và vùng biển Iran; tàu không tuân thủ có thể bị chặn, chuyển hướng hoặc cưỡng chế.","significance":"Đảo ngược trạng thái 'Hormuz mở' ngày 12/7 — đánh dấu chấm dứt thỏa thuận ngừng bắn 60 ngày và nguy cơ leo thang toàn diện trở lại vùng Vịnh, tác động trực tiếp giá dầu và vận tải biển toàn cầu.","url":"https://x.com/CENTCOM/status/2076732825349628250"},{"date":"2026-07-13","handle":"@TheStudyofWar","name":"Institute for the Study of War","title":"ISW: Ngừng bắn Mỹ-Iran về bản chất đã chấm dứt","summary":"Trong Iran Update ngày 13/7, ISW đánh giá lệnh ngừng bắn Mỹ-Iran đã 'về bản chất chấm dứt' với các đợt giao tranh dồn dập hơn tại vùng Vịnh, dù quy mô còn nhỏ hơn đợt tháng 3-4/2026; việc tái áp đặt phong tỏa và tăng không kích đánh dấu bước sang giai đoạn mới của xung đột.","significance":"Nhận định tầng 3 xác nhận xu hướng leo thang mà tuyên bố CENTCOM phản ánh, cảnh báo nguy cơ quay lại chiến sự toàn diện Mỹ-Iran thay vì căng thẳng cục bộ tạm thời.","url":"https://x.com/TheStudyofWar/status/2076846265736802511"},{"date":"2026-07-13","handle":"@ZelenskyyUa","name":"Volodymyr Zelenskyy","title":"Zelensky trình bày Chương trình Phòng thủ Chống tên lửa đạn đạo tại Paris","summary":"Bên lề hội nghị Liên minh Tự nguyện (Coalition of the Willing) và cuộc họp đầu tiên của liên minh phòng thủ chống tên lửa đạn đạo tại Paris, Tổng thống Zelensky cho biết sẽ trình bày với các đối tác Chương trình Phòng thủ Chống tên lửa đạn đạo của Ukraine, ưu tiên hàng đầu hiện nay nhằm tăng cường năng lực phòng không.","significance":"Cho thấy Ukraine thúc đẩy một khuôn khổ hợp tác phòng thủ chống tên lửa đạn đạo mới bên lề hội nghị nhiều nguyên thủ tại Paris, tiếp nối cam kết 70 tỷ euro viện trợ quân sự tại Thượng đỉnh NATO Ankara.","url":"https://x.com/ZelenskyyUa/status/2076634937990562023"},{"date":"2026-07-12","handle":"@CENTCOM","name":"U.S. Central Command","title":"CENTCOM khẳng định eo biển Hormuz vẫn mở cho tàu bè qua lại","summary":"CENTCOM ra tuyên bố trên X bác bỏ tuyên bố của IRGC rằng Iran kiểm soát eo biển Hormuz, khẳng định tuyến hàng hải quốc tế này vẫn mở cho mọi tàu di chuyển hợp pháp và lực lượng Mỹ đã sẵn sàng bảo đảm tự do hàng hải bất chấp các đe dọa từ Iran.","significance":"Cho thấy Washington ưu tiên trấn an các hãng vận tải/bảo hiểm về rủi ro chiến sự leo thang ở Hormuz.","url":"https://x.com/CENTCOM/status/2076278945993888116"},{"date":"2026-07-11","handle":"@ZelenskyyUa","name":"Volodymyr Zelenskyy","title":"Zelensky công bố cải tổ ngoại giao để đẩy nhanh giao vũ khí từ đồng minh","summary":"Tổng thống Zelensky thông báo chuẩn bị thay đổi lớn trong bộ máy ngoại giao, phân công người phụ trách cụ thể cho từng hướng chính sách đối ngoại nhằm bảo đảm các thỏa thuận cấp lãnh đạo về cung cấp vũ khí được thực thi nhanh và đầy đủ hơn, ngay sau thượng đỉnh NATO Ankara.","significance":"Phản ánh sức ép từ Kyiv buộc đồng minh hiện thực hóa cam kết vũ khí giữa lúc kho Patriot cạn kiệt.","url":"https://x.com/ZelenskyyUa/status/2076264578229391430"},{"date":"2026-07-10","handle":"@IEA","name":"International Energy Agency","title":"IEA cảnh báo bất ổn thị trường dầu vì căng thẳng Hormuz tái bùng phát","summary":"IEA cho biết dòng chảy dầu qua eo biển Hormuz đã tăng mạnh sau lệnh ngừng bắn tạm thời hồi tháng 6, nhưng các hành động thù địch tái diễn trong tuần này làm gia tăng đáng kể sự bất định cho triển vọng thị trường dầu mỏ toàn cầu, theo Oil Market Report mới nhất.","significance":"Đánh giá của cơ quan năng lượng hàng đầu cho thấy khủng hoảng Hormuz tác động trực tiếp tới an ninh năng lượng toàn cầu.","url":"https://x.com/IEA/status/2075490712309686501"},{"date":"2026-07-10","handle":"@ZelenskyyUa","name":"Volodymyr Zelenskyy","title":"Zelensky lập bộ chỉ huy mới cho tấn công tầm xa, tuyên bố đã đánh trúng mọi nhà máy lọc dầu lớn của Nga","summary":"Tổng thống Zelensky thông báo ký sắc lệnh thành lập một bộ chỉ huy chuyên trách trong quân đội Ukraine phụ trách các đòn tấn công tầm xa vào Nga. Ông cho biết Ukraine giờ đã đánh trúng toàn bộ các nhà máy lọc dầu lớn nhất của Nga.","significance":"Đánh dấu bước thể chế hóa chiến dịch tấn công tầm xa của Ukraine thay vì các đợt tập kích rời rạc.","url":"https://x.com/ZelenskyyUa/status/2075668189778674113"},{"date":"2026-07-10","handle":"@TheStudyofWar","name":"Institute for the Study of War","title":"ISW: Mỹ áp thêm trừng phạt Iran khi hai bên chuẩn bị nối lại đàm phán, lập trường Iran không đổi","summary":"Báo cáo của ISW ngày 10/7 cho biết Mỹ và Iran chuẩn bị nối lại đàm phán sau các đợt không kích 8-9/7, nhưng mục tiêu của Iran (kiểm soát Hormuz, giữ chương trình hạt nhân, bảo vệ Hezbollah) không đổi. Cùng ngày Mỹ áp thêm trừng phạt lên 8 cá nhân và 6 thực thể liên quan tài chính Iran.","significance":"Cho thấy đàm phán tái khởi động không đồng nghĩa nhượng bộ thực chất từ phía Iran.","url":"https://x.com/TheStudyofWar/status/2075718254853607591"},{"date":"2026-07-08","handle":"@ZelenskyyUa","name":"Volodymyr Zelenskyy","title":"Zelensky gặp Thủ tướng Ý Meloni giữa lúc Nga tiếp tục tấn công","summary":"Tổng thống Ukraine Volodymyr Zelensky cho biết đã có cuộc gặp quan trọng với Thủ tướng Ý Giorgia Meloni để thông báo tình hình Ukraine, trong ngày Nga tiếp tục phóng tên lửa đạn đạo và drone tấn công các thành phố. Ông bày tỏ tiếc thương về thương vong dân thường từ các đợt tấn công mới nhất.","significance":"Cho thấy Ukraine tiếp tục vận động ngoại giao với đồng minh châu Âu để duy trì hỗ trợ phòng không giữa lúc Nga leo thang tấn công.","url":"https://x.com/ZelenskyyUa/status/2074771617750622453"},{"date":"2026-07-09","handle":"@KyivIndependent","name":"The Kyiv Independent","title":"Ước tính tổn thất quân sự của Nga tính đến 09/07/2026","summary":"Theo Lực lượng Vũ trang Ukraine, Nga đã chịu khoảng 1.414.820 binh sĩ tổn thất kể từ khi bắt đầu cuộc xâm lược toàn diện ngày 24/2/2022 đến 09/07/2026, tăng thêm 1.310 người trong 24 giờ qua.","significance":"Con số tổn thất lớn cho thấy chi phí cao của cuộc xâm lược đối với Nga và khả năng phòng vệ bền bỉ của Ukraine.","url":"https://x.com/KyivIndependent/status/2075115022594830821"},{"date":"2026-07-08","handle":"@CENTCOM","name":"U.S. Central Command","title":"CENTCOM tuyên bố mở loạt đòn tấn công mạnh nhằm vào Iran để đáp trả các vụ tấn công tàu hàng ở Hormuz","summary":"Bộ Tư lệnh Trung tâm Mỹ thông báo bắt đầu loạt không kích nhằm vào Iran để \"áp đặt cái giá đắt\" cho việc Tehran nhắm vào tàu thương mại chở thủy thủ dân sự ở tuyến hàng hải quốc tế.","significance":"Tuyên bố chính thức của quân đội Mỹ xác nhận Washington chuyển từ răn đe sang hành động quân sự trực tiếp, đặt dấu chấm hết cho lệnh ngừng bắn.","url":"https://x.com/CENTCOM/status/2074603238175998290"},{"date":"2026-07-08","handle":"@Breaking911","name":"Breaking911","title":"CENTCOM tập kích khoảng 90 địa điểm quân sự Iran ngày 8/7","summary":"Đợt tấn công mới nhằm vào phòng không, giám sát bờ biển, kho tên lửa/UAV và hạ tầng hậu cần, tiếp nối đợt đánh khoảng 80 mục tiêu (gồm hơn 60 xuồng cao tốc IRGC) hôm trước.","significance":"Quy mô và loại mục tiêu cho thấy Mỹ tìm cách vô hiệu hóa năng lực đe dọa hàng hải của Iran ở Hormuz thay vì chỉ trả đũa tượng trưng.","url":"https://x.com/Breaking911/status/2075069861936422962"},{"date":"2026-07-08","handle":"@BarakRavid","name":"Barak Ravid (Axios)","title":"Mỹ lần đầu tập kích hạ tầng bên trong Iran kể từ ngừng bắn 8/4, bắn tên lửa hành trình vào 2 cầu đường sắt","summary":"Theo quan chức Mỹ, quân đội nước này đã tấn công hai cầu đường sắt ở miền bắc Iran bằng tên lửa hành trình trong đợt đánh ngày thứ Tư — lần đầu nhắm hạ tầng Iran kể từ ngừng bắn.","significance":"Mở rộng mục tiêu sang hạ tầng dân - quân sự cho thấy leo thang vượt khỏi phạm vi \"tự vệ hàng hải\", làm tăng nguy cơ chiến tranh toàn diện.","url":"https://x.com/BarakRavid/status/2075011509323796967"},{"date":"2026-07-08","handle":"@MarioNawfal","name":"Mario Nawfal","title":"Cảnh Bandar Abbas cho thấy đợt tập kích nặng nhất kể từ ngừng bắn, Iran có thể đóng eo biển","summary":"Hình ảnh mới từ cảng Bandar Abbas cho thấy mức thiệt hại được cho là nặng nhất kể từ khi thỏa thuận ngừng bắn ban đầu được ký, giữa lo ngại Iran đóng hoàn toàn eo biển Hormuz.","significance":"Nếu Iran đóng Hormuz — nơi trung chuyển khoảng 1/5 dầu thế giới — cú sốc giá dầu và vận tải biển toàn cầu sẽ rất lớn.","url":"https://x.com/MarioNawfal/status/2074615677764202845"},{"date":"2026-07-08","handle":"@straits_times","name":"The Straits Times","title":"Trump quay sang chỉ trích Tây Ban Nha và đòi Greenland, phơi bày rạn nứt NATO","summary":"Tại thượng đỉnh NATO, Trump công kích Tây Ban Nha vì chi tiêu quốc phòng thấp và tái nêu yêu sách Greenland, khiến hội nghị bộc lộ chia rẽ nội bộ.","significance":"Cho thấy mâu thuẫn Mỹ - đồng minh về chia sẻ gánh nặng và chủ quyền lãnh thổ đang thử thách sự gắn kết của liên minh.","url":"https://x.com/straits_times/status/2074824111709175894"},{"date":"2026-07-08","handle":"@SkyNews","name":"Sky News","title":"Trump nêu lại yêu sách Greenland, dọa rút quân khỏi châu Âu tại thượng đỉnh NATO","summary":"Tổng thống Trump tái khẳng định đòi hỏi với Greenland và dọa rút quân Mỹ khỏi châu Âu ngay tại hội nghị NATO ở Thổ Nhĩ Kỳ, trong khi Ukraine tiếp tục vận động gia nhập liên minh.","significance":"Đe dọa rút quân là quân bài gây sức ép mạnh, buộc châu Âu tính đến kịch bản tự lo an ninh.","url":"https://x.com/SkyNews/status/2074614570178498894"},{"date":"2026-07-08","handle":"@NATO","name":"NATO","title":"NATO công bố Tuyên bố thượng đỉnh Ankara","summary":"Các nguyên thủ và người đứng đầu chính phủ NATO ban hành Tuyên bố thượng đỉnh Ankara, ghi nhận các cam kết về chi tiêu quốc phòng và lập trường chung của liên minh.","significance":"Văn kiện chính thức phản ánh mẫu số chung đạt được bất chấp căng thẳng, là thước đo mức độ đoàn kết thực chất của khối.","url":"https://x.com/NATO/status/2074834022019014926"},{"date":"2026-07-08","handle":"@Defence_IDA","name":"International Defence Analysis","title":"Trung Quốc phô diễn tên lửa siêu vượt âm DF-17 trên truyền thông nhà nước giữa lúc RIMPAC diễn ra","summary":"Trung Quốc trưng ra tên lửa siêu vượt âm DF-17 (tầm 1.800–2.500 km, đầu đạn lượn cơ động) trên truyền thông nhà nước, được xem là tín hiệu răn đe giữa lúc tập trận RIMPAC diễn ra.","significance":"Phô trương khí tài đúng thời điểm RIMPAC là đòn tâm lý - chiến lược nhắm cảnh báo Mỹ và đồng minh về năng lực xuyên thủng lá chắn tên lửa.","url":"https://x.com/Defence_IDA/status/2074829888423645586"},{"date":"2026-07-08","handle":"@WarMonitor3","name":"WarMonitor","title":"Video UAV hải quân Ukraine đánh trúng tàu chở dầu lớn của Nga trên Hắc Hải","summary":"Đoạn video cho thấy một xuồng không người lái của Ukraine lao vào một tàu chở dầu cỡ lớn của Nga trên Hắc Hải giữa lúc thủy thủ đoàn bắn xối xả để ngăn chặn.","significance":"Minh chứng cho hiệu quả của drone hải quân giá rẻ trong việc đe dọa tàu lớn, làm thay đổi thế trận trên Hắc Hải. (Nguồn OSINT, cần đối chiếu thêm.)","url":"https://x.com/WarMonitor3/status/2074871209200689585"},{"date":"2026-07-08","handle":"@EU_ISS","name":"EU Institute for Security Studies","title":"Phân tích: Tổng thống Erdogan nổi lên là bên hưởng lợi chính trị lớn nhất từ thượng đỉnh NATO tại Ankara.","url":"https://x.com/EU_ISS/status/2074778368210268419","summary":"Giới phân tích cho rằng việc đăng cai thượng đỉnh NATO tại Ankara giúp Tổng thống Erdogan củng cố vị thế cả trong nước lẫn trên trường quốc tế.","significance":"Phản ánh cách nước chủ nhà tận dụng sự kiện đa phương cho lợi ích chính trị; cho thấy Thổ Nhĩ Kỳ đang nâng vai trò cầu nối trong NATO."},{"date":"2026-07-08","handle":"@Reuters","name":"Reuters","title":"Reuters: 'Ủy ban Hòa bình' do Mỹ dẫn dắt lên kế hoạch lập vùng nhân đạo thí điểm ở Gaza.","url":"https://x.com/Reuters/status/2074932816211591392","summary":"Reuters đưa tin một \"Ủy ban Hòa bình\" do Mỹ dẫn dắt lên kế hoạch lập vùng nhân đạo thí điểm tại Gaza.","significance":"Phản ánh nỗ lực Mỹ định hình giai đoạn hậu xung đột ở Gaza; xu hướng quản trị vùng lãnh thổ bằng cơ chế do bên ngoài dẫn dắt, tiềm ẩn tranh cãi chủ quyền."},{"date":"2026-07-07","handle":"@AndrewSErickson","name":"Andrew S. Erickson","title":"Vụ phóng SLBM 6/7 vào Nam TBD là lần đầu Trung Quốc công khai kể từ 1982","summary":"Chuyên gia hải quân Andrew Erickson nhận định vụ phóng ngày 6/7 vào vùng phi hạt nhân Nam Thái Bình Dương dường như là chuyến bay SLBM tầm xa ra Thái Bình Dương đầu tiên PLAN công khai thừa nhận kể từ vụ phóng JL-1 năm 1982.","significance":"Khoảng cách 44 năm cho thấy đây là cột mốc lịch sử trong tiến trình hoàn thiện bộ ba răn đe hạt nhân trên biển của Trung Quốc.","url":"https://x.com/AndrewSErickson/status/2074315675036721291"},{"date":"2026-07-07","handle":"@aadilbrar","name":"Aadil Brar","title":"Bằng chứng nghiêng về khả năng tên lửa Trung Quốc thử là JL-3","summary":"Nhà báo Aadil Brar phân tích hình ảnh do truyền thông nhà nước và PLA công bố, cho rằng tên lửa được thử nhiều khả năng là JL-3 dù giới phân tích quốc tế ban đầu còn chia rẽ giữa JL-2 và JL-3.","significance":"Xác định đúng loại tên lửa quan trọng để đánh giá tầm bắn và khả năng vươn tới lục địa Mỹ của lực lượng tàu ngầm hạt nhân Trung Quốc.","url":"https://x.com/aadilbrar/status/2074342035096768672"},{"date":"2026-07-07","handle":"@CBSNews","name":"CBS News","title":"Trung Quốc phóng thử tên lửa đạn đạo tầm xa từ tàu ngầm ở Nam TBD, khu vực phản đối","summary":"CBS News đưa tin quân đội Trung Quốc phóng thử một tên lửa đạn đạo tầm xa từ tàu ngầm hạt nhân ở Nam Thái Bình Dương, gây phản đối và quan ngại từ các nước trong khu vực.","significance":"Phản ứng của các quốc đảo Thái Bình Dương cho thấy vụ thử đụng chạm tới cam kết phi hạt nhân hóa khu vực và làm nóng cạnh tranh chiến lược.","url":"https://x.com/CBSNews/status/2074085955816804743"},{"date":"2026-07-07","handle":"@KyivIndependent","name":"The Kyiv Independent","title":"Cơ quan thực thi pháp luật Ukraine khám xét hãng drone hàng đầu Vyriy Industries, làm dấy lên lo ngại siết chặt ngành công nghệ quốc phòng.","url":"https://x.com/KyivIndependent/status/2074623512027832799","summary":"Cơ quan thực thi pháp luật Ukraine khám xét Vyriy Industries, một nhà sản xuất drone hàng đầu, gây lo ngại trong ngành.","significance":"Cho thấy căng thẳng giữa nhu cầu giám sát và việc bảo vệ ngành công nghệ quốc phòng non trẻ; rủi ro làm nản lòng doanh nghiệp quốc phòng thời chiến."},{"date":"2026-07-07","handle":"@ZelenskyyUa","name":"Volodymyr Zelenskyy","title":"Zelensky ký thỏa thuận hợp tác sản xuất drone với Đan Mạch — thỏa thuận thứ chín thuộc mô hình liên kết quốc phòng của Ukraine.","url":"https://x.com/ZelenskyyUa/status/2074543396996161846","summary":"Tổng thống Zelensky ký thỏa thuận sản xuất drone chung với Đan Mạch — thỏa thuận thứ chín theo mô hình liên kết quốc phòng của Ukraine.","significance":"Phản ánh chiến lược Ukraine \"nội địa hóa + hợp tác\" để tự chủ vũ khí; xu hướng châu Âu gắn công nghiệp quốc phòng với Kyiv thay cho viện trợ đơn thuần."},{"date":"2026-07-07","handle":"@TheStudyofWar","name":"Institute for the Study of War","title":"ISW: Iran tìm cách cản trở nỗ lực của phương Tây và vùng Vịnh nhằm mở lại eo biển Hormuz.","url":"https://x.com/TheStudyofWar/status/2074608031799652776","summary":"ISW đánh giá Iran đang tìm cách cản trở nỗ lực của phương Tây và vùng Vịnh nhằm mở lại eo biển Hormuz cho tàu bè.","significance":"Cho thấy Hormuz là đòn bẩy chiến lược của Iran; phản ánh nguy cơ gián đoạn nguồn cung dầu và leo thang xung đột hàng hải."},{"date":"2026-07-07","handle":"@MarketWatch","name":"MarketWatch","title":"Giá dầu thô tăng khi Mỹ mở các đợt không kích nhằm vào Iran.","url":"https://x.com/MarketWatch/status/2074618951120584923","summary":"Giá dầu thô đi lên sau khi Mỹ mở các đợt không kích nhằm vào Iran.","significance":"Phản ánh mức độ nhạy cảm của thị trường năng lượng với xung đột Trung Đông; xu hướng rủi ro địa chính trị định giá dầu mạnh hơn cung–cầu."},{"date":"2026-07-07","handle":"@Rory_Johnston","name":"Rory Johnston","title":"Mỹ thu hồi quyền miễn trừ trừng phạt dầu mỏ với Iran sau loạt vụ tấn công tàu chở dầu ở Hormuz.","url":"https://x.com/Rory_Johnston/status/2074568070908002448","summary":"Mỹ thu hồi các quyền miễn trừ trừng phạt dầu mỏ đối với Iran sau loạt vụ tấn công tàu chở dầu ở Hormuz.","significance":"Cho thấy Washington siết tối đa sức ép kinh tế lên Tehran; phản ánh việc dùng trừng phạt dầu mỏ như vũ khí trong đối đầu leo thang."},{"date":"2026-07-07","handle":"@KyivIndependent","name":"The Kyiv Independent","title":"Ước tính tổn thất chiến đấu của Nga tính đến ngày 7/7 theo số liệu của Lực lượng Vũ trang Ukraine.","url":"https://x.com/KyivIndependent/status/2074386662059024384","summary":"Bộ Tổng tham mưu Ukraine công bố ước tính tổn thất chiến đấu của Nga tính đến ngày 7/7.","significance":"Là số liệu một chiều cần thận trọng, nhưng phản ánh cường độ tiêu hao khốc liệt của cuộc chiến; công cụ tuyên truyền–tâm lý của cả hai bên."},{"date":"2026-07-07","handle":"@AJEnglish","name":"Al Jazeera English","title":"Hamas tuyên bố giải thể bộ máy dân sự cầm quyền ở Gaza sau gần 20 năm điều hành.","url":"https://x.com/AJEnglish/status/2074337860874912044","summary":"Hamas tuyên bố giải thể bộ máy hành chính cầm quyền ở Gaza sau gần 20 năm điều hành.","significance":"Bước ngoặt có thể mở đường cho một cơ chế quản trị mới ở Gaza; phản ánh sức ép buộc Hamas nhượng bộ và cục diện hậu chiến đang định hình."},{"date":"2026-07-07","handle":"@ZelenskyyUa","name":"Volodymyr Zelenskyy","title":"Zelensky nêu ưu tiên tại thượng đỉnh NATO Ankara: có thêm phòng không và củng cố vị thế ngoại giao cho Ukraine.","url":"https://x.com/ZelenskyyUa/status/2074565135969009718","summary":"Tổng thống Zelensky nêu ưu tiên tại thượng đỉnh NATO Ankara: bổ sung phòng không và củng cố vị thế ngoại giao cho Ukraine.","significance":"Phản ánh nhu cầu cấp bách của Kyiv trước các đợt tập kích của Nga; cho thấy Ukraine tận dụng diễn đàn NATO để giữ hậu thuẫn phương Tây."},{"date":"2026-07-07","handle":"@usf_army","name":"Ukraine Unmanned Systems Forces","title":"Đêm 6/7, lực lượng Ukraine tập kích 47 mục tiêu hậu phương Nga: phá 2 bệ phóng S-400, 2 tàu chở dầu 'hạm đội bóng tối' ở Biển Azov, đánh kho dầu Kerch.","url":"https://x.com/usf_army/status/2074099025750479261","summary":"Lực lượng Ukraine tập kích 47 mục tiêu hậu phương Nga trong đêm 6/7: phá 2 bệ phóng S-400, đánh 2 tàu chở dầu \"hạm đội bóng tối\" ở Biển Azov và kho dầu Kerch.","significance":"Cho thấy Ukraine đánh sâu và có chọn lọc vào phòng không, năng lượng và đội tàu lách trừng phạt của Nga; phản ánh chiến lược làm suy yếu đồng thời sức mạnh quân sự lẫn nguồn thu dầu của Moscow."},{"date":"2026-07-06","handle":"@TheStudyofWar","name":"Institute for the Study of War","title":"Nga tiến hành đợt tập kích tên lửa - UAV lớn thứ tư nhằm vào Ukraine kể từ 1/6","summary":"ISW cho biết Nga phóng đợt tập kích tên lửa và UAV quy mô lớn thứ tư kể từ ngày 1/6 trong đêm 5 rạng 6/7, tiếp tục nhắm nặng vào Kyiv và gây hàng chục thương vong dân sự.","significance":"Tần suất tập kích dày cho thấy Nga duy trì chiến dịch tiêu hao phòng không và ý chí Ukraine, làm tăng nhu cầu đạn Patriot của Kyiv.","url":"https://x.com/TheStudyofWar/status/2074262425554067757"},{"date":"2026-07-06","handle":"@Saveraaintl","name":"Saveraa International","title":"Giá đậu tương tăng vọt do thời tiết Mỹ nóng khô và tin Trung Quốc mua vào","summary":"Hợp đồng tương lai đậu tương tăng mạnh khi dự báo thời tiết Mỹ nóng và khô hơn trong 8–14 ngày tới làm dấy lo ngại về năng suất, cùng tin đồn Trung Quốc đấu thầu mua đậu tương và ngô Mỹ.","significance":"Diễn biến giá nông sản phản ánh cả yếu tố thời tiết lẫn tín hiệu tan băng thương mại Mỹ - Trung, tác động tới lạm phát lương thực toàn cầu.","url":"https://x.com/Saveraaintl/status/2074315464281612428"},{"date":"2026-07-06","handle":"@ShanghaiEye","name":"ShanghaiEye","title":"Trung Quốc và Nga khởi động tập trận \"Joint Sea-2026\" tại Thanh Đảo","summary":"Trung Quốc và Nga chính thức khởi động cuộc tập trận hải quân chung \"Joint Sea-2026\" tại một quân cảng ở Thanh Đảo, tỉnh Sơn Đông, miền đông Trung Quốc.","significance":"Tập trận chung định kỳ củng cố \"quan hệ đối tác chiến lược toàn diện\" Trung - Nga và phát tín hiệu răn đe với Mỹ cùng đồng minh ở Tây TBD. (Tài khoản gắn với truyền thông TQ, chỉ dùng làm đầu mối.)","url":"https://x.com/ShanghaiEye/status/2074256079043924148"},{"date":"2026-07-06","handle":"@WarshipCam","name":"WarshipCam","title":"Tuần dương hạm Varyag (lớp Slava) của Nga xuất hiện tại Thanh Đảo","summary":"Ảnh chụp ngày 6/7 cho thấy tuần dương hạm mang tên lửa dẫn đường Varyag (Project 1164 lớp Slava) của Hải quân Nga có mặt tại Thanh Đảo, Trung Quốc, tham gia Joint Sea-2026.","significance":"Việc Nga điều soái hạm Hạm đội Thái Bình Dương tới cho thấy mức độ coi trọng cuộc tập trận và độ sâu hợp tác hải quân Trung - Nga. (Nguồn OSINT.)","url":"https://x.com/WarshipCam/status/2074680188416274448"},{"date":"2026-07-06","handle":"@NewsHour","name":"PBS NewsHour","title":"Tổng thư ký NATO Rutte yêu cầu các thành viên đưa ra kế hoạch 'rõ ràng, cụ thể, khả tín' để đạt mục tiêu chi tiêu quốc phòng.","url":"https://x.com/NewsHour/status/2074278726158672130","summary":"Tổng thư ký NATO Mark Rutte yêu cầu các thành viên trình kế hoạch \"rõ ràng, cụ thể, khả tín\" để đạt mục tiêu chi tiêu quốc phòng.","significance":"Phản ánh sức ép nội khối buộc các nước hiện thực hóa cam kết tăng chi; xu hướng NATO chuyển từ mục tiêu con số sang lộ trình thực thi."},{"date":"2026-07-06","handle":"@Reuters","name":"Reuters","title":"Reuters: Iran bắn tên lửa vào các tàu hàng thương mại tại eo biển Hormuz.","url":"https://x.com/Reuters/status/2074317554584031253","summary":"Reuters đưa tin Iran bắn tên lửa vào các tàu hàng thương mại tại eo biển Hormuz.","significance":"Cho thấy nguy cơ hiện hữu với tuyến vận tải dầu huyết mạch; phản ánh việc Iran sẵn sàng dùng đòn hàng hải để đáp trả sức ép của Mỹ."},{"date":"2026-07-06","handle":"@amnestyusa","name":"Amnesty International USA","title":"Ân xá Quốc tế: Sudan là cuộc khủng hoảng di tản tồi tệ nhất thế giới với hơn 10,5 triệu người phải rời bỏ nhà cửa.","url":"https://x.com/amnestyusa/status/2074142099021160926","summary":"Ân xá Quốc tế cảnh báo Sudan là cuộc khủng hoảng di tản tồi tệ nhất thế giới với hơn 10,5 triệu người phải rời bỏ nhà cửa.","significance":"Phản ánh quy mô thảm họa nhân đạo bị thế giới lãng quên; cho thấy khoảng trống chú ý và cứu trợ quốc tế giữa các điểm nóng cạnh tranh."},{"date":"2026-07-06","handle":"@ZelenskyyUa","name":"Volodymyr Zelenskyy","title":"Zelensky cho biết Nga tập kích Kyiv bằng 68 tên lửa và 351 drone trong đêm, gây thiệt hại tại hơn 10 địa điểm.","url":"https://x.com/ZelenskyyUa/status/2074026731581624489","summary":"Tổng thống Zelensky cho biết Nga tập kích Kyiv bằng 68 tên lửa và 351 drone trong đêm, gây thiệt hại tại hơn 10 địa điểm.","significance":"Cho thấy Nga duy trì chiến thuật tập kích bão hòa nhằm bào mòn phòng không Ukraine; phản ánh cuộc đua tiêu hao giữa số lượng đạn tấn công và năng lực đánh chặn."},{"date":"2026-07-06","handle":"@thewarzonewire","name":"The War Zone","title":"Cấu hình vũ khí mới trên tiêm kích Su-57 của Nga hé lộ nhiệm vụ phòng thủ chống drone và tên lửa hành trình.","url":"https://x.com/thewarzonewire/status/2072395726030524917","summary":"Cấu hình vũ khí mới trên tiêm kích tàng hình Su-57 của Nga hé lộ vai trò phòng thủ chống drone và tên lửa hành trình.","significance":"Phản ánh việc drone giá rẻ đang buộc cả tiêm kích đắt tiền phải thích ứng; xu hướng tái định nghĩa nhiệm vụ không quân trong chiến tranh drone."},{"date":"2026-07-06","handle":"@ReutersLegal","name":"Reuters Legal","title":"22 tổng chưởng lý bang thuộc phe Dân chủ phản đối kế hoạch áp thuế tới 12,5% của chính quyền Trump lên 59 nước và EU.","url":"https://x.com/ReutersLegal/status/2074264698564857881","summary":"22 tổng chưởng lý bang thuộc phe Dân chủ phản đối kế hoạch áp thuế tới 12,5% của chính quyền Trump lên 59 nước và EU.","significance":"Phản ánh mặt trận pháp lý–chính trị trong nước chống chính sách thuế quan; cho thấy thương chiến của Trump gây chia rẽ ngay trong lòng nước Mỹ."}],"xGeneratedAt":"2026-07-23","exercises":[{"name":"Pitch Black 2026 (Úc chủ trì, 20 nước tham gia)","status":"ongoing","dates":"20/7 – 7/8/2026","location":"Căn cứ Không quân Hoàng gia Úc (RAAF) Darwin và Tindal (Lãnh thổ Bắc Úc), RAAF Amberley (Queensland)","scale":"Khoảng 100 máy bay chiến đấu, hơn 2.500 quân nhân từ 20 quốc gia","summary":"Pitch Black là diễn tập không chiến lớn nhất Nam bán cầu do Không quân Hoàng gia Úc chủ trì hai năm một lần, mô phỏng chiến tranh trên không cường độ cao. Lần đầu tiên có sự tham gia của tiêm kích F-35 Nhật Bản và T-50i Indonesia, cùng Mỹ, Hàn Quốc, Ấn Độ, Đức, Pháp, Tây Ban Nha và nhiều nước khác.","items":[{"date":"2026-07-16","title":"Exercise Pitch Black 2026 takes to the skies","summary":"Bộ Quốc phòng Úc thông báo Pitch Black 2026 chính thức bắt đầu các hoạt động bay, quy tụ 20 nước và khoảng 100 máy bay tại Darwin, Tindal và Amberley.","sourceName":"Bộ Quốc phòng Úc (Defence.gov.au)","sourceUrl":"https://www.defence.gov.au/news-events/releases/2026-07-16/exercise-pitch-black-2026-takes-skies"}],"background":"Pitch Black là diễn tập không chiến lớn nhất của Không quân Hoàng gia Úc (RAAF), tổ chức hai năm một lần tại Darwin, Tindal và Amberley từ năm 1983, diễn ra 20/7-7/8/2026 với khoảng 100 máy bay chiến đấu và hơn 2.500 quân nhân.\nNăm 2026 có sự góp mặt của 20 quốc gia gồm Mỹ, Nhật Bản, Papua New Guinea, Indonesia, Philippines, Thái Lan, Hàn Quốc, Ấn Độ, Singapore, Đức, Pháp, Tây Ban Nha cùng lực lượng cắm chốt từ New Zealand, Fiji, Canada, Brunei, Malaysia, Phần Lan và Thụy Điển - lần đầu tiên tiêm kích F-35 của Nhật và T-50I của Indonesia tham gia.\nDiễn tập diễn ra trong bối cảnh căng thẳng Ấn Độ Dương-Thái Bình Dương gia tăng, nhằm nâng cao khả năng phối hợp tác chiến giữa không quân Úc với các đối tác khu vực và toàn cầu trong các kịch bản không chiến phức tạp.","concepts":[{"term":"Large Force Employment (LFE)","def":"Kịch bản huấn luyện triển khai đồng thời số lượng lớn máy bay nhiều loại để mô phỏng không chiến quy mô lớn."},{"term":"Khả năng phối hợp tác chiến (Interoperability)","def":"Năng lực các lực lượng từ nhiều quốc gia khác nhau vận hành, chỉ huy và tác chiến ăn khớp với nhau."},{"term":"Bắc Úc (Top End)","def":"Vùng lãnh thổ phía bắc Úc quanh Darwin, có vị trí chiến lược gần Biển Đông và Đông Nam Á, thường dùng làm nơi luân chuyển lực lượng Mỹ-Úc."},{"term":"Lực lượng đối kháng (OPFOR)","def":"Đội quân đóng vai đối phương giả định trong diễn tập để bên phòng thủ luyện phản ứng thực chiến."},{"term":"Diễn tập hai năm một lần (biennial exercise)","def":"Loại hình diễn tập tổ chức định kỳ hai năm một lần, giúp duy trì quan hệ đối tác quân sự lâu dài."}]},{"name":"Sea Breeze 26-2 (NATO, Ukraine, Anh chủ trì)","status":"recent","dates":"13 – 24/7/2026 (giai đoạn 2; giai đoạn 1 diễn ra tại Romania 3–19/6/2026)","location":"Cảng Portland, Anh (kèm hoạt động lặn/trục vớt phối hợp tại Latvia)","scale":"Hơn 2.000 quân nhân, hải quân từ khoảng 15 nước gồm Anh, Mỹ, Ukraine, Pháp, Thổ Nhĩ Kỳ, Nhật Bản, Ba Lan, các nước Baltic...","summary":"Sea Breeze là diễn tập hải quân đa quốc gia thường niên do Mỹ và Ukraine đồng chủ trì, giai đoạn 2/2026 do Hải quân Hoàng gia Anh đăng cai tập trung vào rà phá thủy lôi (MCM), lặn/EOD và phương tiện không người lái dưới nước nhằm nâng năng lực cho Hải quân Ukraine giữa xung đột với Nga.","items":[{"date":"2026-07-24","title":"Sea Breeze 26-2 kết thúc sau hai tuần huấn luyện rà phá thủy lôi","summary":"Diễn tập rà phá thủy lôi đa quốc gia Sea Breeze 26-2 tại Portland (Anh) kết thúc ngày 24/7 với sự tham gia của Ukraine và các đồng minh NATO.","sourceName":"NATO Maritime Command","sourceUrl":"https://mc.nato.int/media-centre/news/2026/allied-and-partner-naval-forces-strengthen-ukraines-mine-countermeasures-readiness-during-exercise-sea-breeze-3"}],"background":"Sea Breeze 26-2 do Hạm đội 6 Mỹ và Hải quân Ukraine đồng chỉ huy, Hải quân Hoàng gia Anh đăng cai tổ chức tại Portland (Anh) từ 13-24/7/2026, có thêm hoạt động lặn và trục vớt tại Latvia, quy tụ 16 quốc gia.\nTrọng tâm là huấn luyện rà phá thủy lôi nhằm củng cố năng lực của Hải quân Ukraine - 5 tàu quét mìn Ukraine tham gia đều là quà tặng từ đồng minh (Anh, Bỉ, Hà Lan).\nViệc tổ chức tại Anh thay vì Biển Đen phản ánh rủi ro an ninh từ cuộc chiến Nga-Ukraine, trong khi thủy lôi trên Biển Đen được xem là mối đe dọa hàng hải lớn nhất kể từ Thế chiến II, ảnh hưởng trực tiếp tới an toàn hàng hải và xuất khẩu ngũ cốc Ukraine.","concepts":[{"term":"Rà phá thủy lôi (Mine Countermeasures - MCM)","def":"Các biện pháp dò tìm, vô hiệu hóa hoặc phá hủy thủy lôi để bảo đảm an toàn tuyến hàng hải."},{"term":"Tàu quét mìn (minehunter)","def":"Loại tàu chuyên dụng trang bị sonar và robot để phát hiện, tiêu diệt thủy lôi dưới biển."},{"term":"Phương tiện không người lái dưới nước/mặt nước (UUV/USV)","def":"Thiết bị tự hành dùng để dò quét thủy lôi mà không cần thủy thủ tiếp cận trực tiếp vùng nguy hiểm."},{"term":"Đối tác tăng cường (Enhanced Partnership)","def":"Khuôn khổ hợp tác quân sự sâu hơn mà NATO/đồng minh dành riêng cho Ukraine dù nước này chưa là thành viên."},{"term":"Đồng chỉ huy (co-lead)","def":"Mô hình một quốc gia NATO và Ukraine cùng đứng ra điều phối diễn tập, thể hiện vai trò đối tác ngang hàng."}]},{"name":"Neptune Strike 26-3 (NATO)","status":"recent","dates":"17 – 23/7/2026","location":"Bắc Cực và Bắc Đại Tây Dương (High North/North Atlantic)","scale":"14 nước đóng góp lực lượng; nhóm tác chiến tàu sân bay Anh (HMS Prince of Wales) và nhóm tác chiến viễn chinh Tây Ban Nha (Castilla)","summary":"Neptune Strike là hoạt động cảnh giới tăng cường (enhanced Vigilance Activity) định kỳ của NATO do STRIKFORNATO chỉ huy; lần 26-3 lần đầu mở rộng lên Bắc Cực và Bắc Đại Tây Dương thay vì chỉ tập trung ở Địa Trung Hải, phản ánh trọng tâm mới của NATO trong việc răn đe Nga ở vùng cực Bắc.","items":[{"date":"2026-07-23","title":"Neptune Strike 26-3 strengthens NATO's multi-domain integration across the High North and North Atlantic","summary":"NATO công bố kết quả diễn tập Neptune Strike 26-3, đánh dấu lần đầu hoạt động này mở rộng ra Bắc Cực và Bắc Đại Tây Dương với 14 nước tham gia.","sourceName":"SHAPE/NATO JFC Norfolk","sourceUrl":"https://shape.nato.int/news-archive/2026/neptune-strike-263-strengthens-natos-multidomain-integration-across-the-high-north-and-north-atlantic"}],"background":"Neptune Strike là Hoạt động Cảnh giác Tăng cường (eVA) định kỳ của NATO do Bộ Tư lệnh Tác chiến Hải quân NATO (STRIKFORNATO) chủ trì, đợt 26-3 diễn ra 17-23/7/2026 với sự tham gia của 12 quốc gia đồng minh.\nĐây là lần đầu tiên chuỗi diễn tập Neptune Strike mở rộng lên vùng Cực Bắc và Bắc Đại Tây Dương, nằm trong khuôn khổ chiến dịch Arctic Sentry, với nhóm tác chiến tàu sân bay Anh (HMS Prince of Wales) và nhóm viễn chinh Tây Ban Nha làm nòng cốt.\nSự mở rộng phản ánh mối lo ngại ngày càng lớn của NATO về sườn phía Bắc, trong bối cảnh Nga tăng cường hiện diện quân sự ở Bắc Cực và Phần Lan, Thụy Điển đã gia nhập liên minh.","concepts":[{"term":"Enhanced Vigilance Activity (eVA)","def":"Hoạt động cảnh giác tăng cường - hình thức diễn tập/răn đe định kỳ của NATO nhằm duy trì sẵn sàng chiến đấu quanh năm."},{"term":"Nhóm tác chiến tàu sân bay (Carrier Strike Group)","def":"Đội hình tác chiến gồm tàu sân bay cùng các tàu hộ tống, tàu ngầm hỗ trợ, tạo sức mạnh tấn công và phòng thủ tổng hợp trên biển."},{"term":"Vòng Cực Bắc (High North)","def":"Khu vực Bắc Cực và cận Bắc Cực đang trở thành điểm nóng cạnh tranh chiến lược giữa NATO và Nga."},{"term":"Tác chiến đa miền (Multi-domain operations)","def":"Phối hợp tác chiến đồng thời trên biển, trên không, trên bộ và không gian mạng dưới một khung chỉ huy thống nhất."},{"term":"STRIKFORNATO","def":"Bộ Tư lệnh Lực lượng Tấn công và Hỗ trợ Hải quân NATO, đơn vị điều phối chính của chuỗi diễn tập Neptune Strike."}]},{"name":"Hán Quang 42 - Han Kuang 2026 (Đài Loan)","status":"upcoming","dates":"5 – 14/8/2026 (diễn tập tiền trạm 13–17/7/2026)","location":"Toàn đảo Đài Loan","scale":"Diễn tập phòng thủ toàn dân lớn nhất của Đài Loan, kết hợp quân đội, quân dự bị và diễn tập ứng phó đô thị dân sự","summary":"Han Kuang là diễn tập phòng thủ thường niên lớn nhất của Đài Loan, mô phỏng kịch bản Trung Quốc tấn công qua eo biển Đài Loan. Phiên bản 2026 (lần thứ 42) nhấn mạnh khả năng phối hợp tác chiến hiệp đồng quân binh chủng theo mô hình huấn luyện của quân đội Mỹ và tích hợp phòng thủ dân sự - quân sự.","items":[{"date":"2026-07-21","title":"Urban resilience drills to test civil-military cooperation","summary":"Đài Loan chạy các diễn tập ứng phó đô thị song song với chuẩn bị cho Han Kuang 42, dự kiến khai màn ngày 5/8/2026.","sourceName":"Taipei Times","sourceUrl":"https://www.taipeitimes.com/News/taiwan/archives/2026/07/21/2003861127"}],"background":"Hán Quang là cuộc diễn tập quân sự thường niên quy mô lớn nhất của Đài Loan, đợt 42 diễn ra 5-14/8/2026, gồm hai giai đoạn: diễn tập mô phỏng trên máy tính và diễn tập bắn đạn thật.\nNăm 2026 lần đầu tiên các đơn vị tình báo quân sự tham gia diễn tập bàn cờ, đồng thời có phần kiểm tra giả lập gián đoạn mạng di động tại 14 khu vực hành chính; song song còn có diễn tập khả năng phục hồi đô thị tại Cao Hùng, Bình Đông, Tân Bắc và Nghi Lan.\nCuộc diễn tập nằm trong chiến lược phòng thủ toàn xã hội của chính quyền Tổng thống Lại Thanh Đức, trong bối cảnh áp lực quân sự từ Trung Quốc đại lục quanh eo biển Đài Loan tiếp tục gia tăng.","concepts":[{"term":"Phòng thủ toàn xã hội (whole-of-society defense)","def":"Chiến lược huy động cả quân đội lẫn dân sự (y tế, viễn thông, hậu cần) cùng chuẩn bị ứng phó xung đột."},{"term":"Diễn tập mô phỏng máy tính (CPX)","def":"Giai đoạn diễn tập chỉ huy-tham mưu bằng mô hình máy tính trước khi bước vào diễn tập thực địa."},{"term":"Diễn tập bắn đạn thật (live-fire exercise)","def":"Giai đoạn thực hành sử dụng vũ khí, đạn dược thật để kiểm tra khả năng tác chiến trong điều kiện gần thực tế."},{"term":"Khả năng phục hồi đô thị (urban resilience)","def":"Năng lực của thành phố duy trì hoạt động thiết yếu (y tế, điện, thông tin) khi bị tấn công hoặc gián đoạn."},{"term":"Kịch bản PLA xâm lược","def":"Giả định tấn công đổ bộ hoặc phong tỏa của Quân Giải phóng Nhân dân Trung Quốc mà Hán Quang dùng làm cơ sở luyện tập."}]},{"name":"Lion Protector 26 (Lực lượng Viễn chinh Liên hợp JEF do Anh dẫn đầu)","status":"upcoming","dates":"Tháng 9/2026","location":"Iceland, eo biển Đan Mạch (Danish Straits) và Na Uy","scale":"10 quốc gia thành viên JEF (Anh, Đan Mạch, Estonia, Phần Lan, Iceland, Latvia, Litva, Hà Lan, Na Uy, Thụy Điển) cùng Ukraine tham gia theo khuôn khổ Đối tác Tăng cường","summary":"Lion Protector 26 là diễn tập biểu tượng năm 2026 của Lực lượng Viễn chinh Liên hợp (JEF) do Anh dẫn đầu, tập trung bảo vệ hạ tầng trọng yếu trước phá hoại và tấn công, đồng thời chỉ huy - kiểm soát liên hợp trên khắp vùng Cực Bắc, Bắc Đại Tây Dương và cửa ngõ Baltic.","items":[{"date":"2026-03-20","title":"Joint Expeditionary Force HQ begins planning for Lion Protector as UK doubles Arctic commitment","summary":"Sở chỉ huy JEF khởi động lập kế hoạch cho Lion Protector 26 tại Utrecht, trong bối cảnh Anh tăng gấp đôi cam kết ở Bắc Cực.","sourceName":"JEF Nations","sourceUrl":"https://jefnations.org/2026/03/20/joint-expeditionary-force-hq-begins-planning-for-lion-protector-as-uk-doubles-arctic-commitment/"}],"background":"Lion Protector 26 là diễn tập trọng tâm năm 2026 của Lực lượng Viễn chinh Liên hợp (JEF) do Anh dẫn dắt, quy tụ 10 quốc gia thành viên (Đan Mạch, Estonia, Phần Lan, Iceland, Latvia, Litva, Hà Lan, Na Uy, Thụy Điển, Anh), triển khai tại Iceland, eo biển Đan Mạch và Na Uy trong tháng 9/2026.\nDiễn tập mở màn cho chuỗi hoạt động JEF kéo dài ba năm, tập trung bảo vệ hạ tầng trọng yếu quốc gia (cáp ngầm, đường ống dưới biển) trước nguy cơ phá hoại, đồng thời có sự tham gia của các đơn vị Ukraine theo khuôn khổ Đối tác Tăng cường.\nBối cảnh là loạt sự cố nghi phá hoại cáp ngầm và đường ống ở Biển Baltic gần đây, gắn với lo ngại về \"hạm đội bóng tối\" của Nga và nguy cơ leo thang ở khu vực Cực Bắc, Bắc Đại Tây Dương.","concepts":[{"term":"Lực lượng Viễn chinh Liên hợp (JEF)","def":"Liên minh 10 quốc gia Bắc Âu do Anh dẫn dắt, chuyên phản ứng nhanh cho an ninh khu vực Bắc Âu-Baltic, hoạt động song song với NATO."},{"term":"Hạ tầng trọng yếu dưới biển (critical undersea infrastructure)","def":"Cáp viễn thông, cáp điện và đường ống năng lượng đặt dưới đáy biển, có vai trò sống còn với kinh tế và an ninh quốc gia."},{"term":"Hạm đội bóng tối (shadow fleet)","def":"Đội tàu chở dầu/hàng hóa không rõ nguồn gốc, bị nghi liên quan Nga, dùng để né trừng phạt và bị cáo buộc liên quan các vụ phá hoại cáp ngầm."},{"term":"Đối tác Tăng cường (Enhanced Partnership)","def":"Cơ chế JEF dành cho Ukraine tham gia sâu hơn vào hoạt động huấn luyện dù chưa là thành viên chính thức."},{"term":"Phá hoại hỗn hợp (hybrid sabotage)","def":"Hành vi phá hoại hạ tầng dân sự dưới ngưỡng chiến tranh công khai, khó quy trách nhiệm rõ ràng cho một nhà nước."}]},{"name":"Yudh Abhyas 2026 (Ấn Độ - Mỹ)","status":"upcoming","dates":"Đầu tháng 9/2026","location":"Auli, bang Uttarakhand (gần Đường Kiểm soát Thực tế LAC với Trung Quốc) và trường bắn Mahajan, bang Rajasthan, Ấn Độ","scale":"Khoảng 350 quân mỗi bên; lần đầu tiên có trực thăng tấn công Apache tham gia","summary":"Yudh Abhyas là diễn tập lục quân thường niên lớn giữa Ấn Độ và Mỹ, khởi động từ 2004. Phiên bản thứ 22 năm 2026 diễn ra tại hai địa điểm: huấn luyện tác chiến độ cao gần biên giới Trung Quốc ở Uttarakhand, và diễn tập hỏa lực - cơ giới - phối hợp pháo binh/không quân ở sa mạc Rajasthan.","items":[{"date":"2026-07-10","title":"Exercise Yudh Abhyas 2026: Indian and US Armies to Train Near LAC in Uttarakhand and Rajasthan Desert","summary":"Ấn Độ và Mỹ xác nhận diễn tập Yudh Abhyas 2026 sẽ diễn ra đầu tháng 9 tại Auli và Mahajan, lần đầu có trực thăng Apache tham gia.","sourceName":"Asianet Newsable","sourceUrl":"https://newsable.asianetnews.com/india/exercise-yudh-abhyas-2026-apache-helicopters-to-join-india-us-yudh-abhyas-exercise-in-uttarakhand-rajasthan-articleshow-v02q4g9"}],"background":"Yudh Abhyas là diễn tập lục quân song phương Ấn-Mỹ luân phiên tổ chức từ năm 2004, đợt thứ 22 diễn ra đầu tháng 9/2026 với khoảng 350 quân mỗi bên, huấn luyện tại Auli (bang Uttarakhand, cao khoảng 2.500m, cách Đường Kiểm soát Thực tế LAC với Trung Quốc chỉ khoảng 95km) và trường bắn Mahajan (sa mạc Rajasthan).\nLần đầu tiên trực thăng Apache được đưa vào diễn tập, thể hiện nỗ lực nâng cao phối hợp không-bộ và khả năng tác chiến vùng cao.\nDiễn tập diễn ra trong bối cảnh căng thẳng biên giới Ấn-Trung tại LAC vẫn âm ỉ và quan hệ đối tác chiến lược Mỹ-Ấn ngày càng được thắt chặt trong chiến lược Ấn Độ Dương-Thái Bình Dương.","concepts":[{"term":"Đường Kiểm soát Thực tế (LAC)","def":"Ranh giới trên thực địa phân chia vùng kiểm soát giữa Ấn Độ và Trung Quốc, chưa được phân định chính thức và từng xảy ra đụng độ."},{"term":"Tác chiến vùng cao (high-altitude warfare)","def":"Tác chiến trong điều kiện độ cao lớn, thiếu oxy và thời tiết khắc nghiệt, đòi hỏi huấn luyện thích nghi đặc biệt."},{"term":"Phối hợp không-bộ (air-ground integration)","def":"Sự kết hợp giữa lực lượng mặt đất và không quân/trực thăng để tăng hiệu quả tấn công và trinh sát."},{"term":"Diễn tập luân phiên song phương","def":"Hình thức diễn tập tổ chức lần lượt tại lãnh thổ mỗi nước tham gia theo từng năm."}]},{"name":"UNITAS 2026 (Mỹ và các nước châu Mỹ, Peru chủ trì)","status":"upcoming","dates":"10 – 24/9/2026","location":"Peru (biển, đổ bộ, sông Amazon, vùng cao nguyên)","scale":"24 quốc gia, hơn 5.000 quân nhân tham gia","summary":"UNITAS là diễn tập hải quân đa quốc gia lâu đời nhất thế giới do Bộ Tư lệnh Nam Mỹ của Mỹ (SOUTHCOM) khởi xướng. Phiên bản 2026 do Peru đăng cai gồm 5 giai đoạn: tác chiến trên biển, đổ bộ, cơ động trên sông Amazon, phòng thủ mạng và diễn tập vùng cao nguyên, với sự tham gia của Chile và nhiều nước Mỹ Latinh khác.","items":[{"date":"2026-06-26","title":"UNITAS 2026: Culminó en Perú la fase de planeamiento del Ejercicio Multinacional más grande del Continente Americano","summary":"Peru hoàn tất giai đoạn lập kế hoạch cho UNITAS 2026, xác nhận diễn tập sẽ diễn ra từ 10-24/9/2026 với 24 nước tham gia.","sourceName":"Zona Militar","sourceUrl":"https://www.zona-militar.com/2026/06/26/unitas-2026-culmino-en-peru-la-fase-de-planeamiento-del-ejercicio-multinacional-mas-grande-del-continente-americano/"}],"background":"UNITAS là diễn tập hải quân đa quốc gia lâu đời nhất thế giới còn duy trì liên tục, năm 2026 do Peru đăng cai đúng dịp kỷ niệm 200 năm độc lập, quy tụ 20 quốc gia với 29 tàu chiến, 4 tàu ngầm và 20 máy bay hoạt động ngoài khơi Lima và trong rừng Amazon quanh Iquitos.\nĐiểm mới năm nay là lần đầu tiên có hoạt động huấn luyện tại hồ Titicaca trên cao nguyên và bổ sung hợp phần phòng thủ không gian mạng.\nDiễn tập phản ánh nỗ lực của Mỹ duy trì quan hệ an ninh hàng hải với châu Mỹ Latinh trong bối cảnh Trung Quốc gia tăng đầu tư hạ tầng chiến lược trong khu vực, như cảng Chancay do Trung Quốc tài trợ tại chính Peru.","concepts":[{"term":"UNITAS","def":"Từ tiếng Latin nghĩa là \"đoàn kết\", tên diễn tập hải quân đa quốc gia thường niên lâu đời nhất thế giới do Mỹ khởi xướng từ 1959."},{"term":"Phòng thủ không gian mạng (cyber defense)","def":"Hợp phần mới của UNITAS 2026 nhằm huấn luyện bảo vệ hệ thống mạng và hạ tầng thông tin trước tấn công mạng."},{"term":"Hợp tác biển-sông-hồ","def":"Phạm vi huấn luyện mở rộng từ vùng biển ven bờ Lima sang sông Amazon và hồ Titicaca, phản ánh địa hình đa dạng của khu vực."},{"term":"Cạnh tranh ảnh hưởng Mỹ-Trung tại Mỹ Latinh","def":"Bối cảnh Washington tăng cường hợp tác quân sự để cân bằng ảnh hưởng kinh tế-hạ tầng ngày càng lớn của Bắc Kinh trong khu vực."}]},{"name":"Predator's Run 2026 (tập trận Mỹ - Úc - Philippines)","status":"ongoing","dates":"21-29/07/2026","location":"Townsville Field Training Area, Queensland, Australia","scale":"Đa quốc gia - Thủy quân lục chiến Mỹ (MRF-Darwin 26), Lữ đoàn 1 Lục quân Úc, Lữ đoàn 1 Quân đội Philippines","summary":"Tập trận lục quân đa quốc gia Predator's Run 26 khai mạc ngày 21/7 tại Townsville, kéo dài 9 ngày, hợp nhất ba quân đội Mỹ - Úc - Philippines thành một lực lượng tác chiến chung dưới cơ cấu chỉ huy thống nhất. Nội dung gồm phối hợp cấp trung đội tiến tới bài bắn đạn thật phòng thủ hợp đồng, nhằm tăng khả năng phối hợp tác chiến trong khu vực Ấn Độ Dương - Thái Bình Dương.","items":[{"date":"2026-07-22","title":"Lục quân Philippines và Australia khởi động Exercise Carabaroo 2026 trong khuôn khổ Predator's Run","summary":"Lữ đoàn Chiến đấu số 1 Quân đội Philippines cùng Lữ đoàn 1 Quân đội Australia khởi động Exercise Carabaroo 2026 tại thao trường Townsville (Queensland) - cuộc tập trận hải ngoại lớn nhất năm 2026 của Lục quân Philippines, nằm trong khuôn khổ Predator's Run 2026 cùng Thủy quân lục chiến Mỹ. Ba lực lượng huấn luyện dưới một cơ cấu chỉ huy thống nhất, hướng tới bài bắn đạn thật phòng ngự tổng hợp.","sourceName":"Daily Tribune","sourceUrl":"https://tribune.net.ph/2026/07/22/phl-australian-armies-launch-exercise-carabaroo-2026"},{"date":"2026-07-21","title":"Khai mạc Predator's Run 26 tại Townsville: Mỹ, Úc, Philippines hợp nhất chỉ huy","summary":"Thủy quân lục chiến Mỹ thuộc Lực lượng Luân phiên Darwin 26 cùng Lữ đoàn 1 Lục quân Úc và Lữ đoàn 1 Quân đội Philippines khởi động Predator's Run 26 tại Townsville, tích hợp ba lực lượng thành một khối tác chiến chung, hướng tới bài bắn đạn thật phòng thủ hợp đồng.","sourceName":"U.S. Indo-Pacific Command","sourceUrl":"https://www.pacom.mil/Media/News/News-Articles/Article/4551982/us-marines-australian-army-armed-forces-of-the-philippines-kick-off-exercise-pr/"}],"background":"Predator's Run 26 khai mạc ngày 21/7/2026 tại khu huấn luyện Townsville, bang Queensland (Úc), kéo dài 9 ngày đến 29/7, quy tụ Lực lượng Thủy quân lục chiến Mỹ luân phiên tại Darwin (MRF-D 26), Lữ đoàn 1 Lục quân Úc và Lữ đoàn chiến đấu số 1 Lục quân Philippines.\nĐây là một trong chuỗi tập trận thường niên nhằm gắn kết ba quân đội thành một lực lượng có thể phối hợp tác chiến như một khối thống nhất, từ chỉ huy - kiểm soát, hậu cần đến hiệp đồng binh chủng.\nCuộc tập trận diễn ra trong bối cảnh Manila và Washington tăng cường hợp tác quốc phòng giữa lúc căng thẳng với Trung Quốc trên Biển Đông chưa hạ nhiệt, còn Úc củng cố vai trò trung chuyển lực lượng Mỹ tại Darwin theo các thỏa thuận quốc phòng song phương.\nGiới quan sát xem đây là tín hiệu Washington tiếp tục dựa vào mạng lưới đồng minh nhỏ (minilateral) ở Ấn Độ Dương - Thái Bình Dương thay vì chỉ hành động đơn phương.","concepts":[{"term":"Marine Rotational Force – Darwin (MRF-D)","def":"Lực lượng Thủy quân lục chiến Mỹ luân phiên đồn trú tại Darwin, Úc theo thỏa thuận quốc phòng song phương Mỹ - Úc."},{"term":"Tác chiến hiệp đồng (combined arms)","def":"Phối hợp nhiều binh chủng như bộ binh, pháo binh, thiết giáp trong cùng một đội hình chiến đấu để tăng hiệu quả tấn công/phòng thủ."},{"term":"Lực lượng hoán đổi lẫn nhau (interchangeable force)","def":"Các đơn vị từ nhiều quốc gia có thể phối hợp tác chiến như một khối thống nhất, dùng chung cơ cấu chỉ huy và hậu cần."},{"term":"Hiệp ước phòng thủ chung Mỹ - Philippines (1951)","def":"Cơ sở pháp lý ràng buộc Mỹ hỗ trợ phòng thủ Philippines nếu bị tấn công, nền tảng cho các hoạt động hợp tác quân sự song phương hiện nay."},{"term":"Ấn Độ Dương - Thái Bình Dương tự do và rộng mở (FOIP)","def":"Tầm nhìn chiến lược của Mỹ và đồng minh nhằm duy trì trật tự khu vực dựa trên luật lệ, thường được viện dẫn để đối trọng ảnh hưởng ngày càng lớn của Trung Quốc."}]},{"name":"RIMPAC 2026 (Rim of the Pacific)","status":"ongoing","dates":"24/6 – 31/7/2026","location":"Quần đảo Hawaii và vùng biển lân cận","scale":"30 nước, ~31 tàu mặt nước, 5 tàu ngầm, 15 lực lượng bộ binh, hơn 200 máy bay, 30.000 quân — kỳ RIMPAC lớn nhất lịch sử (lần thứ 30)","summary":"RIMPAC là cuộc tập trận hải quân đa quốc gia lớn nhất thế giới do Hạm đội Thái Bình Dương Mỹ chủ trì, tổ chức hai năm một lần. Kỳ 2026 với chủ đề \"đối tác: hợp nhất và sẵn sàng\", có nhiều nước lần đầu tham gia (Ba Lan, Tây Ban Nha, Guatemala, Hy Lạp, Fiji) bên cạnh các thành viên thường xuyên như Úc, Nhật, Hàn, Anh, Pháp, Ấn Độ.","items":[{"date":"2026-07-22","title":"RIMPAC 2026: liên quân diệt hạm bằng loạt tên lửa đa quốc gia trong diễn tập SINKEX","summary":"Trong bài tập bắn chìm tàu thật (SINKEX) ngoài khơi Hawaii, Mỹ và đồng minh dùng HIMARS, tên lửa Type 12 của Nhật, Harpoon từ tàu Tây Ban Nha và tàu ngầm Mỹ, LRASM từ Super Hornet cùng SPIKE NLOS từ Apache để đánh chìm hai tàu cũ USS Peleliu và USS Mobile Bay ở độ sâu khoảng 15.000 feet gần đảo Kauai. Lực lượng Nhật, Tây Ban Nha, Úc, Philippines, Hàn Quốc, New Zealand và Mỹ tham gia.","sourceName":"DVIDS","sourceUrl":"https://www.dvidshub.net/news/570552/us-and-partner-nations-conduct-sinkex-during-rimpac-26"},{"date":"2026-07-16","title":"USV Typhoon lần đầu tiếp tế tự động trên biển cho tàu đổ bộ USS Essex tại RIMPAC 2026","summary":"Xuồng không người lái tự hành Typhoon của Splash Industries (tốc độ hành trình hơn 50 hải lý/giờ, tầm 600+ hải lý) tự hành hoàn toàn tiến vào khoang chứa tàu đổ bộ tấn công USS Essex (LHD-2) để chuyển linh kiện - lần đầu một USV thực hiện tiếp tế trên biển cho tàu chiến lớn có thủy thủ đoàn, trong khuôn khổ RIMPAC 2026 tại Hawaii.","sourceName":"Naval News","sourceUrl":"https://www.navalnews.com/naval-news/2026/07/typhoon-usv-uss-essex-at-sea-resupply"},{"date":"2026-07-14","title":"RIMPAC 2026 trình diễn in 3D kim loại trên tàu sân bay và tiếp tế bằng drone tự hành","summary":"Trong khuôn khổ RIMPAC 2026, Bộ Quốc phòng Mỹ thử nghiệm tích hợp in 3D tiên tiến với drone tự hành lớn nhất từ trước tới nay để tiếp tế hậu cần trên biển. Tàu sân bay USS Theodore Roosevelt lần đầu mang máy in 3D kim loại lai (HYBRiD-X) ngay trên tàu, trong khi drone mặt nước tự hành vận chuyển phụ tùng qua sóng cao tới 3,6m tới nhiều tàu Mỹ và đối tác.","sourceName":"Stars and Stripes","sourceUrl":"https://www.stripes.com/theaters/asia_pacific/2026-07-14/three-d-printing-autonomous-delivery-rimpac-22260494.html"},{"date":"2026-07-13","title":"RIMPAC 2026 bước vào giai đoạn tác chiến trên biển, nhấn mạnh gắn kết liên minh","summary":"Ấn phẩm của Bộ Tư lệnh Ấn Độ Dương - Thái Bình Dương Mỹ đưa tin RIMPAC 2026 đã vào giai đoạn tác chiến trên biển với 30 quốc gia, hơn 30 tàu mặt nước, 5 tàu ngầm và hơn 200 máy bay, do nhóm tác chiến tàu sân bay USS Theodore Roosevelt dẫn đầu. Đợt tập trận kiểm nghiệm phối hợp tác chiến đa miền và công nghệ mới; Philippines lần đầu cử tàu Cảnh sát biển tham gia bên cạnh tàu Hải quân.","sourceName":"Indo-Pacific Defense Forum","sourceUrl":"https://ipdefenseforum.com/2026/07/rimpac-2026-puts-coalition-cohesion-into-practice/"},{"date":"2026-07-08","title":"Máy bay tuần thám P-8A Hàn Quốc lần đầu diễn tập săn ngầm tại RIMPAC 2026","summary":"Trong giai đoạn trên biển của RIMPAC 2026 gần Honolulu, máy bay tuần thám săn ngầm P-8A Poseidon của Hải quân Hàn Quốc lần đầu thực hiện đầy đủ quy trình tác chiến chống ngầm, phối hợp cùng P-8A Mỹ dùng phao sonar truy tìm mục tiêu ngầm giả định. Đây là lần đầu Hàn Quốc triển khai loại máy bay này tại RIMPAC.","sourceName":"Korea Times","sourceUrl":"https://www.koreatimes.co.kr/southkorea/defense/20260708/korean-navys-p-8-demonstrates-submarine-hunting-capability-at-rimpac"},{"date":"2026-07-08","title":"Indonesia lần đầu tham gia tập trận RIMPAC 2026 tại Hawaii","summary":"Quân đội Indonesia chính thức gia nhập cuộc tập trận hải quân đa quốc gia RIMPAC 2026 với 37 binh sĩ, đánh dấu lần đầu tiên Indonesia tham gia cuộc tập trận quy mô 30 quốc gia này.","sourceName":"ANTARA News","sourceUrl":"https://en.antaranews.com/news/421996/indonesian-military-joins-2026-rimpac-to-reinforce-regional-stability"},{"date":"2026-07-08","title":"Trung Quốc phô diễn tên lửa siêu vượt âm DF-17 trên truyền hình nhà nước","summary":"Trung Quốc trưng ra clip tên lửa siêu vượt âm DF-17 trên truyền thông nhà nước; chuyên gia cho rằng đây là màn phô trương sức mạnh đáp lại các cuộc tập trận ở châu Á - TBD.","sourceName":"Defense News","sourceUrl":"https://www.defensenews.com/global/asia-pacific/2026/07/08/china-shows-snazzy-clip-of-df-17-missile-on-state-tv-in-show-of-force/","relate":"Được giới chuyên gia đọc là đòn răn đe của Bắc Kinh nhằm đáp trả RIMPAC và trấn an nội bộ về năng lực xuyên thủng phòng thủ tên lửa của đối phương."},{"date":"2026-07-08","title":"Trung Quốc thử SLBM ra Nam Thái Bình Dương, bị nói làm suy yếu vùng phi hạt nhân","summary":"Vụ phóng SLBM ngày 6/7 của Trung Quốc ra Nam Thái Bình Dương vấp phản đối vì bị cho là làm suy yếu vùng phi hạt nhân khu vực; Bắc Kinh nhiều lần chỉ trích thỏa thuận tàu ngầm AUKUS.","sourceName":"Defense News","sourceUrl":"https://www.defensenews.com/global/asia-pacific/2026/07/07/chinese-ballistic-missile-test-is-said-to-undermine-nuclear-weapons-free-zone-in-south-pacific/","relate":"Diễn ra ngay khi RIMPAC quy tụ 30 nước tại Thái Bình Dương, vụ thử là màn đối trọng chiến lược, phát tín hiệu răn đe hạt nhân của Trung Quốc với liên minh do Mỹ dẫn dắt."}],"background":"RIMPAC 2026 diễn ra từ 24/6 đến 31/7/2026 tại và quanh quần đảo Hawaii, là kỳ thứ 30 của cuộc tập trận hải quân đa quốc gia lớn nhất thế giới do Hạm đội Thái Bình Dương Hoa Kỳ chủ trì hai năm một lần.\nQuy mô năm nay có khoảng 30 quốc gia tham gia, hơn 30 tàu mặt nước, 5 tàu ngầm, 15 lực lượng lục quân, hơn 200 máy bay và khoảng 30.000 quân nhân.\nRIMPAC vừa là dịp huấn luyện tương tác giữa hải quân nhiều nước, vừa là biểu tượng sức mạnh hàng hải của Mỹ và mạng lưới đồng minh giữa lúc cạnh tranh chiến lược Mỹ - Trung ở Ấn Độ Dương - Thái Bình Dương gia tăng.\nĐáng chú ý, Trung Quốc từng được mời tham gia RIMPAC 2014 và 2016 nhưng bị loại khỏi các kỳ từ 2018 do tranh chấp Biển Đông, khiến cuộc tập trận ngày càng mang màu sắc răn đe đối với Bắc Kinh.","concepts":[{"term":"RIMPAC (Rim of the Pacific)","def":"Tập trận hải quân đa quốc gia lớn nhất thế giới, do Hạm đội Thái Bình Dương Mỹ tổ chức định kỳ hai năm một lần tại Hawaii từ năm 1971."},{"term":"Hạm đội Thái Bình Dương Hoa Kỳ (US Pacific Fleet)","def":"Bộ tư lệnh hải quân Mỹ phụ trách khu vực Thái Bình Dương, đơn vị chủ trì tổ chức RIMPAC."},{"term":"Tác chiến đa lĩnh vực (multi-domain operations)","def":"Phối hợp tác chiến đồng thời trên nhiều môi trường: biển, trên không, mặt đất, không gian mạng và vũ trụ."},{"term":"Diễn tập đổ bộ (amphibious operations)","def":"Huấn luyện đưa lực lượng từ biển lên bờ để chiếm giữ hoặc kiểm soát khu vực ven biển."},{"term":"Khả năng tương tác (interoperability)","def":"Năng lực phối hợp tác chiến hiệu quả giữa hải quân nhiều quốc gia có trang bị, quy trình chỉ huy khác nhau."}]},{"name":"Joint Sea-2026 (Tập trận hải quân Trung - Nga)","status":"recent","dates":"Đầu tháng 7/2026","location":"Vùng biển và không phận gần Thanh Đảo (Hoàng Hải), Sơn Đông; nối tiếp tuần tra chung Bắc TBD","scale":"Chủ đề \"phản ứng chung với các mối đe dọa an ninh biển\"; Nga cử tuần dương hạm Varyag, khinh hạm Surovy, tàu ngầm cỡ lớn Ufa và tàu cứu hộ Igor Belousov","summary":"Joint Sea là cuộc tập trận hải quân thường niên giữa Trung Quốc và Nga. Kỳ 2026 khai mạc tại quân cảng Thanh Đảo ngày 6/7 sau khi biên đội tàu Nga tới hội quân ngày 5/7, triển khai theo ba giai đoạn: tập kết lực lượng, hiệp đồng tại cảng và tác chiến trên biển.","items":[{"date":"2026-07-13","title":"Trung Quốc, Nga kết thúc tập trận hải quân chung Joint Sea-2026 tại Thanh Đảo","summary":"Tân Hoa Xã đưa tin tập trận hải quân chung Joint Sea-2026 giữa Trung Quốc và Nga đã kết thúc tại quân cảng Thanh Đảo (Sơn Đông) hôm 13/7, hoàn tất các khoa mục đã định. Đây là lần thứ 12 trong chuỗi tập trận từ 2012, diễn ra 6-13/7 qua 3 giai đoạn gồm trinh sát liên hợp, phòng không - phòng thủ tên lửa và tấn công trên biển.","sourceName":"Xinhua","sourceUrl":"https://english.news.cn/20260713/9379d756304e40088458553afd2c8264/c.html"},{"date":"2026-07-09","title":"Hải quân Trung - Nga bắt đầu diễn tập bắn đạn thật trong khuôn khổ Joint Sea-2026","summary":"Ngày 9/7, tàu chiến Trung Quốc và Nga bắt đầu tiến hành các khoa mục bắn đạn thật tại khu vực chỉ định gần Thanh Đảo, đánh dấu bước tiếp theo của giai đoạn trên biển. Khu trục hạm Kaifeng của Trung Quốc thực hành bắn vào mục tiêu trên không, cùng các khoa mục trinh sát liên hợp, phòng không - phòng thủ tên lửa.","sourceName":"Xinhua","sourceUrl":"https://english.news.cn/20260709/092ca13570a74054af614464467bb24e/c.html"},{"date":"2026-07-09","title":"Tập trận hải quân Trung-Nga chuyển sang giai đoạn hoạt động trên biển","summary":"Sau khi hoàn thành giai đoạn lập kế hoạch tại cảng Thanh Đảo, tàu chiến Trung-Nga rời cảng sáng 9/7 để bắt đầu giai đoạn hoạt động trên biển, gồm tuần tra chung, phòng không-tên lửa, tấn công hàng hải và cứu hộ tàu ngầm.","sourceName":"CGTN","sourceUrl":"https://news.cgtn.com/news/2026-07-09/China-Russia-joint-naval-drills-move-to-at-sea-phase--1OE4RgJMxpu/p.html"},{"date":"2026-07-08","title":"Trung Quốc thử SLBM ra Thái Bình Dương (nhiều khả năng JL-3)","summary":"Hải quân Trung Quốc phóng thử tên lửa đạn đạo chiến lược từ tàu ngầm hạt nhân ra Nam Thái Bình Dương ngày 6/7, được cho là bước tiến tới răn đe trên biển liên tục.","sourceName":"Naval News","sourceUrl":"https://www.navalnews.com/naval-news/2026/07/china-pacific-slbm-test-casd-nuclear-deterrence/","relate":"Diễn ra gần như đồng thời với Joint Sea-2026, cho thấy Bắc Kinh vừa phối hợp phô diễn sức mạnh với Nga vừa độc lập trình diễn năng lực răn đe hạt nhân trên biển ở Tây Thái Bình Dương."}],"background":"Joint Sea-2026 diễn ra từ 6 đến 13/7/2026 tại quân cảng Thanh Đảo và vùng biển Hoàng Hải, là lần thứ 12 trong chuỗi tập trận hải quân song phương Trung - Nga khởi động từ năm 2012, nằm trong kế hoạch hợp tác quân sự thường niên giữa hai nước.\nBiên đội Nga do tuần dương hạm mang tên lửa dẫn đường Varyag dẫn đầu, cùng khinh hạm Rezkiy, tàu ngầm Ufa; phía Trung Quốc có các khu trục hạm Type 052D, Type 055 và khinh hạm Type 054A, thực hiện các khoa mục trinh sát, phòng không, chống ngầm, tấn công mặt nước và tìm kiếm cứu nạn.\nSau khi kết thúc, một số tàu hai bên tiếp tục ra Thái Bình Dương tuần tra hàng hải chung, động thái thường bị Mỹ, Nhật Bản và các đồng minh theo dõi sát vì diễn ra gần các tuyến hàng hải và không phận nhạy cảm.\nMoskva và Bắc Kinh tuyên bố cuộc tập trận mang tính phòng thủ, không nhắm vào bên thứ ba, nhưng giới phân tích coi đây là biểu hiện cụ thể của quan hệ đối tác chiến lược ngày càng sâu sắc giữa hai nước, đối trọng với mạng lưới đồng minh Mỹ tại khu vực (như RIMPAC, Predator's Run).","concepts":[{"term":"Joint Sea (Hải quân liên hợp)","def":"Chuỗi tập trận hải quân song phương Trung - Nga được tổ chức thường niên từ năm 2012, luân phiên vùng biển của hai nước."},{"term":"Tuần tra hàng hải chung (joint maritime patrol)","def":"Hoạt động phối hợp tuần tra trên biển của hải quân hai nước sau khi tập trận kết thúc, thường tiến ra các vùng biển xa hơn."},{"term":"Tác chiến chống ngầm (ASW - anti-submarine warfare)","def":"Các khoa mục phát hiện, theo dõi và đối phó tàu ngầm đối phương, một hạng mục huấn luyện trọng tâm của Joint Sea."},{"term":"Đối tác chiến lược toàn diện Nga - Trung","def":"Khuôn khổ hợp tác chính trị - quân sự sâu rộng giữa Moskva và Bắc Kinh, được mô tả là 'không giới hạn' từ tuyên bố chung năm 2022."},{"term":"Biển Hoàng Hải","def":"Vùng biển giữa bán đảo Triều Tiên và Trung Quốc, nơi diễn ra Joint Sea-2026, gần các tuyến hàng hải và không phận nhạy cảm của Đông Bắc Á."}]}],"dipEvents":[{"name":"Thượng đỉnh NATO Ankara 2026","status":"recent","dates":"7–8/7/2026","location":"Ankara, Thổ Nhĩ Kỳ (khu tổ hợp phủ tổng thống Beştepe/Külliye)","scale":"Nguyên thủ và người đứng đầu chính phủ các nước thành viên NATO; lần đầu một Tổng thống Mỹ thăm Thổ Nhĩ Kỳ kể từ 2015; ban hành Tuyên bố thượng đỉnh Ankara","summary":"Hội nghị thượng đỉnh thường niên của NATO năm 2026 do Thổ Nhĩ Kỳ đăng cai, tập trung vào chi tiêu quốc phòng, hỗ trợ Ukraine và loạt sáng kiến năng lực chung. Hội nghị diễn ra trong bầu không khí căng thẳng khi Mỹ công kích một số đồng minh và cuộc chiến Mỹ - Iran leo thang.","items":[{"date":"2026-07-10","title":"Zelensky thúc giục xúc tiến khẩn cấp việc sản xuất tên lửa Patriot tại Ukraine","summary":"Sau khi Tổng thống Trump đồng ý cấp phép tại thượng đỉnh NATO Ankara, Tổng thống Zelensky ngày 10/7 kêu gọi Ukraine gấp rút triển khai các bước kỹ thuật để bắt đầu tự sản xuất tên lửa đánh chặn Patriot (PAC-3), nhằm khắc phục tình trạng thiếu hụt nguồn cung khi Nga tăng cường tấn công tên lửa đạn đạo. Giới chức quốc phòng Ukraine cảnh báo việc thiết lập dây chuyền sản xuất trong nước có thể mất nhiều tháng.","sourceName":"Al Jazeera","sourceUrl":"https://www.aljazeera.com/news/2026/7/10/zelenskyy-urges-urgent-efforts-in-ukraine-to-start-patriot-production"},{"date":"2026-07-08","title":"NATO cam kết 70 tỷ euro viện trợ quân sự cho Ukraine giai đoạn 2026-2027","summary":"Kết thúc hội nghị thượng đỉnh tại Ankara, NATO chính thức cam kết cung cấp 70 tỷ euro viện trợ quân sự, thiết bị và huấn luyện cho Ukraine trong hai năm 2026-2027 — cam kết lớn nhất lịch sử liên minh dành cho một quốc gia đang xung đột.","sourceName":"Al Jazeera","sourceUrl":"https://www.aljazeera.com/news/2026/7/8/nato-pledges-70-billion-euros-for-ukraine-as-trump-praises-peace-progress"},{"date":"2026-07-08","title":"NATO phê duyệt sáng kiến 'Drone Edge' 40 tỷ USD và gói tái trang bị 50 tỷ euro","summary":"Bên lề thượng đỉnh Ankara, NATO công bố các thỏa thuận mua sắm quốc phòng mới trị giá hơn 50 tỷ euro và phê duyệt sáng kiến 'NATO Drone Edge' với khoản đầu tư 40 tỷ USD trong 5 năm cho hệ thống máy bay không người lái, cùng cam kết 27 tỷ euro cho hạ tầng nhiên liệu.","sourceName":"Kyiv Post","sourceUrl":"https://www.kyivpost.com/post/79928"},{"date":"2026-07-08","title":"Trump quay sang chỉ trích Tây Ban Nha, đòi Greenland","summary":"Tổng thống Trump công kích Tây Ban Nha vì chi tiêu quốc phòng thấp và tái nêu yêu sách Greenland, phơi bày rạn nứt trong liên minh; văn phòng Thủ tướng Sanchez nói xem đây là chuyện \"bình thường\".","sourceName":"Defense News","sourceUrl":"https://www.defensenews.com/global/europe/2026/07/08/trump-turns-on-spain-and-demands-greenland-as-nato-summit-exposes-cracks/","relate":"Là tâm điểm gây chia rẽ của thượng đỉnh, cho thấy mâu thuẫn Mỹ - đồng minh về chia sẻ gánh nặng và chủ quyền lãnh thổ ngay tại sự kiện biểu tượng đoàn kết."},{"date":"2026-07-08","title":"Trump ca ngợi NATO \"thống nhất\", nêu khả năng Ukraine tự lắp Patriot","summary":"Rời hội nghị, Trump ca ngợi sự \"thống nhất\" của NATO và gợi ý cấp phép cho Ukraine tự lắp ráp đạn đánh chặn Patriot, dù chuyên gia nói việc này mất nhiều tháng.","sourceName":"Breaking Defense","sourceUrl":"https://breakingdefense.com/2026/07/trump-leaves-summit-praising-nato-unification-floats-ukraine-made-patriots/","relate":"Kết quả trực tiếp của thượng đỉnh về hồ sơ Ukraine, cân bằng lại thông điệp cứng rắn của Trump với cam kết hỗ trợ phòng không cho Kyiv."},{"date":"2026-07-09","title":"Đức mua tên lửa Tomahawk của Mỹ, triển khai trên lãnh thổ","summary":"Đức đạt thỏa thuận mua tên lửa hành trình Tomahawk của Mỹ và bố trí trên lãnh thổ, bước chuyển tới năng lực tấn công tầm xa được công bố quanh dịp thượng đỉnh.","sourceName":"Defense News","sourceUrl":"https://www.defensenews.com/global/europe/2026/07/09/germany-to-buy-us-tomahawks-in-shift-toward-own-long-range-capability/","relate":"Nằm trong làn sóng cam kết tăng cường năng lực của các đồng minh xung quanh thượng đỉnh, củng cố răn đe của NATO ở sườn đông."},{"date":"2026-07-08","title":"Lithuania ký MoU tham gia chương trình tàu chuẩn hóa của Na Uy bên lề thượng đỉnh","summary":"Na Uy và Lithuania ký biên bản ghi nhớ liên chính phủ hợp tác về chương trình tàu chuẩn hóa của Na Uy, ký ngày 8/7 bên lề thượng đỉnh NATO.","sourceName":"Naval News","sourceUrl":"https://www.navalnews.com/naval-news/2026/07/kongsberg-norway-standardised-vessels-lithuania-uk/","relate":"Minh họa cho hàng loạt thỏa thuận năng lực song phương/đa phương được chốt bên lề thượng đỉnh, làm sâu hội nhập quốc phòng Bắc Âu - Baltic."},{"date":"2026-07-09","title":"Phân tích: Trump nhắm Tây Ban Nha, NATO hậu thuẫn Ukraine — liên minh còn thống nhất?","summary":"Al Jazeera phân tích nghịch lý của thượng đỉnh: NATO nhất trí tăng chi tiêu quốc phòng nhưng công kích của Trump nhằm vào Tây Ban Nha và Greenland lại đe dọa sự gắn kết.","sourceName":"Al Jazeera","sourceUrl":"https://www.aljazeera.com/news/2026/7/9/trump-targets-spain-nato-backs-ukraine-is-the-alliance-still-united","relate":"Bài phân tích chiều sâu về kết quả và ẩn ý chiến lược của thượng đỉnh, đánh giá mức độ đoàn kết thực chất của khối."}]},{"name":"Nhật Bản – New Zealand nâng cấp hợp tác an ninh (ACSA 2026)","status":"recent","dates":"10/7/2026","location":"Tokyo, Nhật Bản","scale":"Ngoại trưởng Nhật Motegi Toshimitsu và Ngoại trưởng New Zealand Winston Peters; ký Hiệp định Trao đổi Hậu cần và Dịch vụ Tương hỗ (ACSA), Hiệp định Bảo mật Thông tin chính thức có hiệu lực","summary":"Nhân chuyến thăm Nhật Bản của Ngoại trưởng New Zealand Winston Peters, hai nước hoàn tất ký Hiệp định Trao đổi Hậu cần và Dịch vụ Tương hỗ (ACSA) và đưa Hiệp định Bảo mật Thông tin vào hiệu lực, đánh dấu bước nâng cấp khuôn khổ hợp tác an ninh - quốc phòng giữa hai đối tác quan trọng của Mỹ tại Ấn Độ Dương - Thái Bình Dương.","items":[{"date":"2026-07-10","title":"Nhật Bản - New Zealand ký thỏa thuận hậu cần quân sự ACSA, nâng cấp quan hệ song phương","summary":"Ngoại trưởng Nhật Bản Motegi Toshimitsu hội đàm với Ngoại trưởng New Zealand Winston Peters tại Tokyo ngày 10/7. Hai bên xác nhận ACSA đã được ký kết và Hiệp định Bảo mật Thông tin chính thức có hiệu lực, đồng thời cam kết tăng cường hợp tác song phương.","sourceName":"Bộ Ngoại giao Nhật Bản","sourceUrl":"https://www.mofa.go.jp/press/release/press1e_000382.html"}]},{"name":"Tuần lễ cấp cao Đại hội đồng LHQ khóa 81","status":"upcoming","dates":"Tháng 9/2026","location":"New York, Mỹ","scale":"Lãnh đạo và trưởng đoàn gần 200 quốc gia thành viên LHQ; các phiên thảo luận chung và loạt cuộc gặp song phương","summary":"Tuần lễ cấp cao thường niên của Đại hội đồng Liên Hợp Quốc, nơi lãnh đạo thế giới phát biểu và tiến hành ngoại giao bên lề. Kỳ 2026 dự kiến xoay quanh xung đột Trung Đông, chiến sự Ukraine và cạnh tranh nước lớn.","items":[]},{"name":"Thượng đỉnh G20 2026 (Mỹ chủ trì)","status":"upcoming","dates":"Cuối năm 2026","location":"Mỹ","scale":"Lãnh đạo 20 nền kinh tế lớn nhất thế giới cùng khách mời","summary":"Mỹ giữ chức chủ tịch luân phiên G20 năm 2026 và sẽ đăng cai hội nghị thượng đỉnh, tập trung vào kinh tế toàn cầu, năng lượng và thương mại trong bối cảnh căng thẳng địa chính trị gia tăng.","items":[]},{"name":"Thủ tướng Ấn Độ Modi công du Australia và New Zealand (07/2026)","status":"recent","dates":"08-11/07/2026","location":"Melbourne (Australia) và Auckland (New Zealand)","scale":"Thăm cấp nguyên thủ tại 2 nước, gồm Thượng đỉnh thường niên Ấn Độ - Australia lần thứ 3","summary":"Thủ tướng Ấn Độ Narendra Modi công du Australia (8-10/7) và New Zealand (10-11/7), đạt loạt kết quả cụ thể: với Australia là Tuyên bố chung Quốc phòng-An ninh, thỏa thuận uranium dân sự, hành lang khoáng sản thiết yếu và Lộ trình an ninh hàng hải Ấn Độ Dương - Thái Bình Dương; với New Zealand là nâng cấp lên Đối tác Chiến lược cùng thỏa thuận hợp tác hàng hải và hậu cần quốc phòng - chuyến thăm New Zealand đầu tiên của một Thủ tướng Ấn Độ trong 40 năm.","items":[{"date":"2026-07-09","title":"Ấn Độ - Australia ký Tuyên bố chung Quốc phòng-An ninh và thỏa thuận uranium dân sự","summary":"Tại Melbourne, Thủ tướng Modi và Thủ tướng Albanese công bố Tuyên bố chung Quốc phòng-An ninh, thỏa thuận xuất khẩu uranium dân sự cho chương trình điện hạt nhân Ấn Độ, hành lang khoáng sản thiết yếu và Lộ trình an ninh hàng hải Ấn Độ Dương - Thái Bình Dương.","sourceName":"Văn phòng Thủ tướng Australia","sourceUrl":"https://www.pm.gov.au/media/australia-india-joint-statement"},{"date":"2026-07-11","title":"Ấn Độ - New Zealand nâng cấp lên Đối tác Chiến lược, ký thỏa thuận hàng hải và hậu cần quốc phòng","summary":"Trong chuyến thăm New Zealand đầu tiên của một Thủ tướng Ấn Độ sau 40 năm, Thủ tướng Modi và Thủ tướng Christopher Luxon nâng quan hệ lên Đối tác Chiến lược, công bố Lộ trình đến 2030 và ký Thỏa thuận Hợp tác Hàng hải (MCA), Thỏa thuận Hỗ trợ Hậu cần song phương cùng hợp tác thủy văn - hải đồ.","sourceName":"Văn phòng Thủ tướng Ấn Độ","sourceUrl":"https://www.pmindia.gov.in/en/news_updates/india-new-zealand-joint-statement/"}]},{"name":"Liên minh phòng thủ tên lửa đạn đạo tích hợp châu Âu (Paris 2026)","status":"recent","dates":"13/07/2026","location":"Paris, Pháp (Điện Invalides)","scale":"10 nước sáng lập: Ukraine, Anh, Pháp, Đức, Ý, Đan Mạch, Hà Lan, Na Uy, Tây Ban Nha, Thụy Điển; ~25 lãnh đạo châu Âu dự","summary":"Ukraine cùng 9 nước châu Âu công bố thành lập Liên minh phòng thủ tên lửa đạn đạo tích hợp tại hội nghị Coalition of the Willing ở Điện Invalides (Paris) do Tổng thống Pháp Macron chủ trì, có Tổng thống Ukraine Zelensky tham dự. Mục tiêu xây dựng năng lực phòng thủ tên lửa đạn đạo chung cho châu Âu, hậu thuẫn dự án lá chắn Freyja do công ty Ukraine Fire Point phát triển (~700.000 USD/quả đánh chặn, rẻ hơn nhiều so với 3,8 triệu USD của Patriot PAC-3), kỳ vọng vận hành trong 12 tháng.","items":[{"date":"2026-07-14","title":"10 nước ký tuyên bố lập Liên minh phòng thủ tên lửa đạn đạo, phát triển hệ thống Freyja","summary":"Tại Paris ngày 13-14/7, Ukraine cùng 9 nước châu Âu ký tuyên bố thành lập liên minh phòng thủ tên lửa đạn đạo tích hợp, trọng tâm phát triển hệ thống Freyja - phương án thay thế rẻ hơn Patriot dựa trên kinh nghiệm chiến đấu của Ukraine; đặt mục tiêu đạt năng lực vận hành ban đầu trong 12 tháng.","sourceName":"Defense News","sourceUrl":"https://www.defensenews.com/global/europe/2026/07/14/9-nations-back-ukraines-patriot-alternative-freyja-and-want-it-flying-in-a-year/"},{"date":"2026-07-13","title":"Pháp và 9 nước công bố thành lập Liên minh phòng thủ tên lửa đạn đạo tích hợp cho châu Âu","summary":"Tại Điện Invalides (Paris), Tổng thống Pháp Macron cùng Tổng thống Ukraine Zelensky và lãnh đạo 8 nước châu Âu (Anh, Đức, Ý, Đan Mạch, Hà Lan, Na Uy, Tây Ban Nha, Thụy Điển) ra tuyên bố chung thành lập Liên minh phòng thủ tên lửa đạn đạo tích hợp, nhằm xây dựng năng lực phòng thủ chung trước tên lửa đạn đạo Nga và hậu thuẫn dự án Freyja của Ukraine.","sourceName":"Élysée","sourceUrl":"https://www.elysee.fr/en/emmanuel-macron/2026/07/13/joint-declaration-on-the-establishment-of-the-integrated-anti-ballistic-missile-coalition"}]},{"name":"Hiệp định Thương mại Tự do Ấn Độ - Anh (CETA) có hiệu lực","status":"recent","dates":"Hiệu lực từ 15/07/2026 (ký 24/07/2025)","location":"Ấn Độ - Anh","scale":"Song phương","summary":"Hiệp định Thương mại Tự do toàn diện Ấn Độ - Anh (CETA), ký tháng 7/2025, chính thức có hiệu lực từ 15/7/2026 cùng Hiệp định An sinh xã hội song phương. CETA mở miễn thuế cho khoảng 99% dòng thuế xuất khẩu của Ấn Độ, được xem là FTA toàn diện nhất Ấn Độ ký với một nước G7 và là hiệp định thương mại song phương lớn nhất của Anh kể từ khi rời EU.","items":[{"date":"2026-07-15","title":"CETA Ấn Độ - Anh và Hiệp định an sinh xã hội chính thức có hiệu lực","summary":"Chính phủ Ấn Độ công bố CETA và Hiệp định An sinh xã hội với Anh có hiệu lực từ 15/7/2026, mở đường miễn/giảm thuế cho 99% dòng thuế hàng hóa và giảm gánh nặng đóng bảo hiểm xã hội trùng lặp cho lao động Ấn Độ tại Anh.","sourceName":"PIB India","sourceUrl":"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2274280"}]},{"name":"Hội nghị Bộ trưởng Ngoại giao ASEAN (AMM) & kỷ niệm 50 năm Hiệp ước TAC tại Manila 2026","status":"upcoming","dates":"19-24/07/2026","location":"Manila, Philippines","scale":"10 Ngoại trưởng ASEAN + đối tác đối thoại: Mỹ (Rubio), Trung Quốc (Vương Nghị), Nga (Lavrov), Nhật, Ấn Độ, Úc, New Zealand, EU","summary":"Philippines - chủ tịch ASEAN 2026 - chủ trì tuần lễ cấp cao gồm Hội nghị Bộ trưởng Ngoại giao ASEAN (AMM, 21/7), các hội nghị Post-Ministerial với đối tác đối thoại, tham vấn không chính thức về Myanmar (Đồng thuận 5 điểm), và lễ kỷ niệm 50 năm Hiệp ước Thân thiện và Hợp tác Đông Nam Á (TAC) ngày 24/7 - văn kiện nền tảng về nguyên tắc chung sống hoà bình khu vực.","items":[{"date":"2026-07-24","title":"ASEAN kỷ niệm 50 năm Hiệp ước TAC, bốn nước châu Âu ký gia nhập","summary":"Bên lề AMM-59 tại Manila ngày 24/7, các Ngoại trưởng ASEAN chứng kiến lễ ký gia nhập Hiệp ước Thân thiện và Hợp tác Đông Nam Á (TAC) của Thụy Điển, Ba Lan, Romania và Litva, nâng tổng số bên tham gia hiệp ước lên 58 quốc gia. Ngoại trưởng Philippines Ma. Theresa Lazaro chủ trì phiên họp cấp cao các bên tham gia TAC với hơn 60 đại diện, trong đó có hơn 20 trưởng đoàn cấp bộ trưởng, bàn về việc điều chỉnh hiệp ước trước các thách thức đương đại.","sourceName":"VietnamPlus (TTXVN)","sourceUrl":"https://en.vietnamplus.vn/vietnam-attends-celebration-of-tacs-50th-anniversary-in-philippines-post348896.vnp"},{"date":"2026-07-23","title":"Nhật Bản - Philippines xác nhận ACSA có hiệu lực từ 22/8 bên lề AMM-59","summary":"Bên lề AMM-59 tại Manila ngày 23/7, Ngoại trưởng Nhật Bản Motegi Toshimitsu và Ngoại trưởng Philippines Theresa Lazaro hoan nghênh việc hai nước đã trao đổi công hàm ngoại giao (hôm 15/7 tại Manila) để Hiệp định Trao đổi Hậu cần và Dịch vụ Tương hỗ (ACSA, ký tháng 1/2026) chính thức có hiệu lực từ 22/8/2026. ACSA cho phép Lực lượng Phòng vệ Nhật và Quân đội Philippines trao đổi nhiên liệu, lương thực, vận tải, y tế trong diễn tập và cứu trợ, bổ sung cho Hiệp định Tiếp cận Đối ứng (RAA) đã có giữa hai nước.","sourceName":"Manila Bulletin","sourceUrl":"https://mb.com.ph/2026/07/24/philippines-japan-defense-logistics-pact-to-take-effect-in-august","relate":"Diễn ra bên lề Hội nghị Bộ trưởng Ngoại giao ASEAN (AMM-59) đang họp tại Manila 20-24/7/2026 — cùng chuỗi sự kiện sự kiện AMM đang theo dõi (Bãi Cỏ Mây, tuyên bố chung Quad, SEANWFZ)"},{"date":"2026-07-22","title":"Đụng độ tại bãi Cỏ Mây phủ bóng AMM-59, Rubio gặp Vương Nghị tại Manila","summary":"Ngày 21/7, tàu Philippines và Trung Quốc va chạm gần bãi Cỏ Mây (Ayungin) khiến một thủy thủ Philippines bị thương, hai nước triệu tập đại sứ của nhau; Mỹ lên án hành động 'nguy hiểm và hung hăng' của Trung Quốc. Ngoại trưởng Mỹ Marco Rubio tới Manila dự AMM-59 và dự kiến gặp Ngoại trưởng Trung Quốc Vương Nghị ngày 22/7 bên lề hội nghị.","sourceName":"Philippine Daily Inquirer","sourceUrl":"https://www.inquirer.net/481662/rubio-in-manilaas-us-hits-dangerouschina-actions/"},{"date":"2026-07-22","title":"Bộ tứ Quad ra tuyên bố chung bên lề AMM-59 tại Manila","summary":"Ngoại trưởng Mỹ, Nhật Bản, Australia và Ấn Độ họp bên lề loạt hội nghị ASEAN tại Manila ngày 22/7, ra tuyên bố chung tái khẳng định cam kết với một Ấn Độ Dương - Thái Bình Dương tự do, rộng mở và ủng hộ vai trò trung tâm, đoàn kết của ASEAN. Cuộc họp diễn ra chỉ hai ngày sau vụ va chạm giữa tàu Philippines và Trung Quốc ở Biển Đông.","sourceName":"The Tribune","sourceUrl":"https://www.tribuneindia.com/news/asean/quad-fmm-reaffirms-free-open-indo-pacific-commitment-backs-asean-unity-centrality"},{"date":"2026-07-20","title":"Philippines vận động các nước hạt nhân ký Nghị định thư SEANWFZ, ASEAN thúc đẩy mở lại Hormuz","summary":"Tại AMM-59 ở Manila, Philippines kêu gọi các quốc gia sở hữu vũ khí hạt nhân ký và phê chuẩn Nghị định thư của Hiệp ước Khu vực Đông Nam Á không có vũ khí hạt nhân (SEANWFZ) mà không bảo lưu — hồ sơ tồn đọng nhiều năm. Các ngoại trưởng khu vực cũng dự kiến kêu gọi mở hoàn toàn eo Hormuz do gián đoạn năng lượng gây sức ép lên các nền kinh tế nhập khẩu. Ngoại trưởng Mỹ (Rubio), Trung Quốc (Wang Yi) và Nga (Lavrov) đều có mặt, tạo cơ hội tiếp xúc bên lề, nhưng chưa có bằng chứng các nước hạt nhân sẵn sàng ký trong tuần này.","sourceName":"Philippine News Agency","sourceUrl":"https://www.pna.gov.ph/articles/1279867"},{"date":"2026-07-20","title":"AMM-59 khai mạc tại Manila; ASEAN chuẩn bị kêu gọi mở lại eo Hormuz, lễ ký TAC giữ lịch 24/7","summary":"Ngoại trưởng ASEAN bắt đầu chuỗi hội nghị tại Manila với chiến tranh Iran, an ninh năng lượng, Myanmar và Biển Đông trong chương trình nghị sự. Dự thảo cho thấy các nước Đông Nam Á muốn kêu gọi mở lại hoàn toàn eo Hormuz vì gián đoạn dầu khí đã tác động tới lạm phát, thương mại và chuỗi cung ứng khu vực. Ngoại trưởng Mỹ Marco Rubio, Vương Nghị (Trung Quốc) và Sergei Lavrov (Nga) dự kiến tham gia các cuộc họp liên quan; lễ ký kết nạp các bên mới vào TAC vẫn được lên lịch ngày 24/7.","sourceName":"Associated Press","sourceUrl":"https://apnews.com/article/2b968e79424b31ad4899331de0f214e4"},{"date":"2026-07-19","title":"ASEAN khai mạc vòng họp quan chức cao cấp (SOM) và Cấp cao Đông Á (EAS SOM) tại Manila, mở màn tuần lễ AMM 59","summary":"Ngày 19/7, Hội nghị quan chức cao cấp ASEAN (SOM) và Hội nghị quan chức cao cấp Cấp cao Đông Á (EAS SOM) đã khai mạc tại Manila, quy tụ các quan chức cấp cao ASEAN cùng Phó Tổng Thư ký ASEAN phụ trách Cộng đồng Chính trị-An ninh, nhằm chuẩn bị nội dung cho Hội nghị Bộ trưởng Ngoại giao ASEAN lần thứ 59 (khai mạc chính thức dự kiến 20/7). Hai chủ đề an ninh nổi bật được thảo luận là tiến trình đàm phán Bộ quy tắc ứng xử ở Biển Đông (COC) với Trung Quốc và tình hình Myanmar.","sourceName":"ASEAN Secretariat (asean.org)","sourceUrl":"https://asean.org/asean-senior-officials-meeting-convenes-in-manila/"},{"date":"2026-07-17","title":"ASEAN ấn định lễ ký kết nạp các bên mới vào TAC ngày 24/7 tại Manila","summary":"Ban Thư ký ASEAN xác nhận chuỗi Hội nghị Bộ trưởng Ngoại giao lần thứ 59 và các cuộc họp liên quan diễn ra tại Manila từ 18 đến 24/7. Ngày 24/7 sẽ có hội nghị cấp cao kỷ niệm 50 năm Hiệp ước Thân thiện và Hợp tác Đông Nam Á, kèm lễ ký dành cho các bên tham gia mới. Bộ Ngoại giao Philippines nói khoảng sáu đến bảy quốc gia dự kiến ký; danh sách cuối cùng chưa được công bố đầy đủ. Lịch và lễ ký đã được xác nhận chính thức, nhưng số bên tham gia vẫn phụ thuộc hoàn tất thủ tục trong tuần họp.","sourceName":"ASEAN Secretariat","sourceUrl":"https://asean.org/secretary-general-of-asean-to-participate-in-the-59th-asean-foreign-ministers-meeting-and-related-meetings-in-manila-the-republic-of-the-philippines/"},{"date":"2026-07-17","title":"Manila xác nhận đón Ngoại trưởng Mỹ, Trung Quốc, Nga dự loạt hội nghị ASEAN tuần tới","summary":"Philippines xác nhận Ngoại trưởng Mỹ Rubio, Trung Quốc Vương Nghị, Nga Lavrov cùng đại diện Nhật, Ấn Độ, Úc, New Zealand, EU sẽ dự tuần lễ cấp cao ASEAN tại Manila 19-24/7, gồm AMM, tham vấn Myanmar và kỷ niệm 50 năm Hiệp ước TAC.","sourceName":"Manila Times","sourceUrl":"https://www.manilatimes.net/2026/07/17/news/manila-to-host-rubio-yi-during-asean-foreign-ministers-meeting-next-week/2386192"}]},{"name":"Cơ chế Điều phối An ninh chung (JSCM) - Hiệp định Hoà bình CHDC Congo-Rwanda","status":"recent","dates":"15-17/07/2026","location":"Geneva, Thụy Sĩ","scale":"Mỹ, CHDC Congo, Rwanda, Qatar, Togo (trung gian Liên minh châu Phi), Ủy ban Liên minh châu Phi","summary":"Các bên họp phiên thứ 5 Cơ chế Điều phối An ninh chung triển khai Hiệp định Hoà bình Washington giữa CHDC Congo và Rwanda. Tuyên bố chung 17/7 tái khẳng định đẩy nhanh vô hiệu hoá FDLR, rút quân/dỡ biện pháp phòng thủ, và nhất trí khám phá cơ chế xác minh độc lập.","items":[{"date":"2026-07-17","title":"Mỹ, CHDC Congo, Rwanda ra tuyên bố chung sau phiên họp an ninh thứ 5 tại Geneva","summary":"Tuyên bố chung của Mỹ, CHDC Congo, Rwanda, Qatar, Togo và Ủy ban Liên minh châu Phi tái khẳng định triển khai Hiệp định Hoà bình Washington, nhất trí khám phá cơ chế xác minh và tiếp tục họp trong những tuần tới.","sourceName":"U.S. Department of State","sourceUrl":"https://www.state.gov/releases/office-of-the-spokesperson/2026/07/joint-statement-on-the-fifth-meeting-of-the-joint-security-coordination-mechanism-for-the-peace-agreement-between-the-democratic-republic-of-the-congo-and-the-republic-of-rwanda"}]},{"name":"New Zealand - Papua New Guinea ký thỏa thuận hợp tác quốc phòng 2026-2029","status":"recent","dates":"22-23/07/2026","location":"Papua N
