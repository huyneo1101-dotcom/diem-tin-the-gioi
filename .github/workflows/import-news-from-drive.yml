name: Import news from Google Drive

# Tìm và nạp file ban-tin-chien-luoc-YYYY-MM-DD-HHNN-ICT.json từ Drive
# Cần secret GOOGLE_DRIVE_FOLDER_ID (folder chứa file tin) & GDRIVE_API_KEY (hoặc service account JSON)
#
# ╔══════════════════════════════════════════════════════════════════════════════════════╗
# ║ ĐÃ TẮT LỊCH 30/07/2026 (Huy chốt) — workflow giữ nguyên, chỉ bỏ cron.                 ║
# ╚══════════════════════════════════════════════════════════════════════════════════════╝
# Cron cũ: '23 0,12 * * *' (07:23 & 19:23 VN). Bỏ vì HAI lý do đo được, không phải vì gọn:
#
# 01. NGUỒN ĐÃ KHÔ. `logs/state.json` → `drive-import.lastSuccess.sang = 2026-07-21`; mọi
#     phiên từ 22/07 tới 29/07 đều ghi note "khong tim thay file ban-tin-chien-luoc nao",
#     log ngày đều đúng 261 byte cùng một khuôn. Tức 09 ngày liền chạy không ra tin, trong
#     khi workflow vẫn báo `success` — đúng kiểu chết câm mà bảng CI vẫn xanh.
# 02. NÓ LÀ WORKFLOW TỰ ĐỘNG DUY NHẤT CÒN HỢP NHẤT `index.html` + `logs/` BẰNG REBASE.
#     Bước "Commit if changed" bên dưới `git add index.html logs/` rồi `git pull --rebase`
#     — CÙNG LỚP LỖI đã gây sự cố sổ đã gửi sáng 30/07 (xem `.github/scripts/ghi_so_push.py`).
#     Đo bằng `git log --format='%an'`: `index.html` có 05 nguồn ghi, `logs/state.json` có
#     03 nguồn; còn `docs/ung-vien-ci.json`, `baomoi-saved.json`, `docs/probe-ci.json` mỗi
#     file chỉ 01 nguồn — nên harvest-ci / sync-baomoi / probe-sources rebase vẫn an toàn,
#     riêng file này thì không. Phiên quét local sáng 30/07 chạy bù lúc 07:41 và 07:48, cách
#     mốc 07:23 đúng 18 phút: hai bên commit sát nhau là rebase xung đột và mất lô Drive
#     trong im lặng (khối dưới có retry, nhưng retry không chữa được xung đột — nó thử lại
#     đúng phép toán vừa hỏng trên đúng trạng thái đã bẩn).
#
# ⛔ MUỐN BẬT LẠI LỊCH THÌ PHẢI VÁ KHỐI COMMIT TRƯỚC — cổng `.github/scripts/kiem_luat_push.py`
#    CHẶN CỨNG việc thêm `schedule` vào đây chừng nào khối dưới còn `pull --rebase`.
#    Và ĐỪNG bê nguyên `ghi_so_push.py` sang: sổ là dữ liệu append-only nên hợp nhất được
#    bằng git, còn `index.html` thì KHÔNG — hai lô tin khác nhau cùng chèn vào đầu mảng
#    `DATA.news` là xung đột văn bản gần như chắc chắn. Đường đúng cho file này là: push bị
#    từ chối → `fetch` → bỏ lô của mình → chạy lại `add_news.py` với chính
#    `/tmp/new_items.json` trên đỉnh mới (add_news dedupe theo URL nên chạy lại là an toàn)
#    → commit → push.
#
# Chạy tay vẫn được bất cứ lúc nào bằng nút "Run workflow", hoặc:
#   gh workflow run import-news-from-drive.yml
# Chạy tay thì có người ngồi canh, thấy đỏ là xử được — đó là lý do khối rebase dưới được
# để nguyên thay vì vá: rủi ro chỉ tồn tại ở chế độ tự động, mà chế độ đó nay đã tắt.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-news-drive
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Download news from Google Drive
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        run: |
          python3 scripts/import_gdrive_news.py

      - name: Run add_news.py if file exists
        run: |
          if [ -f /tmp/new_items.json ]; then
            python3 scripts/add_news.py /tmp/new_items.json
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html logs/

          if git diff --cached --quiet; then
            echo "Khong co gi de commit."
            git log --oneline -1
            exit 0
          fi

          # index.html khong doi => lo nay chi co log/state (van commit de luon co dau vet chay)
          if git diff --cached --quiet -- index.html; then
            git commit -m "log: drive-import $(TZ='Asia/Ho_Chi_Minh' date '+%d/%m %H:%M') — khong co tin moi"
          else
            git commit -m "$(python3 scripts/gen-commit-msg.py)" 2>/dev/null || \
            git commit -m "Nhap ban tin tu Google Drive (auto-sync)"
          fi

          # main co nhieu nguon cung push (sync-baomoi, sync-preferences, routine quet tin)
          # => push tran co the bi tu choi non-fast-forward. Rebase roi thu lai.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✓ Commit va push thanh cong"
              exit 0
            fi
            echo "push bi tu choi — rebase roi thu lai ($i/5)"
            git pull --rebase origin main || { echo "::error::rebase conflict, can xu ly tay"; exit 1; }
            sleep $((i * 5))
          done
          echo "::error::push that bai sau 5 lan"
          exit 1
