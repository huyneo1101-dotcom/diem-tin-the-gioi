name: TEST truy cập trang .mil từ CI

# Workflow TẠM (27/07/2026) — kiểm xem GitHub runner có đọc được các trang quân chủng Mỹ không,
# trong khi máy Mac của Huy KHÔNG phân giải được DNS zone .mil (SERVFAIL, EDE(9)/EDE(22)).
# Chạy tay bằng `gh workflow run test-mil-access.yml`, đọc log rồi XOÁ file này.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Xac nhan noi dung 3 feed da chay
        run: |
          for u in "https://www.af.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=1&max=10" "https://www.marines.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=1&max=10" "https://www.news.uscg.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=1&max=10" "https://www.army.mil/rss/static/1.xml"; do
            echo "=== $u"
            curl -sL --max-time 25 "$u" | grep -o '<title>[^<]*</title>' | head -4
            curl -sL --max-time 25 "$u" | grep -o '<pubDate>[^<]*</pubDate>' | head -2
          done
      - name: Do bien the cho 4 domain con thieu
        run: |
          for u in "https://www.navy.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=1&max=10" "https://www.navy.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=800&Site=1105&max=10" "https://www.navy.mil/Press-Office/News-Stories/rss/" "https://www.centcom.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=1&max=10" "https://www.centcom.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=800&Site=95&max=10" "https://www.pacom.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=800&Site=1&max=10" "https://www.jcs.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=800&Site=1&max=10" "https://www.spaceforce.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=1&Site=1060&max=10" "https://www.war.gov/DesktopModules/ArticleCS/RSS.ashx?ContentType=400&Site=945&max=10" "https://www.war.gov/DesktopModules/ArticleCS/RSS.ashx?ContentType=9&Site=945&max=10"; do
            n=$(curl -sL --max-time 25 "$u" | grep -c "<item" || true)
            echo "items=$n | $u"
          done
