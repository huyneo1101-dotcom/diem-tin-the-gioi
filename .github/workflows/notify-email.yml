name: Gửi email điểm tin khi có bản tin mới

# Chạy khi index.html được push lên main. CHỈ gửi email khi commit là bản tin thật
# (message bắt đầu "Cap nhat ban tin ...") — nên commit sửa code/UI hay commit SKIP
# sẽ không gửi mail rác. Bắt cả phiên sáng lẫn tối (khác notify-push chỉ theo ngày).
on:
  push:
    branches: [main]
    paths: ['index.html']
  workflow_dispatch:
    inputs:
      subject_tag:
        description: 'Tiền tố gắn trước subject email (vd "[QUET TEST] ")'
        required: false
        default: ''

# Cần `write` để bước cuối commit sổ đã gửi (logs/da-gui-email.json).
permissions:
  contents: write

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 0 chứ không phải 2: bước ghi sổ phải `git pull --rebase` được, mà rebase trên bản
          # checkout nông thì hỏng. make_docx vẫn cần ít nhất HEAD~1 cho `prev_data()`.
          fetch-depth: 0

      - name: Kiểm tra commit có phải bản tin mới không
        id: chk
        run: |
          msg=$(git log -1 --format=%s)
          echo "commit: $msg ; event: ${{ github.event_name }}"
          # Chạy tay (workflow_dispatch) luôn gửi để test; tự động thì chỉ khi commit là bản tin.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || echo "$msg" | grep -qiE '^Cap nhat ban tin'; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.chk.outputs.go == '1'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Python
        if: steps.chk.outputs.go == '1'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Tạo file docx toàn bộ tin vừa quét
        if: steps.chk.outputs.go == '1'
        run: |
          pip install --quiet python-docx
          out=$(python3 .github/scripts/make_docx.py)
          echo "$out"
          echo "DOCX_PATH=${out#DOCX=}" >> "$GITHUB_ENV"

      - name: Gửi email
        if: steps.chk.outputs.go == '1'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO || 'lamgiaphat1603@gmail.com,huyneo1101@gmail.com' }}
          SUBJECT_TAG: ${{ inputs.subject_tag || '' }}
        run: |
          npm install nodemailer@6 --no-save
          node .github/scripts/send-email.js

      # Gửi Telegram SAU email và không được làm hỏng workflow: email vẫn là kênh chính,
      # Telegram chỉ là kênh phụ. Chưa cài secret thì script tự thoát êm (exit 0).
      - name: Gửi Telegram
        if: steps.chk.outputs.go == '1'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCX_PATH: ${{ env.DOCX_PATH }}
          SUBJECT_TAG: ${{ inputs.subject_tag || '' }}
        run: python3 .github/scripts/send_telegram.py

      # GHI SỔ ĐÃ GỬI — phải là bước CUỐI, sau CẢ email lẫn Telegram. Ghi sớm hơn thì
      # `make_docx`/`send_telegram` đọc sổ thấy chính lô tin vừa gửi và lọc sạch -> Telegram rỗng.
      # Nhờ sổ này bản tin TỐI không liệt kê lại tin đã gửi trong bản tin SÁNG (chỉ thị Huy 27/07).
      # Commit chỉ đụng logs/ nên KHÔNG khớp `paths: ['index.html']` -> không tự kích lại workflow.
      # CHỈ ghi khi là lần gửi THẬT do phiên quét push. Chạy tay (workflow_dispatch) là để
      # TEST — sự cố 27/07: hai lần chạy tay lúc 14:24/14:36 ghi 11 tin của cả ngày vào sổ,
      # suýt làm bản tin tối bỏ sạch chúng dù chúng được quét rải rác 09:13-14:17 chứ không
      # phải phiên sáng. Test không được để lại dấu vết lên bản tin thật.
      - name: Ghi sổ đã gửi
        if: steps.chk.outputs.go == '1' && github.event_name == 'push'
        continue-on-error: true
        run: |
          buoi=$(TZ=Asia/Ho_Chi_Minh date +%H)
          if [ "$buoi" -lt 14 ]; then b=sang; else b=toi; fi
          python3 .github/scripts/so_da_gui.py --ghi --buoi "$b"
          git config user.name "claude-scan-ci"
          git config user.email "noreply@anthropic.com"
          git add logs/da-gui-email.json
          git diff --cached --quiet && { echo "so khong doi"; exit 0; }
          git commit -m "so: ghi lo tin da gui email/telegram ($b)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push lan $i that bai, thu lai sau 10s"
            sleep 10
          done
          echo "::warning::khong push duoc so da gui — ban tin sau co the gui trung tin"
