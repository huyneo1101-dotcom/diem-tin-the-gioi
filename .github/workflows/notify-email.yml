name: Gửi email điểm tin khi có bản tin mới

# Chạy khi index.html được push lên main. CHỈ gửi email khi commit là bản tin thật
# (message bắt đầu "Cap nhat ban tin ...") — nên commit sửa code/UI hay commit SKIP
# sẽ không gửi mail rác. Bắt cả phiên sáng lẫn tối (khác notify-push chỉ theo ngày).
on:
  push:
    branches: [main]
    paths: ['index.html']
  workflow_dispatch:
    inputs:
      subject_tag:
        description: 'Tiền tố gắn trước subject email (vd "[QUET TEST] ")'
        required: false
        default: ''
      tu_dong:
        description: '1 = do phiên quét CI tự kích (được ghi sổ). Người bấm tay thì để trống.'
        required: false
        default: ''

# Cần `write` để bước cuối commit sổ đã gửi (logs/da-gui-email.json).
permissions:
  contents: write

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 0 chứ không phải 2. Lý do CŨ ("bước ghi sổ phải `pull --rebase` được") đã hết
          # hiệu lực từ 30/07/2026 — `ghi_so_push.py` không rebase nữa. Nhưng vẫn phải là 0:
          # `make_docx.prev_data()` cần `HEAD~1`, và `ghi_so_push.py` còn `reset --mixed
          # FETCH_HEAD` nên lịch sử phải đủ để giải được ref đó trên bản checkout.
          fetch-depth: 0

      - name: Kiểm tra commit có phải bản tin mới không
        id: chk
        run: |
          msg=$(git log -1 --format=%s)
          # 10# ép cơ số 10: `date +%H%M` cho "0845", mà bash coi số 0 đầu là BÁT PHÂN nên
          # `[ 0845 -ge 330 ]` vỡ với "value too great for base" — cổng giờ sẽ hỏng đúng
          # những giờ có số 0 đầu, tức toàn bộ ca sáng.
          gio=$((10#$(TZ=Asia/Ho_Chi_Minh date +%H%M)))
          echo "commit: $msg ; event: ${{ github.event_name }} ; gio VN: $gio"

          # CỔNG 1 — commit phải là bản tin.
          la_ban_tin=0
          echo "$msg" | grep -qiE '^Cap nhat ban tin' && la_ban_tin=1

          # CỔNG 2 — phải rơi vào KHUNG GIỜ của một CA CHÍNH THỨC (chỉ thị Huy 27/07/2026).
          # Ngày chỉ có 2 ca bắn email bản tin: SÁNG SỚM (CI 04:00 · local 04:33 · CI 05:00 ·
          # local 05:33, xong ~05:40) và TỐI (CI 21:00 · local 21:21 · vét CI 22:00).
          # VÌ SAO CẦN CỔNG NÀY: trước đây chỉ xét commit message, nên MỌI lần quét TAY giữa
          # ngày cũng bắn một email riêng — đo thật 27/07: quét tay 11:12 đã gửi email kèm
          # .docx. Tệ hơn, tin đó vào sổ đã gửi nên bản tin TỐI lại LOẠI chúng. Huy muốn ngược
          # lại: quét tay giữa ngày KHÔNG gửi email, tin nằm chờ và dồn hết vào bản tin TỐI.
          trong_ca=0
          if [ "$gio" -ge 330 ] && [ "$gio" -le 700 ]; then trong_ca=1; fi
          if [ "$gio" -ge 2030 ]; then trong_ca=1; fi

          # Chạy tay (workflow_dispatch) luôn gửi — dùng để test hoặc gửi bù khi lỡ ca.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          elif [ "$la_ban_tin" = 1 ] && [ "$trong_ca" = 1 ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
            if [ "$la_ban_tin" = 1 ]; then
              echo "::notice::Bản tin ngoài khung ca chính thức ($gio) — KHÔNG gửi email. Tin sẽ dồn vào bản tin TỐI."
            fi
          fi

      - name: Setup Node
        if: steps.chk.outputs.go == '1'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Python
        if: steps.chk.outputs.go == '1'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Tạo file docx toàn bộ tin vừa quét
        if: steps.chk.outputs.go == '1'
        env:
          # Đọc tin Jay Lâm gửi qua bot (dt_jaylam_inbox) để gộp vào mục 5 — CHỈ có tác dụng
          # ở bản buổi TỐI (make_docx.py:la_buoi_toi()). Thiếu secret này -> make_docx tự bỏ
          # qua mục 5, KHÔNG làm hỏng phần còn lại của file (xem docstring doc_tin_jaylam_chua_gop).
          DT_BOT_KEY: ${{ secrets.DT_BOT_KEY }}
        run: |
          pip install --quiet python-docx
          out=$(python3 .github/scripts/make_docx.py)
          echo "$out"
          echo "DOCX_PATH=${out#DOCX=}" >> "$GITHUB_ENV"

      - name: Gửi email
        if: steps.chk.outputs.go == '1'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO || 'lamgiaphat1603@gmail.com,huyneo1101@gmail.com' }}
          SUBJECT_TAG: ${{ inputs.subject_tag || '' }}
          # TẮT EMAIL — chỉ thị Huy 27/07/2026: "từ giờ không cần gửi email cho ai nữa, gửi
          # telegram thôi". Đổi thành '1' là bật lại, không phải dựng lại gì.
          GUI_EMAIL: '0'
        run: |
          npm install nodemailer@6 --no-save
          node .github/scripts/send-email.js

      # ⚠️ TELEGRAM LÀ KÊNH DUY NHẤT (email đã tắt 27/07/2026) -> BỎ `continue-on-error`.
      # Trước đây nuốt lỗi vì email gánh chính; giữ nguyên thì Telegram chết mà job vẫn XANH,
      # và Huy không nhận được bản tin nào mà chẳng có dấu hiệu gì. Nay hỏng là job ĐỎ.
      - name: Gửi Telegram
        if: steps.chk.outputs.go == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCX_PATH: ${{ env.DOCX_PATH }}
          SUBJECT_TAG: ${{ inputs.subject_tag || '' }}
        run: python3 .github/scripts/send_telegram.py

      # GHI SỔ ĐÃ GỬI — phải là bước CUỐI, sau CẢ email lẫn Telegram. Ghi sớm hơn thì
      # `make_docx`/`send_telegram` đọc sổ thấy chính lô tin vừa gửi và lọc sạch -> Telegram rỗng.
      # Nhờ sổ này bản tin TỐI không liệt kê lại tin đã gửi trong bản tin SÁNG (chỉ thị Huy 27/07).
      # Commit chỉ đụng logs/ nên KHÔNG khớp `paths: ['index.html']` -> không tự kích lại workflow.
      # CHỈ ghi khi là lần gửi THẬT. Người bấm tay là để TEST — sự cố 27/07: hai lần chạy tay
      # lúc 14:24/14:36 ghi 11 tin của cả ngày vào sổ, suýt làm bản tin tối bỏ sạch chúng dù
      # chúng được quét rải rác 09:13-14:17 chứ không phải phiên sáng.
      #
      # ⚠️ ĐIỀU KIỆN CŨ `event_name == 'push'` ĐÃ SAI TỪ KHI CÓ CI (vá 28/07/2026). GitHub cố
      # ý KHÔNG cho push bằng `GITHUB_TOKEN` kích workflow khác (chống đệ quy), nên phiên quét
      # CI buộc phải tự gọi `gh workflow run` — tức mọi bản tin do CI ra đều là
      # `workflow_dispatch` và **rơi hết khỏi sổ**. Hậu quả đo được sáng 28/07: bản tin sáng
      # tới tay Huy lúc 04:18 (9 tin, có .docx) mà sổ trống trơn ⇒ (a) canary ca `sang` kêu
      # oan "hỏng ở khâu GỬI"; (b) nặng hơn — sổ chính là thứ lọc "tin đã gửi", nên bản tin
      # TỐI cùng ngày sẽ liệt kê lại đúng 9 tin đó, lặp lại lỗi Huy đã bắt hôm 27/07.
      #
      # Vì vậy phân biệt bằng Ý ĐỊNH (`tu_dong`) chứ không bằng KIỂU SỰ KIỆN: CI kích thì
      # truyền `-f tu_dong=1`, người bấm tay thì để trống. Nhánh MODE=test của claude-web-scan
      # cố tình KHÔNG truyền cờ này — test vẫn không được để dấu vết.
      #
      # ⚠️ KHỐI `git pull --rebase` CŨ ĐÃ BỎ (vá 30/07/2026) — nó là nguyên nhân sổ trống
      # sáng 30/07: `notify-morning.yml` ghi cùng file này lúc 21:28:01Z, workflow này ghi
      # lúc 21:28:08Z (cách 07 GIÂY, hệ quả của việc gộp event-scan vào cùng session sáng
      # ngày 28/07), rebase xung đột `could not apply … (sang)` rồi cả 5 vòng retry chết
      # tiếp trong trạng thái rebase dở. Bản tin ĐÃ gửi 04:28 mà sổ trống ⇒ canary ca
      # `sang` kêu oan + hai phiên CI dự phòng quét lại tốn token.
      # Luật hợp nhất sổ nay nằm ở ĐÚNG MỘT chỗ — `ghi_so_push.py`, dùng chung với
      # notify-morning.yml. Đừng chép logic git trở lại đây: hai bộ luật song song chắc
      # chắn lệch, mà lệch âm thầm. Bộ test canh: `tests/test-ghi-so-push.py`.
      - name: Ghi sổ đã gửi
        if: steps.chk.outputs.go == '1' && (github.event_name == 'push' || inputs.tu_dong == '1')
        continue-on-error: true
        run: |
          gio=$(TZ=Asia/Ho_Chi_Minh date +%H)
          if [ "$gio" -lt 14 ]; then b=sang; else b=toi; fi
          python3 .github/scripts/ghi_so_push.py --buoi "$b" \
            --nhan "so: ghi lo tin da gui email/telegram ($b)"
