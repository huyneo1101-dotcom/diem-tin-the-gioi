name: Canary — báo khi bản tin KHÔNG tới nơi

# Con chim trong mỏ than: chỉ kêu khi bản tin đã hụt. Ngày bình thường nó im.
#
# VÌ SAO PHẢI LÀ WORKFLOW RIÊNG: mọi cảnh báo khác của repo này đều do chính routine phát ra,
# nên chúng đòi routine phải CHẠY mới báo được. Kiểu hỏng nguy hiểm nhất lại là KHÔNG CHẠY
# PHÁT NÀO (máy Mac ngủ · GitHub bỏ cron · phiên chết trước khi push nên notify-email.yml —
# vốn kích theo PUSH — không có gì để kích). Canary cố tình không dùng chung cron, không dùng
# chung job, không import gì của đường quét: nó chết cùng lúc với routine thì nó vô nghĩa.
#
# GIỜ CHẠY = SAU LỚP CUỐI, KHÔNG PHẢI SAU HẠN CHÓT. Lớp vét CI 21:47 gửi tới ~22:10 là hành vi
# ĐÚNG; kêu lúc 22:05 là kêu oan, mà cảnh báo kêu oan vài lần là hết ai đọc. Xem docstring
# canary.py, mục "CHẠY SAU LỚP VÉT".
# ⚠️ Số giờ ở đây đã một lần mục: tới 30/07/2026 vẫn ghi lịch CI cũ (21:00 · 22:00 · 05:00)
# trong khi `claude-web-scan.yml` dời sớm 13' từ trước đó. Nay có cổng canh —
# `python3 scripts/kiem_lich.py --kiem` đối chiếu mọi cụm "CI HH:MM" với cron thật. Bảng lịch
# đầy đủ: `docs/LICH.md` (sinh từ cron, đừng sửa tay).
on:
  schedule:
    - cron: '45 15 * * *'   # 22:45 VN — sau lớp vét TỐI (CI 20:47 · local 21:15 · vét CI 21:47)
    - cron: '15 23 * * *'   # 06:15 VN hôm sau — sau lớp cuối SÁNG SỚM (… CI 04:47 · local 05:30)
    # 07:00 VN (28/07 gộp pipeline: 10:45 -> 06:20; 29/07 nới tiếp: 06:20 -> 07:00) — event-scan
    # gộp vào phiên SÁNG SỚM cùng ngày (xem BƯỚC 6 của web-scan-ci.md) nên lớp cuối của nó TRÙNG
    # lớp cuối web-scan sáng sớm (local 05:30), không còn mốc 09:45/10:15 riêng.
    # VÌ SAO KHÔNG PHẢI 06:20: lớp local 05:30 + jitter ~3'30 = 05:33, quét bản tin 16–21' (đo
    # thật) = ~05:54, rồi event-scan chạy TIẾP trong cùng session mất thêm ~15–25' = ~06:20 —
    # tức mốc cũ rơi ĐÚNG lúc phiên còn đang làm đúng việc của nó, và canary kêu oan. Cùng lỗi
    # với ca `toi` từng kêu lúc lớp vét (khi đó 22:00, nay 21:47) chưa gửi xong. 07:00 chừa
    # thêm ~40' biên.
    - cron: '0 0 * * *'     # 07:00 VN hôm sau — sau lớp cuối EVENT-SCAN (gộp, cùng mốc sáng sớm)
  workflow_dispatch:
    inputs:
      ca:
        description: 'Ca cần kiểm'
        required: true
        default: toi
        type: choice
        options: [toi, sang, sukien]

# CHỈ ĐỌC. Canary không commit, không push, không sửa gì — nó chỉ nhìn và kêu.
permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Chọn ca theo cron đã kích
        id: ca
        run: |
          case "${{ github.event.schedule }}" in
            "45 15 * * *") ca=toi    ;;
            "15 23 * * *") ca=sang   ;;
            "0 0 * * *")   ca=sukien ;;
            *)             ca="${{ inputs.ca }}" ;;   # chạy tay
          esac
          echo "ca=$ca" >> "$GITHUB_OUTPUT"
          echo "ca = $ca"

      - name: Kiểm và báo nếu hụt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/canary.py --ca "${{ steps.ca.outputs.ca }}"
