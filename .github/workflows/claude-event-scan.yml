name: Claude event-scan (phiên sáng)

# Quét SÁNG (sự kiện ngoại giao + tập trận, CN thêm báo cáo tuần) trên máy GitHub.
# Dùng chung khoá logs/state.json với bản local — bên nào claim trước, bên kia tự SKIP.
# Thiếu secret CLAUDE_CODE_OAUTH_TOKEN thì workflow tự bỏ qua êm (local vẫn quét như cũ).

on:
  schedule:
    - cron: '45 1 * * *'   # 08:45 VN — mốc chính
    - cron: '45 2 * * *'   # 09:45 VN — dự phòng, idempotent tự SKIP nếu đã xong
  workflow_dispatch:

concurrency:
  group: claude-event-scan
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # để kích notify-morning sau khi push sự kiện/báo cáo tuần

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kiểm tra secret
        id: gate
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Chưa có secret CLAUDE_CODE_OAUTH_TOKEN — bỏ qua (bản local trên Mac vẫn quét như cũ)."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - name: Git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "claude-scan-ci"
          git config user.email "noreply@anthropic.com"

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cài Claude Code
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Quét phiên sáng
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          TOOLS="Bash(git *),Bash(python3 *),Bash(ls *),Bash(cat *),Bash(grep *),Bash(head *),Bash(tail *),Bash(wc *),Bash(sort *),Bash(uniq *),Bash(cut *),Bash(tr *),Bash(sleep *),Bash(date *),Bash(TZ=*),Bash(echo *),Bash(mkdir *),Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Agent,Task,TodoWrite"
          claude -p "$(cat .github/prompts/event-scan-ci.md)" --allowedTools "$TOOLS" --max-turns 300 \
            || { echo "claude -p lỗi (mạng/server?) — retry sau 60s"; sleep 60; claude -p "$(cat .github/prompts/event-scan-ci.md)" --allowedTools "$TOOLS" --max-turns 300; }

      - name: Kích email sáng nếu có sự kiện/báo cáo tuần mới
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin main || true
          msg=$(git log -1 --format=%s)
          echo "HEAD: $msg"
          if echo "$msg" | grep -qiE '^(Cap nhat su kien|Dang bao cao tuan)'; then
            gh workflow run notify-morning.yml
          else
            echo "Không có commit sự kiện/báo cáo tuần mới — không kích email."
          fi
