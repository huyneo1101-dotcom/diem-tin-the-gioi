name: Đo ví nào trả tiền cho token CI

# Chạy TAY, không có lịch: đây là phép đo một câu hỏi hạ tầng ("CI đang đốt hạn mức của tài
# khoản nào"), không phải việc hằng ngày. Metadata của GitHub Secrets không khai chủ token nên
# không có cách nào trả lời từ bên ngoài; job này hỏi thẳng API danh tính bằng chính secret đó.
#
# Rẻ: một job ~20 giây, KHÔNG cài Claude Code, KHÔNG gọi model ⇒ không tốn hạn mức của ví nào.
# ⛔ Repo công khai nên log Actions ai cũng đọc được — script chỉ in dấu hiệu băm và mức gói,
#    không in email/tên/uuid. Bộ ca canh chính chiều đó: tests/test-do-vi-token.py.

on:
  workflow_dispatch:

jobs:
  do-vi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hỏi API danh tính bằng chính secret của CI
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 .github/scripts/do_vi_token.py
