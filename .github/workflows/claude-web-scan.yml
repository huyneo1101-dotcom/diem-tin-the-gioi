name: Claude web-scan (bản tin tối + sáng sớm)

# Quét bản tin trên máy GitHub — máy Mac tắt vẫn ra bản tin. 2 phiên/ngày cùng playbook
# 5 chủ đề: TỐI (ô khoá `toi`) và SÁNG SỚM 04:00 (ô khoá `sang`, có email như bản tối).
# Từ 27/07/2026 phiên SÁNG SỚM CÓ dự phòng local: CI 04:00 -> local 04:30 -> CI 05:00 -> local 05:30.
# Phiên TỐI neo theo HẠN CHÓT email 22:00: CI 21:00 -> local 21:15 (lớp cuối trong hạn) -> CI 22:00 (lớp vét).
# Dùng chung khoá logs/state.json với bản local (scheduled task trên Mac):
# bên nào claim trước thì bên kia tự SKIP, không quét chồng.
# Thiếu secret CLAUDE_CODE_OAUTH_TOKEN thì workflow tự bỏ qua êm (local vẫn quét như cũ).

on:
  schedule:
    # TỐI — neo theo hạn CHÓT của email: "email tin tối MUỘN NHẤT 22:00" (chỉ thị Huy 27/07/2026).
    # Phải tính ngược từ 22:00 cho MỐC CUỐI CÙNG của chuỗi, không phải cho mốc đầu: quét ~20'
    # (đo thật: CI 26/07 hết 20m45s, local 27/07 hết 16') + email ~20 giây => lớp cuối phải fire
    # chậm nhất 21:15, và lớp cuối phải là LOCAL vì cron GitHub hay trễ 5-20' bất định.
    # (21:15 chứ không phải 21:30: tối 26/07 mốc local 21:30 mãi 21:41 mới claim xong — trễ 11'
    #  vì jitter + khởi động session + git pull timeout — cộng 20' quét là email ~22:02, vỡ hạn.)
    # Phiên tối = 2 lớp TRONG HẠN + 1 lớp VÉT ngoài hạn:
    #   CI 21:00 (email ~21:22) -> local 21:15 (email ~21:37-21:50, lớp cuối trong hạn)
    #   -> CI 22:00 = LỚP VÉT, chỉ chạy khi cả hai lớp trên đều chết (GitHub bỏ cron + máy Mac ngủ).
    #      Email hôm đó tới ~22:22, tức QUÁ hạn 22:00 — chấp nhận có muộn còn hơn mất hẳn bản tin.
    # ĐỪNG dời 2 lớp đầu trễ hơn, và đừng biến lớp vét thành mốc chính: mốc cuối trong hạn phải là
    # local 21:15 (task riêng `web-scan-diem-tin-toi` trên máy Mac) vì cron GitHub trễ bất định.
    #
    # ⏱️ VÌ SAO PHÚT LẺ, KHÔNG PHẢI GIỜ TRÒN (đo thật 27/07/2026):
    # Cron GitHub xếp hàng chung toàn cầu, và mốc `:00`/`:05` là lúc hàng triệu job cùng dồn
    # vào. Đo 10 mốc của repo này trong 24h: 8 mốc CÓ chạy nhưng KHÔNG mốc nào đúng giờ —
    # 08:00 → 11:30 (trễ 3h30), 08:05 → 11:47, 08:45 → 12:30 (trễ 3h45), 21:00 → 22:09,
    # 22:00 → 22:54. Chính mốc 21:00 trễ 69' là thứ làm bản tin tối 26/07 vỡ hạn email 22:00.
    # => Dời sang phút LẺ, LÙI SỚM ~13' so với mốc cũ: trễ bao nhiêu cũng còn biên, mà nếu
    #    chạy đúng giờ thì chỉ sớm hơn 13 phút, không phá thiết kế lớp.
    # ⚠️ ĐỪNG "cho tròn lại cho đẹp" — giờ tròn chính là nguyên nhân.
    - cron: '47 13 * * *'   # 20:47 VN — bản tin TỐI, mốc chính (trước: 21:00)
    - cron: '47 14 * * *'   # 21:47 VN — LỚP VÉT (idempotent tự SKIP nếu 2 lớp trước đã xong)
    - cron: '47 20 * * *'   # 03:47 VN hôm sau — bản tin SÁNG SỚM, mốc chính (trước: 04:00)
    - cron: '47 21 * * *'   # 04:47 VN — sáng sớm, dự phòng CI (sau mốc local 04:30)
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal = bản tin thật đủ 5 chủ đề · test = quét ~3 tin, email gắn [QUET TEST]'
        type: choice
        options: [normal, test]
        default: normal

concurrency:
  group: claude-web-scan
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # để kích notify-email/notify-push sau khi push bản tin

jobs:
  scan:
    runs-on: ubuntu-latest
    # 130' chứ không phải 90': từ 28/07/2026 phiên SÁNG SỚM còn gộp thêm pipeline event-scan
    # (sự kiện/tập trận/think-tank, Chủ nhật +báo cáo tuần Opus) trong CÙNG job — xem BƯỚC 6
    # của .github/prompts/web-scan-ci.md. Phiên tối không đổi phạm vi nên vẫn dư thời gian.
    timeout-minutes: 130
    steps:
      - name: Kiểm tra secret
        id: gate
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Chưa có secret CLAUDE_CODE_OAUTH_TOKEN — bỏ qua (bản local trên Mac vẫn quét như cũ)."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - name: Ghi lại HEAD trước khi quét
        id: base
        if: steps.gate.outputs.run == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "claude-scan-ci"
          git config user.email "noreply@anthropic.com"

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cài Claude Code
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Quét bản tin
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODE: ${{ inputs.mode || 'normal' }}
          # 🔒 PHIÊN TEST KHÔNG ĐƯỢC ĐỤNG CỜ THẬT (vá gốc sự cố tối 29/07/2026).
          # Nhánh test đã cố tình KHÔNG truyền `tu_dong=1` để khỏi để dấu trong sổ đã gửi;
          # biến này là vế còn lại — khỏi để dấu trong cờ `logs/state.json`. Chiều 29/07 một
          # phiên MODE=test chạy 17:34 đã gọi `state.py done web-scan`, chiếm ô `toi` cả ngày,
          # mà commit của nó rơi ngoài khung giờ gửi nên không có email — CI 21:00, local 21:15
          # và CI 22:00 lần lượt exit 10 rồi SKIP, bản tin tối suýt mất trắng trong im lặng.
          # Đặt ở tầng `env:` của step chứ không nhét trong prompt: `claude -p` và mọi lệnh Bash
          # con đều thừa hưởng biến này -> cơ chế, không phải lời hứa (prompt có thể quên).
          # Bộ test canh: tests/test-cong-phien-test.py (có ca đọc chính file yml này).
          DIEMTIN_PHIEN_TEST: ${{ inputs.mode == 'test' && '1' || '0' }}
          # Mã riêng đọc/ghi 2 bảng `dt_*` trên Supabase — cần cho BƯỚC 3b của phiên TỐI:
          # `scripts/tin_jaylam.py` đọc hàng chờ tin Jay Lâm gửi rồi ghi lại tóm tắt + nguồn
          # (thêm 30/07/2026). Thiếu secret thì script in cảnh báo và bỏ qua bước đó — bản tin
          # vẫn ra, chỉ là mục 5 lùi về nguyên văn đã cắt. KHÔNG phải service key (mục
          # "ĐỌC dt_bot_hoi dùng MÃ RIÊNG" trong CLAUDE.md).
          DT_BOT_KEY: ${{ secrets.DT_BOT_KEY }}
        run: |
          PROMPT_FILE=.github/prompts/web-scan-ci.md
          if [ "$MODE" = "test" ]; then PROMPT_FILE=.github/prompts/web-scan-test.md; fi
          echo "MODE=$MODE PROMPT=$PROMPT_FILE"
          TOOLS="Bash(git *),Bash(python3 *),Bash(ls *),Bash(cat *),Bash(grep *),Bash(head *),Bash(tail *),Bash(wc *),Bash(sort *),Bash(uniq *),Bash(cut *),Bash(tr *),Bash(sleep *),Bash(date *),Bash(TZ=*),Bash(echo *),Bash(mkdir *),Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Agent,Task,TodoWrite"
          # --max-turns 700 (trước 500): phiên SÁNG SỚM từ 28/07/2026 gộp thêm pipeline
          # event-scan (BƯỚC 6 trong $PROMPT_FILE) ngay trong job này, cần thêm lượt.
          claude -p "$(cat $PROMPT_FILE)" --allowedTools "$TOOLS" --max-turns 700 \
            || { echo "claude -p lỗi (mạng/server?) — retry sau 60s"; sleep 60; claude -p "$(cat $PROMPT_FILE)" --allowedTools "$TOOLS" --max-turns 700; }

      - name: Kích email/push/morning nếu có bản tin hoặc sự kiện mới
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'normal' }}
        run: |
          git pull --rebase origin main || true
          # So với HEAD lúc bắt đầu job (không phải "commit cuối cùng") — từ 28/07/2026 phiên
          # SÁNG SỚM có thể tạo HAI commit riêng (bản tin + sự kiện, xem BƯỚC 6 của prompt);
          # `git log -1` chỉ thấy commit sau cùng và sẽ bỏ lọt commit bản tin phía trước.
          new_msgs=$(git log ${{ steps.base.outputs.sha }}..HEAD --format=%s)
          echo "Commit mới trong job này:"
          echo "$new_msgs"
          if echo "$new_msgs" | grep -qiE '^Cap nhat ban tin'; then
            if [ "$MODE" = "test" ]; then
              # KHÔNG truyền tu_dong: chạy test không được ghi sổ, y như người bấm tay.
              gh workflow run notify-email.yml -f subject_tag='[QUET TEST TU DONG] '
            else
              # tu_dong=1 -> notify-email ghi sổ đã gửi. Thiếu cờ này thì bản tin do CI ra
              # không vào sổ, và bản tin TỐI cùng ngày sẽ liệt kê lại tin đã gửi buổi sáng
              # (đo thật sáng 28/07/2026 — xem chú thích ở bước "Ghi sổ đã gửi").
              gh workflow run notify-email.yml -f tu_dong=1
              gh workflow run notify-push.yml || true
            fi
          else
            echo "Không có commit bản tin mới trong job này — không kích email bản tin."
          fi
          if [ "$MODE" != "test" ] && echo "$new_msgs" | grep -qiE '^(Cap nhat su kien|Dang bao cao tuan)'; then
            # Kích notify-morning.yml (email 🎖️ riêng) — trước 28/07/2026 việc này nằm ở
            # claude-event-scan.yml (đã xoá, gộp việc quét vào job này, xem BƯỚC 6 prompt).
            gh workflow run notify-morning.yml -f tu_dong=1
          fi
