name: Dò nguồn từ CI (Mỹ)

# Chạy `scripts/probe_sources.py` trên GitHub runner để biết nguồn nào đọc được TỪ MỸ —
# đối chiếu với bản dò trên máy Mac của Huy (DNS zone .mil fail ở local, còn CI thì được;
# ngược lại vài trang chặn IP datacenter GitHub nhưng mở từ máy Huy).
# Kết quả commit vào docs/probe-ci.json để so sánh.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # BẮT BUỘC: thiếu thư viện này thì probe chỉ đo bằng curl TRẦN, và curl trần bị Akamai/
      # Cloudflare cắt theo dấu vân tay TLS -> mọi nguồn loại đó bị chấm 403 rồi ghi vào bảng
      # thành "nguồn chết". Chính bằng cách đó `pacom.mil`/`navy.mil`/`marines.mil` bị xếp vào
      # nhóm "cả hai chịu" và harvest bỏ chúng. Script vẫn chạy khi thiếu, nhưng nó KÊU và số đo
      # của những domain đó không kết luận được.
      - name: Cài curl_cffi (giả vân tay TLS Chrome)
        run: python3 -m pip install --quiet curl_cffi || true
      - name: Dò nguồn
        run: python3 scripts/probe_sources.py --json docs/probe-ci.json --workers 12
      - name: Commit kết quả
        run: |
          git config user.name "claude-scan-ci"
          git config user.email "noreply@anthropic.com"
          git add docs/probe-ci.json
          git commit -m "probe: ket qua do nguon tu CI (My)" || echo "khong co thay doi"
          git pull --rebase origin main || true
          git push origin main
