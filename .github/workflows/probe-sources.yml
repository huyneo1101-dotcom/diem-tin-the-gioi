name: Dò nguồn từ CI (Mỹ)

# ⚠️ BẢN TẠM trên nhánh `scratch/do-ung-vien-html` (15/08/2026) — KHÔNG gộp vào main.
# Nhánh này mượn tên file `probe-sources.yml` vì `workflow_dispatch` chỉ kích được workflow đã
# có mặt trên nhánh MẶC ĐỊNH; workflow mới chỉ nằm ở nhánh phụ thì API không thấy để kích.
# Nội dung đã thay bằng lượt dò `do_ung_vien_html.py`, và **bỏ hẳn bước commit/push**: bản gốc
# đẩy thẳng lên `main`, mà chạy bản gốc từ một nhánh phụ tức là đẩy nội dung nhánh phụ đè lên
# main. Nhánh này xoá sau khi đọc xong kết quả.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # KHÔNG cài curl_cffi ở đây, khác hẳn bản gốc — và đây là chỗ dễ làm sai nhất.
      # Lớp [HTML] của `add_analyses.py` đi bằng `curl` TRẦN (xem `curl()` trong file ấy).
      # Dò bằng vân tay TLS Chrome sẽ chấm "khai được" cho trang mà lúc chạy thật lấy về trang
      # challenge, tức đẻ ra một bảng nguồn xanh giả. Đo phải khổ đúng bằng lúc chạy thật.
      - name: Dò ứng viên [HTML] + RSS
        run: python3 scripts/do_ung_vien_html.py --json /tmp/ung-vien-html.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ung-vien-html
          path: /tmp/ung-vien-html.json
