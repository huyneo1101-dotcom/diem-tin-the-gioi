name: Gom ứng viên tin từ CI (Mỹ)

# VÌ SAO CÓ WORKFLOW NÀY (dựng 27/07/2026)
# `harvest.py` có lớp [HTML] quét thẳng các trang không có RSS. Đo thật bằng
# `scripts/probe_sources.py` chạy ở CẢ hai nơi: runner GitHub (đặt ở Mỹ) đọc được 25 trang,
# máy Mac của Huy chỉ 10 — 21 domain CHỈ CI vào được, gồm TOÀN BỘ uỷ ban THƯỢNG VIỆN
# (chính là nhóm 1: điều trần + bỏ phiếu, nhóm luôn thiếu tin nhất) và 2 feed .mil mà
# máy Mac không phân giải nổi DNS zone `.mil`.
# Hệ quả trước đây: hôm nào lớp CI-quét-bằng-Claude chết (hết quota / GitHub bỏ cron) và
# phiên local phải gánh thì phần chênh đó MẤT TRẮNG.
# Workflow này tách riêng KHÂU THU THẬP: chạy thuần curl, KHÔNG gọi Claude, KHÔNG tốn quota,
# ~2-3 phút. Nó commit lô ứng viên vào docs/ung-vien-ci.json; phiên local `git pull` rồi
# `harvest.py --gop-ci` gộp lại. Nên kể cả khi lớp Claude trên CI chết, nguyên liệu vẫn
# được lấy từ Mỹ.
on:
  schedule:
    # Giờ UTC. VN = UTC+7. Chạy TRƯỚC mỗi mốc quét ~15 phút để lô còn tươi khi phiên local
    # đọc tới (harvest.py bỏ lô quá 4 tiếng). Cron của GitHub hay trễ 5-15 phút — trễ thì
    # phiên local chỉ mất phần CI-only chứ không hỏng, vì nó vẫn tự quét 3 lớp của mình.
    # Dời sớm 13' (20:45 → 20:32...) khi web-scan dời 21:00 → 20:47: harvest phải xong TRƯỚC
    # khi phiên quét bắt đầu, mà chênh 2 phút thì chỉ cần CI trễ tí là lô ứng viên tới muộn,
    # vô dụng. 15 phút là biên tối thiểu cho một lượt harvest (~1m08s) cộng độ trễ cron.
    - cron: '32 13 * * *'   # 20:32 VN — trước mốc TỐI (CI 20:47 · local 21:21)
    - cron: '32 14 * * *'   # 21:32 VN — trước lớp VÉT tối (CI 21:47)
    - cron: '32 20 * * *'   # 03:32 VN hôm sau — trước mốc SÁNG (CI 03:47 · local 04:33)
    - cron: '32 21 * * *'   # 04:32 VN — trước mốc sáng dự phòng (CI 04:47 · local 05:33)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harvest-ci
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Vân tay TLS Chrome — `harvest.curl` tự dùng khi curl trần bị chặn (xem chú thích
      # hàm đó). Runner Mỹ curl thẳng được phần lớn nguồn, NHƯNG probe 27/07 cho thấy CI
      # vẫn bị 403 ở FlightGlobal · Axios · The Aviationist — đúng chữ ký vân tay TLS, vì
      # cùng ba nguồn đó máy local curl lại lấy được. ~10 giây cài, đổi lấy 3 nguồn ở MỐC
      # CHÍNH. Thiếu gói thì harvest vẫn chạy và tự kêu tên nguồn đang mất, nên `|| true`
      # ở đây là fail-open CÓ TIẾNG chứ không phải nuốt lỗi.
      - name: Cài curl_cffi (giả vân tay TLS Chrome)
        run: python3 -m pip install --quiet curl_cffi || true

      - name: Gom ứng viên (RSS + HTML + Google News)
        run: python3 scripts/harvest.py --ci-out docs/ung-vien-ci.json

      # ⛔ CẤM `git pull --rebase` Ở ĐÂY (vá 01/08/2026 sau sự cố thật).
      # Bảng "file DÙNG CHUNG" trong CLAUDE.md xếp `docs/ung-vien-ci.json` vào nhóm 01 nguồn
      # ghi — "rebase không có gì để xung đột". Đo bằng `git log --format='%an'` thì đúng: chỉ
      # một tác giả. Nhưng phép đo ấy đếm TÁC GIẢ, không đếm LƯỢT CHẠY — và HAI LƯỢT của CHÍNH
      # workflow này cũng là hai nguồn ghi. Sự cố 01/08: hai `workflow_dispatch` lúc 13:45:08 và
      # 13:45:11 (hai phiên cùng kích tay); `concurrency` xếp hàng đúng nên lượt 2 chạy SAU, rồi
      # `pull --rebase` phát lại commit của mình lên commit lượt 1 — cùng sửa một chỗ trong JSON
      # nên xung đột, và rebase hỏng để repo ở trạng thái dở nên CẢ 5 vòng retry chết tiếp.
      # `cancel-in-progress: false` KHÔNG cứu được: nó chống chạy chồng, không chống rebase.
      - name: Commit lô ứng viên
        run: |
          git config user.name "claude-scan-ci"
          git config user.email "noreply@anthropic.com"
          git diff --quiet -- docs/ung-vien-ci.json && { echo "khong co thay doi"; exit 0; }
          # KHONG dung `git pull --rebase` — xem chu thich ngay duoi.
          # Lo ung vien la file GHI DE (khong phai append), nen hop nhat dung la:
          # lay dinh remote moi nhat roi ghi de lai lo cua minh len do.
          cp docs/ung-vien-ci.json /tmp/lo-cua-minh.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed FETCH_HEAD
            cp /tmp/lo-cua-minh.json docs/ung-vien-ci.json
            git add docs/ung-vien-ci.json
            git diff --cached --quiet && { echo "lo trung voi ban tren remote"; exit 0; }
            git commit -m "harvest: lo ung vien gom tu CI (My)"
            git push origin HEAD:main && exit 0
            echo "push lan $i bi chen, lay lai dinh moi sau 10s"
            sleep 10
          done
          echo "::error::khong push duoc lo ung vien sau 5 lan thu"
          exit 1
