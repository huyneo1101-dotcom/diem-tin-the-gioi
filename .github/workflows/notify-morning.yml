name: Email sáng — sự kiện & báo cáo tuần

# Chạy khi phiên QUÉT SÁNG push index.html. Gửi newsletter buổi sáng khi có sự kiện
# ngoại giao/tập trận mới cập nhật HOẶC báo cáo tuần mới (gộp chung nếu cùng ngày).
# Gate theo commit message để KHÔNG bắn khi push bản tin tối ("Cap nhat ban tin") hay
# khi sửa code/UI. So diff với commit trước để biết cái gì thật sự mới.
on:
  push:
    branches: [main]
    paths: ['index.html']
  workflow_dispatch:
    inputs:
      tu_dong:
        description: '1 = do phiên event-scan CI tự kích (được ghi sổ). Bấm tay thì để trống.'
        required: false
        default: ''

# Cần `write` để bước cuối commit sổ đã gửi (logs/da-gui-email.json).
permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 0 chứ không phải 2: bước ghi sổ phải `git pull --rebase` được, mà rebase trên bản
          # checkout nông thì hỏng. Bước so diff vẫn cần ít nhất HEAD~1.
          fetch-depth: 0

      - name: Xác định có phải commit quét sáng / báo cáo tuần không
        id: chk
        run: |
          msg=$(git log -1 --format=%s)
          echo "commit: $msg ; event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || echo "$msg" | grep -qiE '^(Cap nhat su kien|Dang bao cao tuan)'; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Lấy bản index.html của commit trước (để so cái gì mới)
        if: steps.chk.outputs.go == '1'
        run: |
          git show HEAD~1:index.html > /tmp/prev-index.html 2>/dev/null || echo "" > /tmp/prev-index.html
          echo "PREV_HTML=/tmp/prev-index.html" >> "$GITHUB_ENV"
          # Bài think-tank tách ra file riêng 30/07/2026 — thiếu dòng này thì diffAnalyses
          # so với mảng rỗng và coi CẢ KHO 442 bài là "vừa nạp sáng nay".
          # ⚠️ KHÔNG fallback về "[]": commit HEAD~1 có thể chưa có file (đúng ca commit tách
          # đầu tiên, hoặc lịch sử bị cắt nông). Mảng rỗng đọc thành "trước đây chưa có bài nào"
          # → email liệt kê nguyên kho. Lấy được thì khai PREV_ANALYSES, không thì BỎ HẲN biến
          # để send-morning-email.js tự lùi về dấu `_addedDate` — thà bỏ sót một email còn hơn
          # gửi 442 bài như thể vừa nạp sáng nay.
          if git show HEAD~1:data/analyses.json > /tmp/prev-analyses.json 2>/dev/null; then
            echo "PREV_ANALYSES=/tmp/prev-analyses.json" >> "$GITHUB_ENV"
          else
            echo "::notice::HEAD~1 chưa có data/analyses.json — diffAnalyses lùi về dấu _addedDate."
          fi

      - name: Setup Node
        if: steps.chk.outputs.go == '1'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Gửi email sáng
        if: steps.chk.outputs.go == '1'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO || 'lamgiaphat1603@gmail.com,huyneo1101@gmail.com' }}
          TELEGRAM_PAYLOAD: /tmp/morning-telegram.json
          # TẮT EMAIL — chỉ thị Huy 27/07/2026. Script VẪN chạy tới cuối vì đây là chỗ duy
          # nhất biết "hôm nay có gì mới" và ghi payload cho Telegram; chỉ khâu sendMail bị
          # bỏ. Đổi thành '1' là bật lại email sáng.
          GUI_EMAIL: '0'
        run: |
          npm install nodemailer@6 --no-save
          node .github/scripts/send-morning-email.js

      # ⚠️ TELEGRAM LÀ KÊNH DUY NHẤT (email đã tắt 27/07/2026) -> BỎ `continue-on-error`:
      # hỏng phải làm job ĐỎ, chứ không để Huy mất bản tin trong im lặng.
      # Không có payload (không có gì mới) thì script vẫn tự thoát êm exit 0 — gate khớp với
      # bản email vì cả hai đọc chung quyết định do send-morning-email.js ghi ra.
      - name: Gửi Telegram (sự kiện & tập trận)
        if: steps.chk.outputs.go == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PAYLOAD: /tmp/morning-telegram.json
        run: python3 .github/scripts/send_telegram.py --morning

      # GHI SỔ ĐÃ GỬI — CHỈ `events`, vì email này chỉ gửi sự kiện + tập trận. Ghi thêm
      # usNews/worldNews ở đây là XOÁ SỔ tin thường trước khi chúng kịp lên bản tin tối
      # (mất tin, chứ không phải trùng tin). Nhờ bước này bản tối không lặp lại sự kiện đã
      # gửi sáng — chỉ thị Huy 27/07. Chỉ đụng logs/ nên không tự kích lại workflow.
      # Chỉ ghi khi là lần gửi THẬT do phiên quét push — chạy tay là để test, xem lý do ở
      # bước cùng tên trong notify-email.yml (sự cố 27/07).
      # Cùng lớp lỗi với notify-email (vá 28/07/2026): phiên event-scan CI kích bằng
      # `gh workflow run` nên là `workflow_dispatch`, điều kiện cũ `event_name == 'push'`
      # loại sạch. Phân biệt bằng Ý ĐỊNH `tu_dong`, không bằng kiểu sự kiện.
      # ⚠️ KHỐI `git pull --rebase` CŨ ĐÃ BỎ (vá 30/07/2026). Workflow này và
      # `notify-email.yml` ghi CÙNG file `logs/da-gui-email.json` cách nhau 07 GIÂY trong
      # phiên sáng (21:28:01Z vs 21:28:08Z — hệ quả của việc gộp event-scan vào cùng session
      # ngày 28/07, trước đó hai bên cách ~4 tiếng). Rebase xung đột rồi 5 vòng retry chết
      # tiếp ⇒ sổ trống dù bản tin đã gửi. Luật hợp nhất sổ nay ở ĐÚNG MỘT chỗ:
      # `ghi_so_push.py` (append-only: lấy sổ mới nhất của remote rồi ghi lại dòng của
      # mình, KHÔNG rebase). Bộ test canh: `tests/test-ghi-so-push.py`.
      - name: Ghi sổ đã gửi (chỉ sự kiện)
        if: steps.chk.outputs.go == '1' && (github.event_name == 'push' || inputs.tu_dong == '1')
        continue-on-error: true
        run: |
          pip install --quiet python-docx
          python3 .github/scripts/ghi_so_push.py --buoi sukien --chi events \
            --nhan "so: ghi su kien da gui email sang"
